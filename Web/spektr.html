<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E1220">
<title>Спектр</title>
<style>
:root{--bg:#0E1220;--panel:#171D30;--line:#2A3350;--txt:#E8ECF8;--dim:#8A93B0;--gold:#F5C542;--good:#3DDC84;--bad:#FF5A5A;--nt:#9AA3BF}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font-family:Rubik,system-ui,-apple-system,sans-serif;min-height:100vh}
#app{max-width:520px;margin:0 auto;padding:12px 16px 40px}
.top{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px}
.ava{width:40px;height:40px;border-radius:10px;background:#fff;color:#111;display:flex;align-items:center;justify-content:center;font-weight:700;flex:0 0 auto}
.nick{font-weight:700}
.rate{margin-left:auto;text-align:right}
.rate b{font-size:20px}
.lg{font-size:12px;font-weight:700}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:12px}
h2{font-size:17px;margin:16px 0 8px}
h3{font-size:16px;margin:12px 0 6px}
.btn{display:block;width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:#222A44;color:var(--txt);font-size:15px;margin-top:8px;cursor:pointer;text-align:left;font-family:inherit}
.btn:disabled{opacity:.4;cursor:default}
.btn.gold{background:var(--gold);color:#111;border-color:var(--gold);font-weight:700;text-align:center}
.btn.here{border-color:var(--gold)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.sq{width:120px;height:120px;background:#fff;color:#111;border-radius:10px;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px;font-weight:700;font-size:14px;cursor:pointer;flex:0 0 auto}
.sq.big{width:160px;height:160px;font-size:17px}
.sq.used{opacity:.3}
.bonus{font-weight:700;margin-top:10px;font-size:15px}
.plus{color:var(--good)}.minus{color:var(--bad)}.rand{color:var(--gold)}.nt{color:var(--nt)}
.dim{color:var(--dim);font-size:13px}
.log{font-size:14px;line-height:1.45;background:#11162A;border-radius:10px;padding:10px;margin-top:10px}
.log div{margin-bottom:4px}
.trophy{display:inline-block;margin:4px 4px 0 0;padding:6px 8px;border:1px solid var(--gold);border-radius:8px;color:var(--gold);font-size:12px}
.tile{display:flex;justify-content:space-between;align-items:center}
input,select{width:100%;padding:11px;border-radius:10px;border:1px solid var(--line);background:#0B0F1C;color:var(--txt);font-size:16px;font-family:inherit}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl td{padding:6px 4px;border-bottom:1px solid var(--line)}
.week{display:flex;align-items:center;justify-content:space-between;gap:10px}
.week h2{margin:0}
.inds{display:flex;gap:6px}
.ind{width:20px;height:20px;border-radius:4px;background:#3A7BFF;display:inline-block}
.ind.off{background:#2A3350;opacity:.7}
.mapph{height:180px;background:#fff;color:#111;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:700;margin-bottom:8px}
.arow{display:flex;gap:12px;align-items:stretch;background:#222A44;border-radius:12px;padding:8px;margin-top:8px;cursor:pointer}
.pic{width:84px;height:116px;background:#fff;color:#111;border-radius:8px;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:700;font-size:12px;padding:4px;flex:0 0 84px}
.arow .tx{flex:1;min-width:0}
.ttl{font-weight:700;font-size:15px}
.ds{font-size:13px;color:var(--dim);margin-top:4px}
</style></head>
<body><div id="app"></div>
<script>
'use strict';
const KEY = 'spektr.v2';
const app = document.getElementById('app');
let S = null;

// ---------- утилиты ----------
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rnd(0, i); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const C = (t, k, v, d) => ({ t, k, v, d });            // карточка действия: t название, k тип, v эффект силы, d длительность
const TEXT = 'Текст будет задан.';
const COUNTRIES = { RU: 'Россия', US: 'США', CN: 'Китай', KR: 'Корея', GB: 'Великобритания', DE: 'Германия', FR: 'Франция', JP: 'Япония', BR: 'Бразилия', CA: 'Канада' };
const flagOf = code => code ? String.fromCodePoint(...[...code].map(ch => 127397 + ch.charCodeAt(0))) : '';

// ---------- регионы (15 действий каждый) ----------
const REGIONS = [
  { name: 'Америка', league: 'United Spectre Association', cards: [
    C('Тусовка в компании', 'p', 5, 'next'), C('Фитнес-тренировка', 'p', 3, 'turn'), C('Интервью для местного канала', 'p', 2, 'turn'),
    C('Бессонная ночь в Вегасе', 'm', -3, 'turn'), C('Простуда после кондиционера', 'm', -2, 'turn'),
    C('Казино', 'r', 5, 'turn'),
    C('Пляж', 'n'), C('Атракционы', 'n'), C('Комик-кон', 'n'), C('Съёмка в подкасте', 'cond'), C('Прогулка по Голливуду', 'n'),
    C('Визит в музей', 'n'), C('Кинопросмотр', 'n'), C('Гастро-тур по Нью-Йорку', 'n'), C('Поход в национальный парк', 'n') ] },
  { name: 'Европа', league: 'Объединённая европейская лига Спектров (LCS)', cards: [
    C('Лекция в Оксфорде', 'p', 5, 'next'), C('Тренировка в Берлине', 'p', 3, 'turn'), C('Интервью для парижского журнала', 'p', 2, 'turn'),
    C('Бюрократия', 'm', -3, 'turn'), C('Лондонский дождь и простуда', 'm', -2, 'turn'),
    C('Ставки в Монако', 'r', 5, 'turn'),
    C('Пляж в Ницце', 'n'), C('Экскурсия по Риму', 'n'), C('Концерт в Вене', 'n'), C('Прогулка по Лондону', 'n'), C('Поход в Лувр', 'n'),
    C('Фестиваль пива в Мюнхене', 'n'), C('Визит в Эрмитаж', 'n'), C('Поход в Альпы', 'n'), C('Шоппинг в Милане', 'n') ] },
  { name: 'Россия', league: 'Северная Континентальная лига Спектров', cards: [
    C('Тренировочный лагерь под Москвой', 'p', 5, 'next'), C('Интервью для спортивного канала', 'p', 3, 'turn'), C('Тренировка с тренером в спортзале', 'p', 2, 'turn'),
    C('Пробка на МКАДе', 'm', -3, 'turn'), C('Простуда', 'm', -2, 'turn'),
    C('Лотерея в Сочи', 'r', 5, 'turn'),
    C('Пляж в Сочи', 'n'), C('Экскурсия по Красной площади', 'n'), C('Поход на балет', 'n'), C('Прогулка по парку', 'n'), C('Поход в Третьяковскую галерею', 'n'),
    C('Фестиваль в Казани', 'n'), C('Вечер с настолками с друзьями', 'n'), C('Поездка в Кижи', 'n'), C('Шопинг в ГУМе', 'n') ] },
  { name: 'Китай', league: 'Азиатская лига Спектров (ASL)', cards: [
    C('Мастер-класс по кунфу', 'p', 5, 'next'), C('Тренировка в Шаолине', 'p', 3, 'turn'), C('Интервью для пекинского канала', 'p', 2, 'turn'),
    C('Поход в горы Чжанцзяцзе', 'm', -2, 'next'), C('Отравление уличной едой', 'm', -2, 'turn'),
    C('Лотерея в Макао', 'r', 5, 'turn'),
    C('Пляж в Санье', 'n'), C('Экскурсия на Великую китайскую стену', 'n'), C('Поход в Запретный город', 'n'), C('Прогулка по Бунду', 'n'), C('Чайная церемония', 'n'),
    C('Поход на китайский рынок', 'n'), C('Фестиваль фонариков', 'n'), C('Поход на оперу в Пекине', 'n'), C('Шоппинг на Нанкинской улице', 'n') ] },
  { name: 'Корея', league: 'Звёздная серия (SSS)', cards: [
    C('Тренировка в спортзале Сеула', 'p', 5, 'next'), C('Тренировка с корейским тренером', 'p', 3, 'turn'), C('Интервью для корейского канала', 'p', 2, 'turn'),
    C('Бессонная ночь в караоке', 'm', -3, 'turn'), C('Попробовать деликатес', 'm', -2, 'turn'),
    C('Игровой автомат в Пусане', 'r', 5, 'turn'),
    C('Пляж на Чеджу', 'n'), C('Попробовать местную кухню', 'n'), C('Поход на башню Намсан', 'n'), C('Прогулка по Ханоку', 'n'), C('Поход на K-pop шоу', 'n'),
    C('Посетить игровое кафе', 'n'), C('Фестиваль весенних цветов', 'n'), C('Поход в горы Букхан', 'n'), C('Шопинг в Мёндоне', 'n') ] }
];
// ---------- общие действия (20 штук, по 3 в ход вместе с региональными) ----------
const GENERIC = [
  C('Утренняя пробежка', 'p', 1, 'turn'), C('Лекция у тренера', 'p', 2, 'turn'), C('Ночной разбор записей', 'p', 3, 'turn'), C('Бессонная ночь', 'm', -3, 'turn'),
  C('Прогулка по городу', 'n'), C('Визит к массажисту', 'n'), C('Поход в кафе', 'n'), C('Чтение новостей о турнирах', 'n'), C('Просмотр стримов соперников', 'n'),
  C('Встреча с фанатами', 'n'), C('Фотосессия для журнала', 'n'), C('Ремонт экипировки', 'n'), C('Поход в магазин', 'n'), C('Прослушивание музыки перед боем', 'n'),
  C('Звонок семье', 'n'), C('Осмотр метеоритного камня', 'n'), C('Выставка технологий', 'n'), C('Экскурсия по лиге', 'n'), C('Посещение спортзала', 'n'), C('Игра в настолки с командой', 'n')
];
const TIERS = [
  { name: 'Турнир новичков', lo: 10, hi: 25, gain: 1 },
  { name: 'Любительский турнир', lo: 22, hi: 37, gain: 2 },
  { name: 'Полупрофессиональный турнир', lo: 40, hi: 55, gain: 5 }
];
const POWER_TOURNEY_CAP = 65;
const LEAGUES = [
  { min: 3000, n: 'Мастер', c: '#FF7AE6' }, { min: 2500, n: 'Алмаз', c: '#7AE7FF' }, { min: 2000, n: 'Платина', c: '#B8F2E6' },
  { min: 1500, n: 'Золото', c: '#F5C542' }, { min: 1000, n: 'Серебро', c: '#D0D6E6' }, { min: 0, n: 'Бронза', c: '#D08A4E' }
];
const leagueOf = r => LEAGUES.find(l => r >= l.min);

// ---------- сохранение ----------
function load() { try { const v = JSON.parse(localStorage.getItem(KEY) || 'null'); return v && v.v === 2 ? v : null; } catch (e) { return null; } }
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

function newHero(nick, country) {
  return { v: 2, nick, country, power: 30, rating: 0, ladderGames: 0, region: 0, turn: 1, actions: 3, hand: [], jetlag: 0,
           effects: [], tier: 0, trophies: [], read: {}, log: ['Добро пожаловать в Спектр. Ход 1.'], view: 'main', sel: null, tourCount: 0 };
}

// ---------- механика ----------
const drawHand = () => shuffle([...REGIONS[S.region].cards, ...GENERIC]).slice(0, 3).map(c => ({ ...c }));
const effPower = () => { let p = S.power; for (const e of S.effects) if (e.from <= S.turn && S.turn <= e.to) p += e.v; if (S.jetlag) p -= 5; return p; };
const addEff = (v, d) => { const from = d === 'next' ? S.turn + 1 : S.turn; S.effects.push({ v, from, to: from }); };
const clearJet = () => { S.jetlag = 0; };
const spend = () => { if (S.actions <= 0) return false; S.actions--; return true; };
const logMsg = m => { S.log.unshift(m); S.log = S.log.slice(0, 6); };
const winProb = (mine, theirs) => 1 / (1 + Math.pow(10, (theirs - mine) / 20));
const npcRating = p => p * 20;                 // у соперников рейтинг основан на силе
function endTurn() {
  S.turn++; S.actions = 3;
  S.effects = S.effects.filter(e => e.to >= S.turn);
  S.hand = drawHand();
  S.view = 'main'; S.sel = null;
  logMsg('Ход ' + S.turn + '.');
  save();
}
function useCard(i) {
  const c = S.hand[i];
  if (!c || !spend()) return;
  clearJet();
  let msg;
  if (c.k === 'p' || c.k === 'm') { addEff(c.v, c.d); msg = c.k === 'p' ? 'Бонус!' : 'Эффект!'; }
  else if (c.k === 'r') { const v = Math.random() < 0.5 ? 5 : -5; addEff(v, 'turn'); msg = v > 0 ? 'Бонус!' : 'Эффект!'; }
  else if (c.k === 'cond') {
    if (S.power > 65) { S.rating += 20; msg = 'Бонус! +20 рейтинга.'; } else msg = 'Ничего не произошло: нужна сила выше 65.';
  } else msg = 'Без эффекта.';
  S.hand.splice(i, 1);
  logMsg(c.t + ': ' + msg);
  S.view = 'main'; S.sel = null; save();
}
function bureauFight(kind) {
  if (!spend()) return;
  const opp = { p: rnd(70, 100) };
  const won = Math.random() < winProb(effPower(), opp.p);
  let d;
  if (kind === 'ladder') {
    const big = S.ladderGames < 10;
    d = won ? (big ? 100 : 20) : -(big ? 100 : 25);
    S.ladderGames++;
  } else d = won ? 20 : -20;
  S.rating = Math.max(0, S.rating + d);
  logMsg((kind === 'ladder' ? 'Лестничный матч' : 'Бой с про-игроком') + ' · соперник ' + npcRating(opp.p) + ': ' + (won ? 'победа' : 'поражение') + ' (' + (d > 0 ? '+' : '') + d + ' рейтинга).');
  save();
}
function playTour(t) {
  const T = TIERS[t];
  if (t > S.tier) return;
  let rounds = 0, won = true;
  for (let r = 0; r < 3; r++) {
    const opp = rnd(T.lo, T.hi);
    if (Math.random() < winProb(effPower(), opp)) rounds++; else { won = false; break; }
  }
  if (won) {
    if (!S.trophies.includes(T.name)) S.trophies.push(T.name);
    if (t + 1 > S.tier && t + 1 <= 2) S.tier = t + 1;
    S.power = Math.max(S.power, Math.min(POWER_TOURNEY_CAP, S.power + T.gain));
    logMsg(T.name + ': победа! Трофей в коллекции.');
  } else logMsg(T.name + ': поражение в раунде ' + (rounds + 1) + '.');
  save();
}

// ---------- виды ----------
const topBar = () => {
  const lg = leagueOf(S.rating);
  return `<div class="top"><div class="ava">${esc(S.nick.slice(0, 2).toUpperCase())}</div>
    <div><div class="nick">${esc(S.nick)} ${flagOf(S.country)}</div><div class="dim">${REGIONS[S.region].name} · ${REGIONS[S.region].league}</div></div>
    <div class="rate"><div class="lg" style="color:${lg.c}">${lg.n}</div><b>${S.rating}</b></div></div>`;
};
const labelOf = c => {
  if (c.k === 'p') return '<div class="bonus plus">Бонус!</div>';
  if (c.k === 'm') return '<div class="bonus minus">Эффект!</div>';
  if (c.k === 'r') return '<div class="bonus rand">Случайно: бонус или эффект</div>';
  if (c.k === 'cond') return '<div class="bonus nt">Условие: сила выше 65</div>';
  return '<div class="bonus nt">Без эффекта</div>';
};
const logHtml = () => `<div class="log">${S.log.map(m => `<div>${esc(m)}</div>`).join('')}</div>`;
const trophiesHtml = () => S.trophies.length ? `<h2>Коллекция</h2><div>${S.trophies.map(t => `<span class="trophy">${esc(t)}</span>`).join('')}</div>` : '';
const back = `<button class="btn" data-a="back">Назад</button>`;
const wrap = inner => `${topBar()}${inner}`;

function viewMain() {
  const done = S.actions <= 0;
  const ind = [0, 1, 2].map(i => `<span class="ind ${i < S.actions ? '' : 'off'}"></span>`).join('');
  const rows = S.hand.length
    ? S.hand.map((c, i) => `<div class="arow" data-a="card" data-v="${i}"><div class="pic">${esc(c.t)}</div><div class="tx"><div class="ttl">${esc(c.t)}</div><div class="ds">${TEXT}</div></div></div>`).join('')
    : '<div class="dim">Набор на неделю пуст.</div>';
  return wrap(`
    <div class="card week"><div><h2>Неделя ${S.turn}</h2>${S.jetlag ? '<div class="minus">Джетлаг!</div>' : ''}</div><div class="inds">${ind}</div></div>
    <div class="card">
      <h2>Карта мира</h2>
      <div class="mapph">Карта</div>
      ${REGIONS.map((r, i) => `<button class="btn ${i === S.region ? 'here' : ''}" data-a="noop">${r.name}${i === S.region ? ' · здесь' : ''}</button>`).join('')}
    </div>
    <div class="card">
      <h2>Повседневные действия</h2>
      <button class="btn" data-a="lib" ${done ? 'disabled' : ''}>Сходить в библиотеку</button>
      <button class="btn" data-a="tour" ${done ? 'disabled' : ''}>Участвовать в местном турнире</button>
      <button class="btn" data-a="rest" ${done ? 'disabled' : ''}>Отдых</button>
      <button class="btn" data-a="bureau" ${done ? 'disabled' : ''}>Сходить в бюро</button>
      <button class="btn" data-a="flight" ${done ? 'disabled' : ''}>Перелёт в другой регион</button>
      <button class="btn" data-a="pass">Пропустить неделю</button>
      ${done ? '<button class="btn gold" data-a="next">Следующая неделя</button>' : ''}
    </div>
    <div class="card">
      <h2>Действия региона</h2>
      ${rows}
    </div>
    ${trophiesHtml()}
    ${logHtml()}`);
}
function viewCard() {
  const c = S.hand[S.sel];
  if (!c) { S.view = 'main'; return viewMain(); }
  return wrap(`
    <div class="card" style="text-align:center">
      <div class="sq big" style="margin:0 auto">${esc(c.t)}</div>
      <h2>${esc(c.t)}</h2>
      <div style="text-align:left">${TEXT}</div>
      ${labelOf(c)}
    </div>
    <button class="btn gold" data-a="use" ${S.actions <= 0 ? 'disabled' : ''}>Использовать (1 действие)</button>
    ${back}`);
}
function viewLib() {
  const r = REGIONS[S.region];
  const seen = S.read[S.region] || [];
  let idx = [...Array(10).keys()].filter(i => !seen.includes(i));
  if (!idx.length) { S.read[S.region] = []; idx = [...Array(10).keys()]; }
  const i = idx[rnd(0, idx.length - 1)];
  S.read[S.region] = [...(S.read[S.region] || []), i];
  save();
  return wrap(`<div class="card" style="text-align:center"><div class="sq big" style="margin:0 auto">Библиотека</div>
    <h2>Заметка ${i + 1} · ${esc(r.name)}</h2><div style="text-align:left">${TEXT}</div><div class="bonus nt">Без эффекта</div></div>${back}`);
}
function viewRest() {
  return wrap(`<div class="card" style="text-align:center"><div class="sq big" style="margin:0 auto">Отдых</div>
    <h2>Отдых</h2><div style="text-align:left">${TEXT}</div><div class="bonus plus">Бонус!</div></div>${back}`);
}
function viewTour() {
  return wrap(`<div class="card"><h2>Местный турнир</h2><div class="dim">Открыто уровней: ${S.tier + 1} из 3</div>
    ${TIERS.map((t, i) => `<button class="btn" data-a="play" data-v="${i}" ${i > S.tier ? 'disabled' : ''}>${t.name}${i > S.tier ? ' · закрыт' : ''}${S.trophies.includes(t.name) ? ' · трофей есть' : ''}</button>`).join('')}
    </div>${logHtml()}${back}`);
}
function viewBureau() {
  const lg = leagueOf(S.rating);
  const rows = ['Команда A', 'Команда B', 'Команда C', 'Команда D'].map((n, i) => `<tr><td>${i + 1}</td><td>${n}</td><td>${(4 - i) * 100}</td></tr>`).join('');
  return wrap(`
    <div class="card"><h2>Бюро</h2>
      <div class="dim">Всемирная организация Спектров: турниры, поединки, рейтинговая система. Рейтинг у игрока ведётся по боям здесь.</div>
      <div class="dim" style="margin-top:6px">Твой рейтинг: <b>${S.rating}</b> · <span style="color:${lg.c}">${lg.n}</span></div>
    </div>
    <div class="card"><h3>Таблица местной лиги</h3><div class="dim">Заглушка: данные лиги появятся позже.</div>
      <table class="tbl">${rows}</table>
      <h3>Ближайшие 3 матча</h3><div class="dim">Заглушка: расписание лиги появится позже.</div>
    </div>
    <div class="card">
      <button class="btn" data-a="fight" data-v="pro" ${S.actions <= 0 ? 'disabled' : ''}>Бой с случайным про-игроком региона (1 действие)</button>
      <button class="btn" data-a="fight" data-v="ladder" ${S.actions <= 0 ? 'disabled' : ''}>Лестничный матч на рейтинг (1 действие)</button>
      <div class="dim" style="margin-top:6px">Бой с про-игроком: +20 или −20 рейтинга. Лестничный матч: первые 10 матчей +100 или −100, дальше +20 или −25.</div>
    </div>${logHtml()}${back}`);
}
function viewFlight() {
  return wrap(`<div class="card"><h2>Перелёт</h2><div class="dim">Перелёт стоит 1 действие. Затем джетлаг до конца хода.</div>
    ${REGIONS.map((r, i) => `<button class="btn" data-a="fly" data-v="${i}" ${i === S.region ? 'disabled' : ''}>${r.name}</button>`).join('')}
    </div>${back}`);
}
let setupNick = '', setupFlag = 'RU', setupErr = '';
function viewSetup() {
  return `<div class="card" style="margin-top:24px"><h2>Создание персонажа</h2>
    <div class="row" style="align-items:flex-start;flex-wrap:nowrap">
      <div class="sq" style="width:140px;height:140px;font-size:18px;flex:0 0 140px">Лицо</div>
      <div style="flex:1"><div class="dim">Ник</div><input id="nick" maxlength="16" placeholder="Введи ник" value="${esc(setupNick)}"></div>
    </div>
    <div class="dim" style="margin-top:14px">Флаг</div>
    <div class="row">${Object.keys(COUNTRIES).map(k => `<button class="btn ${k === setupFlag ? 'here' : ''}" style="width:auto;flex:1 0 auto;text-align:center;font-size:22px;padding:8px 12px" data-a="flag" data-v="${k}">${flagOf(k)}</button>`).join('')}</div>
    <div class="dim" style="margin-top:6px">${COUNTRIES[setupFlag]}</div>
    <button class="btn gold" data-a="start" style="margin-top:16px">Начать</button>
    <div class="minus" style="margin-top:8px">${esc(setupErr)}</div>
  </div>`;
}

const VIEWS = { main: viewMain, card: viewCard, lib: viewLib, rest: viewRest, tour: viewTour, bureau: viewBureau, flight: viewFlight };
function render() {
  if (!S) { app.innerHTML = viewSetup(); return; }
  const v = VIEWS[S.view] || viewMain;
  app.innerHTML = v();
}

// ---------- действия ----------
function act(a, v) {
  if (!S && a !== 'start' && a !== 'flag') return;
  const inp = document.getElementById('nick');
  if (!S && inp) setupNick = inp.value;
  switch (a) {
    case 'flag': setupFlag = v; setupErr = ''; break;
    case 'start': {
      const nick = setupNick.trim();
      if (!nick) { setupErr = 'Введи ник, чтобы начать.'; break; }
      S = newHero(nick, setupFlag); S.hand = drawHand(); setupErr = ''; save(); break;
    }
    case 'card': S.view = 'card'; S.sel = +v; break;
    case 'use': useCard(S.sel); break;
    case 'back': S.view = 'main'; S.sel = null; break;
    case 'lib': if (spend()) { clearJet(); S.view = 'lib'; } break;
    case 'rest': if (spend()) { clearJet(); S.power += 5; logMsg('Отдых: бонус.'); S.view = 'rest'; } break;
    case 'tour': if (spend()) { clearJet(); S.view = 'tour'; } break;
    case 'play': playTour(+v); break;
    case 'bureau': if (spend()) { clearJet(); S.view = 'bureau'; } break;
    case 'fight': bureauFight(v); break;
    case 'flight': if (S.actions > 0) S.view = 'flight'; break;
    case 'fly': if (spend()) { S.region = +v; S.jetlag = 1; logMsg('Перелёт в ' + REGIONS[S.region].name + '. Джетлаг до конца хода.'); S.view = 'main'; } break;
    case 'pass': clearJet(); logMsg('Ход пропущен.'); endTurn(); break;
    case 'next': endTurn(); break;
    default: return;
  }
  if (S) save();
  render();
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-a]');
  if (!t || t.disabled || t.dataset.a === 'noop') return;
  act(t.dataset.a, t.dataset.v);
});
window.addEventListener('error', e => { app.insertAdjacentHTML('afterbegin', '<pre style="color:#FF5A5A;white-space:pre-wrap;font-size:12px">Ошибка: ' + esc(e.message) + ' (' + (e.lineno || '?') + ')</pre>'); });
S = load();
render();
</script></body></html>
