<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Спектр</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@1,800;1,900&display=swap">
<style>
:root{--bg:#0E1220;--panel:#171D30;--line:#2A3350;--txt:#E8ECF8;--dim:#8A93B0;--gold:#F5C542;--good:#3DDC84;--bad:#FF5A5A;--nt:#9AA3BF}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font-family:Rubik,system-ui,-apple-system,sans-serif;min-height:100vh}
#app{max-width:520px;margin:0 auto;padding:12px 16px 40px}
.top{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px}
.ava{width:40px;height:40px;border-radius:10px;background:#fff;color:#111;display:flex;align-items:center;justify-content:center;font-weight:700;flex:0 0 auto}
.nick{font-weight:700}
.rate{margin-left:auto;text-align:right}
.rate b{font-size:20px}
.lg{font-size:12px;font-weight:700}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:12px}
h2{font-size:17px;margin:16px 0 8px}
h3{font-size:16px;margin:12px 0 6px}
.btn{display:block;width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:#222A44;color:var(--txt);font-size:15px;margin-top:8px;cursor:pointer;text-align:left;font-family:inherit}
.btn:disabled{opacity:.4;cursor:default}
.btn.gold{background:var(--gold);color:#111;border-color:var(--gold);font-weight:700;text-align:center}
.btn.here{border-color:var(--gold)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.sq{width:120px;height:120px;background:#fff;color:#111;border-radius:10px;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px;font-weight:700;font-size:14px;cursor:pointer;flex:0 0 auto}
.sq.big{width:160px;height:160px;font-size:17px}
.sq.used{opacity:.3}
.bonus{font-weight:700;margin-top:10px;font-size:15px}
.plus{color:var(--good)}.minus{color:var(--bad)}.rand{color:var(--gold)}.nt{color:var(--nt)}
.dim{color:var(--dim);font-size:13px}
.log{font-size:14px;line-height:1.45;background:#11162A;border-radius:10px;padding:10px;margin-top:10px}
.log div{margin-bottom:4px}
.trophy{display:inline-block;margin:4px 4px 0 0;padding:6px 8px;border:1px solid var(--gold);border-radius:8px;color:var(--gold);font-size:12px}
.tile{display:flex;justify-content:space-between;align-items:center}
input,select{width:100%;padding:11px;border-radius:10px;border:1px solid var(--line);background:#0B0F1C;color:var(--txt);font-size:16px;font-family:inherit}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl td{padding:6px 4px;border-bottom:1px solid var(--line)}
.week{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.week .inds{margin-top:8px}
.nextm{text-align:right;font-size:14px}
.loc{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:14px}
.loc img{width:30px;height:30px;border-radius:6px;object-fit:contain;background:#000;flex:0 0 auto}
.week h2{margin:0}
.inds{display:flex;gap:6px}
.ind{width:34px;height:12px;border-radius:3px;background:#3A7BFF;display:inline-block}
.ind.off{background:#2A3350;opacity:.7}
.mapph{height:180px;background:#fff;color:#111;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:700;margin-bottom:8px}
.arow{display:flex;gap:12px;align-items:stretch;background:#222A44;border-radius:12px;padding:8px;margin-top:8px;cursor:pointer}
.pic{width:84px;height:116px;background:#fff;color:#111;border-radius:8px;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:700;font-size:12px;padding:4px;flex:0 0 84px}
.arow .tx{flex:1;min-width:0}
.ttl{font-weight:700;font-size:15px}
.ds{font-size:13px;color:var(--dim);margin-top:4px}
.map{position:relative;container-type:inline-size;border-radius:10px;overflow:hidden;line-height:0}
.map img{width:100%;display:block}
.mbox{position:absolute;display:flex;align-items:center;justify-content:center;color:#BFF6FF;font-weight:700;font-size:2.6cqw;line-height:1;cursor:pointer;letter-spacing:.02em;white-space:nowrap}
.mbox.cur{color:var(--gold);text-shadow:0 0 6px rgba(245,197,66,.7)}
.mpin{position:absolute;width:7cqw;height:7cqw;transform:translate(-50%,-50%);border-radius:50%;cursor:pointer}
.ovl{position:fixed;inset:0;background:rgba(0,0,0,.78);display:flex;align-items:center;justify-content:center;padding:12px;z-index:10}
.lpanel{position:relative;width:min(100%,calc((100vh - 24px)*2/3));aspect-ratio:2/3;background-size:100% 100%;container-type:inline-size}
.lrow{position:absolute;display:flex;align-items:center;padding:0 4cqw;color:#E8ECF8;font-size:3.4cqw;line-height:1.1;overflow:hidden}
.lped{position:absolute;transform:translate(-50%,-100%);color:var(--gold);font-weight:700;font-size:3cqw;text-align:center;white-space:nowrap;text-shadow:0 0 6px rgba(0,0,0,.9)}
.lclose{position:absolute;top:0;right:0;width:15%;height:10%;background:transparent;border:0;cursor:pointer}
img.pic{object-fit:cover;padding:0;background:#fff}
.bigpic{display:block;width:200px;height:276px;object-fit:cover;border-radius:10px;margin:0 auto}
.scene{display:block;width:100%;border-radius:10px;margin-bottom:4px}
.tierbtn{position:relative;display:block;width:100%;padding:0;border:0;background:none;border-radius:10px;overflow:hidden;cursor:pointer;margin-top:8px}
.tierbtn:first-child{margin-top:0}
.tierbtn img{display:block;width:100%}
.tierbtn.locked{cursor:default}
.tierbtn.locked img{filter:grayscale(1) brightness(.45)}
.tierbtn .tag{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.75);color:var(--txt);font-size:12px;font-weight:700;padding:4px 8px;border-radius:6px}
.tierbtn .tag.gold{color:var(--gold)}
.frow{display:flex;align-items:flex-start;gap:8px}
.fbox{flex:1;position:relative;text-align:center;min-width:0}
.face{width:100%;aspect-ratio:1;background:#fff;color:#111;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:700;margin-bottom:6px}
.fname{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vs{align-self:center;font-weight:700;color:var(--gold);padding-top:20px}
.bar{height:10px;border-radius:5px;background:#0B0F1C;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;transition:width .1s linear}
.bar.hp i{background:linear-gradient(90deg,#FF5A5A,#FF8A5A)}
.bar.qi i{background:linear-gradient(90deg,#2FD7FF,#3A7BFF)}
.frest{font-size:12px;color:var(--gold);min-height:16px;margin-top:4px}
.fx{position:absolute;left:0;right:0;top:30%;font-size:22px;font-weight:800;text-shadow:0 2px 6px #000;opacity:0;pointer-events:none}
.fx.go{animation:fxup .8s ease-out forwards}
@keyframes fxup{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-30px)}}
.flog{font-size:13px;line-height:1.5;background:#11162A;border-radius:10px;padding:8px 10px;margin-top:10px;min-height:100px}
.aic{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:7px;font-size:16px;color:#fff;flex:0 0 auto}
.iconpick{padding:3px;border:2px solid transparent;border-radius:10px;background:none;cursor:pointer}
.iconpick .aic{width:40px;height:40px;font-size:22px}
.iconpick.on{border-color:var(--gold)}
textarea{width:100%;padding:11px;border-radius:10px;border:1px solid var(--line);background:#0B0F1C;color:var(--txt);font-size:15px;font-family:inherit;resize:vertical}
.abil{display:flex;align-items:center;justify-content:center;gap:6px;font-size:12px;margin-top:6px;min-width:0}
.abil span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.abil .aic{width:22px;height:22px;font-size:13px}
.fx{font-size:18px}
.acd{font-size:11px;color:var(--dim);min-height:14px}
.abil.cd .aic{filter:grayscale(1) brightness(.6)}
.ff{min-height:100vh;display:flex;justify-content:center;align-items:flex-start;background:#04070F}
.ffbox{position:relative;width:min(100%,calc(100vh * 908 / 1536));aspect-ratio:908/1536;background:url(img/fight_bg.webp) center/100% 100% no-repeat;container-type:inline-size;font-size:3.6cqw}
.ffbox>*{position:absolute}
.ff-back{background:transparent;border:0;cursor:pointer}
.ff-face{display:flex;align-items:center;justify-content:center}
.ff-face span{width:62%;aspect-ratio:1;background:rgba(255,255,255,.92);color:#111;border-radius:2cqw;display:flex;align-items:center;justify-content:center;font-weight:700}
.ff-plate{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:.6cqw}
.ff-plate b{font-size:4.2cqw;line-height:1.1;max-width:95%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ff-plate span{color:var(--dim);font-size:3.2cqw}
.ff-plate em{font-style:normal;color:var(--gold);font-size:3cqw;min-height:3.6cqw}
.ff-bar{border-radius:3cqw;overflow:hidden}
.ff-bar i{display:block;height:100%;transition:width .1s linear;border-radius:3cqw}
.ff-bar.hp i{background:linear-gradient(90deg,#FF4D5E,#FF8A5A)}
.ff-bar.qi i{background:linear-gradient(90deg,#2FD7FF,#3A7BFF)}
.ff-icon{background:transparent;border:0;padding:0;display:flex;align-items:center;justify-content:center;cursor:pointer}
.ff-icon .aic{width:78%;height:78%;font-size:8cqw;border-radius:1.6cqw}
.ff-icon.cd .aic{filter:grayscale(1) brightness(.55)}
.ff-name{display:flex;flex-direction:column;justify-content:center;padding-left:1.5cqw;gap:.8cqw;min-width:0}
.ff-name b{font-size:3.6cqw;line-height:1.15;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.ff-name span{font-size:2.9cqw;color:var(--dim)}
.ff-title{display:flex;align-items:center;justify-content:center;text-align:center;font-weight:700;font-size:3.6cqw;padding:0 3cqw;line-height:1.1}
.ff-log{display:flex;flex-direction:column;gap:2cqw}
.ff-log .flog{flex:1;margin:0;background:transparent;font-size:3.4cqw;min-height:0;overflow:hidden;padding:1cqw 2cqw}
.ff-ctl{display:flex;gap:2cqw}
.ff-ctl .btn{margin:0;text-align:center;padding:2.2cqw;font-size:3.6cqw}
#fend .btn{margin-top:2cqw;text-align:center}
.ff-fx{display:flex;align-items:center;justify-content:center;text-align:center;font-size:6cqw;font-weight:800;text-shadow:0 2px 6px #000;opacity:0;pointer-events:none;padding:0 2cqw}
.ff-fx2{align-items:flex-end;padding-bottom:4cqw;font-size:4.6cqw}
.ff-fx.go{animation:fxup .9s ease-out forwards}
.ff-fx.qi{color:#2FD7FF}
.rt{display:inline-flex;align-items:center;gap:.3em;font-family:'Exo 2',Rubik,sans-serif;font-style:italic;font-weight:900;line-height:1;letter-spacing:.02em}
.rt img{height:1.5em;width:auto;filter:drop-shadow(0 0 4px rgba(0,0,0,.6))}
.rt b{font-weight:900;background:linear-gradient(180deg,#FFFFFF 0%,#FFE7A3 55%,#F5C542 100%);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 2px 10px rgba(245,197,66,.25);padding-right:.12em}
.rt.big{font-size:28px}
.rt.mid{font-size:22px}
.rt.rf{font-size:4.2cqw}
.rt.rf img{height:1.25em}
.rate{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.rate .lg{font-family:'Exo 2',Rubik,sans-serif;font-style:italic;font-weight:800;letter-spacing:.06em;text-transform:uppercase;font-size:11px}
img.aic{object-fit:cover;background:#0B0F1C;display:block}
.iconsgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;max-height:330px;overflow-y:auto;padding-right:2px}
.iconsgrid .iconpick{padding:2px;width:100%}
.iconsgrid .iconpick .aic{width:100%;height:auto;aspect-ratio:1}
.gold{color:var(--gold)}
.ser{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;padding:7px 4px;border-bottom:1px solid var(--line);font-size:14px}
.ser span{color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ser span:last-child{text-align:right}
.ser span.win{color:var(--txt);font-weight:700}
.ser .ssc{font-family:'Exo 2',Rubik,sans-serif;font-style:italic;font-weight:900}
.ser.mine{background:rgba(245,197,66,.08);border-radius:6px}
.tvs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;text-align:center;gap:8px;margin:12px 0 6px;font-weight:700}
.tsc{font-family:'Exo 2',Rubik,sans-serif;font-style:italic;font-weight:900;font-size:34px;color:var(--gold)}
.abrow{display:flex;gap:12px;align-items:flex-start}
.iconone{padding:0;border:2px solid var(--gold);border-radius:12px;background:none;cursor:pointer;flex:0 0 76px;width:76px;height:76px;overflow:hidden}
.iconone .aic{width:100%;height:100%;border-radius:10px}
</style></head>

    else { const W = t[m.w], L = t[tLoser(m)]; W.w++; L.l++; W.pts += m.bo === 2 ? 3 : 1; }
  }
  return Object.values(t).sort((x, y) => y.pts - x.pts || (y.gw - y.gl) - (x.gw - x.gl) || R.ps[x.id].seed - R.ps[y.id].seed);
}
function tQual16(R, g) {   // двое лучших; при споре на границе — решающий бой

  for (const v of [...new Set(tab.map(r => r.pts))]) {
    const need = 2 - q.length; if (need <= 0) break;
    const L = tab.filter(r => r.pts === v && !out.includes(r.id)).map(r => r.id);
    if (L.length <= need) q.push(...L);
    else { const sh = shuffle(L); return { dec: [sh[0], sh[1]] }; }
  }
  for (const r of tab) if (q.length < 2 && !q.includes(r.id)) q.push(r.id);
  return { q };
}
function tSwiss(R) {   // швейцарка: победы, Бухгольц
  const st = R.stages.filter(k => k.startsWith('SW')), w = {}, opp = {}, played = {};
  R.ps.forEach(x => { w[x.id] = 0; opp[x.id] = []; played[x.id] = []; });
  for (const k of st) for (const m of tStage(R, k)) {
    opp[m.a].push(m.b); opp[m.b].push(m.a);                 // для пар без повторов
    if (m.done) { w[m.w]++; played[m.a].push(m.b); played[m.b].push(m.a); }
  }
  return R.ps.map(x => ({ id: x.id, w: w[x.id], l: played[x.id].length - w[x.id], bh: played[x.id].reduce((s, o) => s + w[o], 0), opp: opp[x.id] }))
    .sort((a, b) => b.w - a.w || b.bh - a.bh || R.ps[a.id].seed - R.ps[b.id].seed);

function tAdvance(R) {
  const k = R.stage, f = R.fmt, win = st => tStage(R, st).map(m => m.w);
  const knock = st => { const lose = tStage(R, st).map(tLoser); R.alive = R.alive.filter(x => !lose.includes(x)); };
  const finalStage = () => { tBegin(R, 'F'); const w = win('SF'); tAdd(R, w[0], w[1], 5); };
  if (k === 'F') { knock('F'); R.done = true; R.winner = tStage(R, 'F')[0].w; return; }
  if (k === 'SF') { knock('SF'); finalStage(); return; }
  if (f === 'se8' || f === 'g16') {
    if (k === 'QF') { knock('QF'); const w = win('QF'); tBegin(R, 'SF'); tAdd(R, w[0], w[1], 3); tAdd(R, w[2], w[3], 3); return; }
  }
  if (f === 'g12') {
    if (k === 'GS') {
      const A = tTable(R, R.groups.A, 'GS').map(r => r.id), B = tTable(R, R.groups.B, 'GS').map(r => r.id);

      tBegin(R, 'DEC'); tAdd(R, A[1], A[2], 5, 'Группа A'); tAdd(R, B[1], B[2], 5, 'Группа B'); return;
    }
    if (k === 'DEC') { knock('DEC'); const [wA, wB] = win('DEC'); tBegin(R, 'SF'); tAdd(R, R.top.A, wB, 5); tAdd(R, R.top.B, wA, 5); return; }
  }
  if (f === 'g16' && (k === 'GS' || k.startsWith('TB'))) {
    if (k.startsWith('TB')) for (const m of tStage(R, k)) (R.tbOut[m.grp] = R.tbOut[m.grp] || []).push(tLoser(m));
    const res = {}; let tb = false;
    for (const g of GL) { res[g] = tQual16(R, g); if (res[g].dec) tb = true; }
    if (tb) { tBegin(R, 'TB' + (++R.tbn)); for (const g of GL) if (res[g].dec) tAdd(R, res[g].dec[0], res[g].dec[1], 1, 'Решающий бой · группа ' + g, g); return; }
    const q = g => res[g].q;
    R.alive = GL.flatMap(q);
    tBegin(R, 'QF');
    tAdd(R, q('A')[0], q('B')[1], 3); tAdd(R, q('B')[0], q('A')[1], 3); tAdd(R, q('C')[0], q('D')[1], 3); tAdd(R, q('D')[0], q('C')[1], 3);
    return;
  }
  if (f === 'sw20') {

        while (list.length) {
          const a = list.shift(); let j = list.findIndex(b => !a.opp.includes(b.id)); if (j < 0) j = 0;
          const b = list.splice(j, 1)[0]; tAdd(R, a.id, b.id, 1);
        }
        return;
      }
      const r = tab.map(x => x.id); R.top = r.slice(0, 2); R.alive = r.slice(0, 6);
      tBegin(R, 'PI'); tAdd(R, r[2], r[5], 3, '3-е против 6-го'); tAdd(R, r[3], r[4], 3, '4-е против 5-го'); return;
    }
    if (k === 'PI') { knock('PI'); const [w36, w45] = win('PI'); tBegin(R, 'SF'); tAdd(R, R.top[0], w45, 5); tAdd(R, R.top[1], w36, 5); return; }

}
function tRun(R, auto) {   // доиграть всё, что можно без игрока; auto — и бои игрока тоже
  let guard = 0;
  while (!R.done && guard++ < 500) {
    let waiting = false;
    for (const m of tStage(R, R.stage)) {
      if (m.done) continue;
      if ((m.a === 0 || m.b === 0) && !auto) { waiting = true; continue; }
      while (!m.done) tGame(m, tSimGame(R, m.a, m.b));
    }
    if (waiting) return;
    const k = R.stage;
    tAdvance(R);
    if (R.out == null && !R.alive.includes(0)) R.out = k;   // игрок выбыл — дальше турнир досчитывается сам

}

}

    <div class="ff-bar qi" style="${fpos(...L.qi)}"><i id="${id}-qi"></i></div>
    <button class="ff-icon" id="${id}-ab" data-a="fabil" data-v="${id}" style="${fpos(...L.icon)}" aria-label="${esc(x.abil.name)}">${abilIcon(x.abil.icon)}</button>
    <div class="ff-name" style="${fpos(...L.name)}"><b>${esc(x.abil.name)}</b><span id="${id}-acd"></span></div>`;
}
function viewFight() {
  if (!F) { S.view = S.trun ? 'trun' : 'main'; return S.trun ? viewTRun() : viewMain(); }
  return `<div class="ff"><div class="ffbox">
    <button class="ff-back" data-a="fback" style="${fpos(18, 112, 131, 190)}" aria-label="Назад"></button>
    ${fside(F.a, 'fa')}${fside(F.b, 'fb')}
    <div class="ff-title" style="${fpos(250, 1062, 660, 1124)}">${esc(F.title)}</div>
    <div class="ff-log" style="${fpos(30, 1135, 878, 1500)}">
      <div class="flog" id="flog"></div>
      <div id="fend"></div>
      <div class="ff-ctl" id="fctl">
        <button class="btn" data-a="fspeed" data-v="1">×1</button><button class="btn" data-a="fspeed" data-v="3">×3</button><button class="btn" data-a="fskip">Досчитать</button>
      </div>
    </div>
  </div></div>`;
}
function fightPaint() {
  if (!F) return;
  for (const [x, id] of [[F.a, 'fa'], [F.b, 'fb']]) {
    const hp = document.getElementById(id + '-hp');
    if (!hp) return;
    hp.style.width = (x.hp / x.hpMax * 100) + '%';
    document.getElementById(id + '-qi').style.width = (x.qi / x.qiMax * 100) + '%';
    const ready = !F.done && x.rest <= 0 && x.acd <= 0 && x.qi >= x.qiMax * FIGHT.abilPct;
    document.getElementById(id + '-acd').textContent = x.rest > 0 ? 'Передышка ' + x.rest.toFixed(1) + ' с' : x.acd > 0 ? 'Перезарядка ' + x.acd.toFixed(1) + ' с' : ready ? 'Готово — нажми' : 'Мало Цы';
    document.getElementById(id + '-ab').classList.toggle('cd', !ready);
  }
  for (const e of F.fx) {
    const el = document.getElementById(e.who + (e.layer === 2 ? '-fx2' : '-fx'));
    el.textContent = e.text; el.className = 'ff-fx' + (e.layer === 2 ? ' ff-fx2 ' : ' ') + e.cls; void el.offsetWidth; el.classList.add('go');
  }
  F.fx = [];
  document.getElementById('flog').innerHTML = F.ev.map(e => `<div>${esc(e)}</div>`).join('');
  if (F.done && !document.getElementById('fend').innerHTML) {
    document.getElementById('fend').innerHTML = `<div class="bonus ${F.won ? 'plus' : 'minus'}" style="font-size:20px;text-align:center;margin:0">${F.won ? 'Победа!' : 'Поражение'}</div><button class="btn gold" data-a="fend">Продолжить</button>`;
    document.getElementById('fctl').style.display = 'none';
  }
}
function fightLoop() {
  clearInterval(FT);
  if (S.view !== 'fight' || !F) return;
  fightPaint();
  FT = setInterval(() => {
    if (!F || S.view !== 'fight') { clearInterval(FT); return; }
    for (let i = 0; i < F.speed && !F.done; i++) fightStep(0.1);
    fightPaint();
    if (F.done) clearInterval(FT);
  }, 100);
}
function viewTRun() {
  const R = S.trun;
  if (!R) { S.view = 'tour'; return viewTour(); }
  const f = FMT[R.fmt], me = tMine(R);
  const nm = id => id === 0 ? `<b class="gold">${esc(S.nick)}</b>` : esc(R.ps[id].name);
  const sc = m => { const wa = m.g.filter(x => x === m.a).length; return [wa, m.g.length - wa]; };
  const series = m => { const [wa, wb] = sc(m); return `<div class="ser ${m.a === 0 || m.b === 0 ? 'mine' : ''}"><span class="${m.w === m.a ? 'win' : ''}">${nm(m.a)}</span><b class="ssc">${wa}:${wb}</b><span class="${m.w === m.b ? 'win' : ''}">${nm(m.b)}</span></div>`; };
  let h = `<div class="card"><img class="scene" src="img/tier_${R.tier}.webp" alt=""><h2>${f.name}</h2><div class="dim">${f.desc}</div>
    <div style="margin-top:8px">Стадия: <b>${R.done ? 'турнир завершён' : stageName(R.stage)}</b></div></div>`;
  if (R.done) {
    const won = R.winner === 0;
    h += `<div class="card" style="text-align:center"><div class="bonus ${won ? 'plus' : 'minus'}" style="font-size:22px;margin:0">${won ? 'Ты выиграл турнир!' : 'Турнир окончен'}</div>
      <div class="dim" style="margin-top:6px">${won ? 'Трофей отправится в коллекцию.' : 'Твой результат: ' + placeText(R) + '. Победитель — ' + esc(R.ps[R.winner].name) + '.'}</div>
      <button class="btn gold" data-a="tfinish">Завершить</button></div>`;
  } else if (me) {
    const opp = me.a === 0 ? me.b : me.a, o = R.ps[opp], mine = me.g.filter(x => x === 0).length;
    h += `<div class="card"><h3>Твой матч · ${stageName(R.stage)}${me.label ? ' · ' + esc(me.label) : ''}</h3>
      <div class="tvs"><div>${esc(S.nick)}<br>${rateHtml(S.rating, 'mid')}</div><div class="tsc">${mine}:${me.g.length - mine}</div><div>${esc(o.name)}<br>${rateHtml(o.rating, 'mid')}</div></div>
      <div class="dim" style="text-align:center">Bo${me.bo}${me.bo === 2 ? ' · возможна ничья' : ''} · бой ${me.g.length + 1}</div>
      <button class="btn gold" data-a="tplay">В бой</button><button class="btn" data-a="tauto">Досчитать турнир</button></div>`;
  }
  if (R.groups && R.fmt === 'g12') for (const g of ['A', 'B']) h += `<div class="card"><h3>Группа ${g}</h3><table class="tbl"><tr class="dim"><td>#</td><td>Боец</td><td>О</td><td>В-Н-П</td></tr>${tTable(R, R.groups[g], 'GS').map((r, i) => `<tr><td>${i + 1}</td><td>${nm(r.id)}</td><td>${r.pts}</td><td>${r.w}-${r.d}-${r.l}</td></tr>`).join('')}</table></div>`;
  if (R.groups && R.fmt === 'g16') for (const g of GL) h += `<div class="card"><h3>Группа ${g}</h3><table class="tbl"><tr class="dim"><td>#</td><td>Боец</td><td>В-П</td></tr>${tTable(R, R.groups[g], 'GS').map((r, i) => `<tr><td>${i + 1}</td><td>${nm(r.id)}</td><td>${r.w}-${r.l}</td></tr>`).join('')}</table></div>`;
  if (R.fmt === 'sw20') h += `<div class="card"><h3>Швейцарская система</h3><table class="tbl"><tr class="dim"><td>#</td><td>Боец</td><td>В-П</td><td>Бх</td></tr>${tSwiss(R).map((r, i) => `<tr><td>${i + 1}</td><td>${nm(r.id)}</td><td>${r.w}-${r.l}</td><td>${r.bh}</td></tr>`).join('')}</table></div>`;
  const myGroup = R.M.filter(m => (m.st === 'GS' || m.st.startsWith('SW')) && (m.a === 0 || m.b === 0) && m.done);
  if (myGroup.length) h += `<div class="card"><h3>Твои бои в группе</h3>${myGroup.map(series).join('')}</div>`;
  for (const k of R.stages) if (k !== 'GS' && !k.startsWith('SW')) h += `<div class="card"><h3>${stageName(k)}</h3>${tStage(R, k).map(series).join('')}</div>`;
  return wrap(h);
}
const VIEWS = { trun: viewTRun, fight: viewFight, league: viewLeague, main: viewMain, card: viewCard, lib: viewLib, rest: viewRest, tour: viewTour, bureau: viewBureau, flight: viewFlight };
let lastView = null;
function render() {
  if (!S) { app.innerHTML = viewSetup(); return; }
  const v = VIEWS[S.view] || viewMain;
  app.innerHTML = v();
  if (S.view !== lastView) { window.scrollTo(0, 0); lastView = S.view; }   // новый экран всегда с верха
  fightLoop();
}

// ---------- действия ----------
function act(a, v) {
  if (!S && a !== 'start' && a !== 'flag' && a !== 'sicon') return;
  const inp = document.getElementById('nick');
  if (!S && inp) { setupNick = inp.value; setupAName = document.getElementById('aname').value; setupADesc = document.getElementById('adesc').value; }
  switch (a) {
    case 'flag': setupFlag = v; setupErr = ''; break;
    case 'sicon': setupIcon = (setupIcon + 1) % ABIL_ICON_COUNT; break;   // нажатие — следующая иконка
    case 'start': {
      const nick = setupNick.trim();
      if (!nick) { setupErr = 'Введи ник, чтобы начать.'; break; }
      if (!setupAName.trim()) { setupErr = 'Придумай название своего удара.'; break; }
      if (!setupADesc.trim()) { setupErr = 'Напиши, что делает твой удар.'; break; }
      S = newHero(nick, setupFlag, { name: setupAName.trim(), desc: setupADesc.trim(), icon: setupIcon }); S.hand = drawHand(); setupErr = ''; save(); break;
    }
    case 'card': S.view = 'card'; S.sel = +v; break;
    case 'league': S.view = 'league'; S.sel = +v; break;
    case 'use': useCard(S.sel); break;
    case 'back': S.view = 'main'; S.sel = null; break;
    case 'lib': if (spend()) { clearJet(); S.view = 'lib'; } break;
    case 'rest': if (spend()) { clearJet(); S.power += 5; logMsg('Отдых: бонус.'); S.view = 'rest'; } break;
    case 'tour': if (spend()) { clearJet(); S.tourPass = true; S.view = 'tour'; } break;
    case 'play': playTour(+v); break;
    case 'tplay': {
      const R = S.trun, m = R && tMine(R); if (!m) return;
      const opp = m.a === 0 ? m.b : m.a, o = R.ps[opp];
      startFight(`${stageName(R.stage)} · бой ${m.g.length + 1} · Bo${m.bo}`, fighter(o.name, o.p, o.rating, false, o.abil), won => { tGame(m, won ? 0 : opp); tRun(R, false); S.view = 'trun'; });
      break;
    }
    case 'tauto': if (S.trun) tRun(S.trun, true); break;
    case 'tfinish': finishTour(); break;
    case 'fspeed': if (F) F.speed = +v; return;
    case 'fskip': if (F) { finishFight(); fightPaint(); } return;
    case 'fback': if (F) { if (F.done) return act('fend'); finishFight(); fightPaint(); } return;
    case 'fabil': {   // нажатие на квадрат с иконкой: способность этого бойца, если готова
      if (!F || F.done) return;
      const x = v === 'fa' ? F.a : F.b, y = v === 'fa' ? F.b : F.a;
      if (x.rest <= 0 && x.acd <= 0 && x.qi >= x.qiMax * FIGHT.abilPct) { useAbility(x, y); fightPaint(); }
      return;
    }
    case 'fend': { if (!F || !F.done) return; const cb = F.onEnd, won = F.won; F = null; cb(won); break; }
    case 'bureau': if (spend()) { clearJet(); S.view = 'bureau'; } break;
    case 'toBureau': S.view = 'bureau'; break;
    case 'fight': bureauFight(v); break;
    case 'flight': if (S.actions > 0) S.view = 'flight'; break;
    case 'fly': if (spend()) { S.region = +v; S.jetlag = 1; logMsg('Перелёт в ' + REGIONS[S.region].name + '. Джетлаг до конца хода.'); S.view = 'main'; } break;
    case 'pass': clearJet(); logMsg('Неделя пропущена.'); endTurn(); break;
    case 'next': endTurn(); break;
    default: return;
  }
  if (S) save();
  render();
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-a]');
  if (!t || t.disabled || t.dataset.a === 'noop') return;
  act(t.dataset.a, t.dataset.v);
});
window.addEventListener('error', e => { app.insertAdjacentHTML('afterbegin', '<pre style="color:#FF5A5A;white-space:pre-wrap;font-size:12px">Ошибка: ' + esc(e.message) + ' (' + (e.lineno || '?') + ')</pre>'); });
S = load();
render();
</script></body></html>
