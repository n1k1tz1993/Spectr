<html lang="ru"><head><meta charset="utf-8">

<title>Спектр</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@1,800;1,900&display=swap">
<style>
:root{--bg:#0E1220;--panel:#171D30;--line:#2A3350;--txt:#E8ECF8;--dim:#8A93B0;--gold:#F5C542;--good:#3DDC84;--bad:#FF5A5A;--nt:#9AA3BF}

body{margin:0;background:var(--bg);color:var(--txt);font-family:Rubik,system-ui,-apple-system,sans-serif;min-height:100vh}
#app{max-width:520px;margin:0 auto;padding:12px 16px 40px}
.top{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px}
.ava{width:44px;height:44px;border-radius:10px;background:var(--bg);overflow:hidden;flex:0 0 auto;border:1px solid var(--line)}
.ava img{width:100%;height:100%;object-fit:cover;object-position:center 15%;display:block}
.faceone{padding:0;border:2px solid var(--gold);border-radius:12px;background:var(--bg);cursor:pointer;width:140px;height:140px;overflow:hidden;display:block}
.faceone img{width:100%;height:100%;object-fit:cover;display:block}
.nick{font-weight:700}
.rate{margin-left:auto;text-align:right}
.rate b{font-size:20px}
.lg{font-size:12px;font-weight:700}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:12px}
h2{font-size:17px;margin:16px 0 8px}
h3{font-size:16px;margin:12px 0 6px}
.btn{display:block;width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:#222A44;color:var(--txt);font-size:15px;margin-top:8px;cursor:pointer;text-align:left;font-family:inherit}

.btn.gold{background:var(--gold);color:#111;border-color:var(--gold);font-weight:700;text-align:center}
.btn.here{border-color:var(--gold)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.sq{width:120px;height:120px;background:#fff;color:#111;border-radius:10px;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px;font-weight:700;font-size:14px;cursor:pointer;flex:0 0 auto}
.sq.big{width:160px;height:160px;font-size:17px}
.sq.used{opacity:.3}
.bonus{font-weight:700;margin-top:10px;font-size:15px}
.plus{color:var(--good)}.minus{color:var(--bad)}.rand{color:var(--gold)}.nt{color:var(--nt)}
.dim{color:var(--dim);font-size:13px}
.log{font-size:14px;line-height:1.45;background:#11162A;border-radius:10px;padding:10px;margin-top:10px}

.trophy{display:inline-block;margin:4px 4px 0 0;padding:6px 8px;border:1px solid var(--gold);border-radius:8px;color:var(--gold);font-size:12px}

.tbl{width:100%;border-collapse:collapse;font-size:14px}

.week{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}

.nextm{text-align:right;font-size:14px}
.loc{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:14px}

.inds{display:flex;gap:6px}

.arow{display:flex;gap:12px;align-items:stretch;background:#222A44;border-radius:12px;padding:8px;margin-top:8px;cursor:pointer}
.pic{width:84px;height:116px;background:#fff;color:#111;border-radius:8px;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:700;font-size:12px;padding:4px;flex:0 0 84px}
.arow .tx{flex:1;min-width:0}
.ttl{font-weight:700;font-size:15px}
.ds{font-size:13px;color:var(--dim);margin-top:4px}
.map{position:relative;container-type:inline-size;border-radius:10px;overflow:hidden;line-height:0}
.map img{width:100%;display:block}

.frow{display:flex;align-items:flex-start;gap:8px}

.rt{display:inline-flex;align-items:center;gap:.3em;font-family:'Exo 2',Rubik,sans-serif;font-style:italic;font-weight:900;line-height:1;letter-spacing:.02em}
.rt img{height:1.5em;width:auto;filter:drop-shadow(0 0 4px rgba(0,0,0,.6))}

.rt.big{font-size:28px}
.rt.mid{font-size:22px}
.rt.rf{font-size:4.2cqw}
.rt.rf img{height:1.25em}
.rate{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.rate .lg{font-family:'Exo 2',Rubik,sans-serif;font-style:italic;font-weight:800;letter-spacing:.06em;text-transform:uppercase;font-size:11px}
img.aic{object-fit:cover;background:#0B0F1C;display:block}
.iconsgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;max-height:330px;overflow-y:auto;padding-right:2px}
.iconsgrid .iconpick{padding:2px;width:100%}
.iconsgrid .iconpick .aic{width:100%;height:auto;aspect-ratio:1}
.gold{color:var(--gold)}
.ser{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;padding:7px 4px;border-bottom:1px solid var(--line);font-size:14px}
.ser span{color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ser span:last-child{text-align:right}
.ser span.win{color:var(--txt);font-weight:700}
.ser .ssc{font-family:'Exo 2',Rubik,sans-serif;font-style:italic;font-weight:900}

.tvs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;text-align:center;gap:8px;margin:12px 0 6px;font-weight:700}
.tsc{font-family:'Exo 2',Rubik,sans-serif;font-style:italic;font-weight:900;font-size:34px;color:var(--gold)}
.abrow{display:flex;gap:12px;align-items:flex-start}
.iconone{padding:0;border:2px solid var(--gold);border-radius:12px;background:none;cursor:pointer;flex:0 0 76px;width:76px;height:76px;overflow:hidden}
.iconone .aic{width:100%;height:100%;border-radius:10px}
.ff-ab{position:relative;display:flex;align-items:center;gap:3cqw;padding:1.4cqw 2.5cqw 1.4cqw 1.4cqw;background:#071425;border:2px solid #22D3EE;border-radius:2.2cqw;box-shadow:0 0 2.5cqw rgba(34,211,238,.35),inset 0 0 2cqw rgba(34,211,238,.12);color:var(--txt);text-align:left;cursor:pointer;font-family:inherit}

.ff-head{position:relative;padding:1cqw 0 1.5cqw;display:flex;align-items:center;justify-content:space-between;gap:2cqw;border-bottom:1px solid rgba(34,211,238,.4)}

.ff-head .ff-ctl{display:flex;gap:1.5cqw;flex:0 0 auto}

.ff-log{position:relative}

.logo{font-family:'Exo 2',Rubik,sans-serif;font-style:italic;font-weight:900;font-size:44px;letter-spacing:.08em;background:linear-gradient(180deg,#FFFFFF,#7DE8FF 60%,#2FD7FF);-webkit-background-clip:text;background-clip:text;color:transparent;padding:6px 0}

.tl0{display:inline-flex;align-items:center;justify-content:center;font-weight:700;color:var(--gold)}

.erow{display:flex;align-items:center;gap:10px;width:100%;padding:6px 8px;margin-top:6px;border:1px solid var(--line);border-radius:10px;background:#1B2238;color:var(--txt);font-family:inherit;font-size:14px;cursor:pointer}

.erow .ava{width:34px;height:34px}

<body><div id="app"></div>
<script>
'use strict';
const SKEY = { solo: 'spektr.v2', coop: 'spektr.coop' };   // одиночная карьера и совместная игра хранятся отдельно
const app = document.getElementById('app');
let S = null;      // текущий герой (тот, чья сейчас неделя)
let G = null;      // игра: { v: 3, mode: 'solo' | 'coop', players: [герои], cur, handoff }
let SETUP = null;  // создание героев: { mode, n, made: [] }

function fixHero(v) {   // старые сохранения героя
  if (!v.tiers) { v.tiers = [0, 0, 0, 0, 0]; v.tiers[v.region || 0] = v.tier || 0; }
  if (!v.troph) v.troph = (v.trophies || []).map(n => ({ r: v.region || 0, n }));
  if (!v.hist) v.hist = [];
  if (!v.ability) v.ability = { name: 'Спектральный удар', desc: '', icon: 0 };
  if (v.face == null) v.face = 0;
  return v;
}
function loadGame(mode) {
  try {
    const v = JSON.parse(localStorage.getItem(SKEY[mode]) || 'null');
    if (!v) return null;
    if (v.v === 2 && v.nick) return { v: 3, mode: 'solo', players: [fixHero(v)], cur: 0, handoff: false };   // одиночная карьера до совместной игры
    if (v.v !== 3 || !v.players || !v.players.length) return null;
    v.players.forEach(fixHero);
    if (!v.week) v.week = Math.max(...v.players.map(H => H.turn || 1));
    return v;
  } catch (e) { return null; }
}
function save() { if (!G) return; try { localStorage.setItem(SKEY[G.mode], JSON.stringify(G)); } catch (e) {} }

// Всё считается от одной характеристики — силы (10–125). Сила игроку не показывается.
const FIGHT = {
  // Сила влияет экспоненциально, поэтому шанс победы зависит только от разницы сил, а не от уровня:
  // разница 10 — около 30%, разница 20 — около 10%. Длина боя при любой силе — около минуты.
  hp: p => Math.round(2200 * Math.exp(0.003 * p)),     // здоровье
  qi: p => Math.round(55 + p * 0.3),                   // запас Цы (расход считается в процентах от запаса)
  def: p => 100 * (Math.exp(0.0025 * p) - 1),          // защита: урон × 100 / (100 + защита)
  dmg: p => 40 * Math.exp(0.0055 * p),                 // базовый урон удара
  costPct: 0.05,                            // обычный удар: −5% Цы

  regen: 0.01,                              // восстановление Цы в секунду, доля от запаса
  cd: 1.0,                                  // скорость атаки одинаковая: удар раз в секунду
  rest: 3,                                  // передышка без Цы, потом Цы полная
  spread: 0.3,                              // разброс урона обычного удара ±
  diceDiv: 1000,                            // поправка к броску: разница сил / diceDiv (сейчас по сути выключена)
  abilHits: 5,                              // способность = 5 ударов, урон проходит одним ударом
  abilCrit: 0.2,                            // шанс крита способности
  abilCd: 3,                                // перезарядка способности, секунд
  qiProc: 0.02, qiProcMin: 0.05, qiProcMax: 0.10,   // 2% за удар: прилив Цы 5–10%
  thrMe: 0.5, thrNpc: 0.4                   // при каком остатке Цы применяется способность
};
const NICKS = ['Raven', 'Vortex', 'Kaito', 'Nova', 'Blaze', 'Shade', 'Orion', 'Zephyr', 'Mira', 'Drake', 'Lynx', 'Hex', 'Riven', 'Sora', 'Viper', 'Echo', 'Nyx', 'Talon', 'Ember', 'Frost'];
const ABIL_LIST = [   // способности соперников: название и что делает
  ['Громовой разлом', 'раскалывает землю громовым ударом'], ['Ледяная спираль', 'закручивает вокруг врага ледяную спираль'],

// иконки способностей: img/abil/0..119.webp — и у игрока, и у соперников
const FACE_COUNT = 36;   // портреты: img/face/0..35.webp

let F = null, FT = null;
const fighter = (name, p, rating, me, abil, face) => ({ name, p, rating, me, face: face != null ? face : rnd(0, FACE_COUNT - 1), lastCrit: false, abil: abil || (([n, d]) => ({ name: n, desc: d, icon: rnd(0, ABIL_ICON_COUNT - 1) }))(ABIL_LIST[rnd(0, ABIL_LIST.length - 1)]),
  thr: me ? FIGHT.thrMe : FIGHT.thrNpc, acd: 0, hp: FIGHT.hp(p), hpMax: FIGHT.hp(p), qi: FIGHT.qi(p), qiMax: FIGHT.qi(p), rest: 0, cd: 0 });
function startFight(title, opp, onEnd) { startFightAB(title, fighter(S.nick, effPower(), S.rating, true, S.ability, S.face), opp, onEnd); }
function startFightAB(title, a, b, onEnd) {
  F = { title, a, b, onEnd, t: 0, done: false, won: false, ev: [], fx: [], speed: 1 };
  F.a.cd = 0.3 + Math.random() * 0.7; F.b.cd = 0.3 + Math.random() * 0.7;   // кто бьёт первым — случайно

function rollHit(x, y) {
  const roll = rnd(1, 20), r = roll + Math.round((x.p - y.p) / FIGHT.diceDiv);  // бросок кубика d20 с поправкой на разницу сил
  const base = FIGHT.dmg(x.p) * 100 / (100 + FIGHT.def(y.p));
  if (roll === 20 || r >= 19) return { kind: 'crit', dmg: Math.round(base * 2) };
  if (roll === 1 || r <= 3) return { kind: 'dodge', dmg: 0 };

const fev = (m) => { F.ev.unshift(m); F.ev = F.ev.slice(0, 5); };
const fxPush = (who, text, cls, layer) => { F.fx.push({ who: who === F.a ? 'fa' : 'fb', text, cls, layer }); };
function useAbility(x, y) {
  // 5 ударов: каждый может критануть или не попасть; урон проходит одним ударом, вне очереди
  let sum = 0, crits = 0, miss = 0;
  for (let i = 0; i < FIGHT.abilHits; i++) { const r = rollHit(x, y); sum += r.dmg; if (r.kind === 'crit') crits++; if (r.dmg === 0) miss++; }

  const what = (x.abil.desc || 'наносит серию из пяти ударов').replace(/[.!\s]+$/, '');
  fev(`${x.name} · «${x.abil.name}»: ${what}!${mult > 1 ? ' Сокрушительная мощь!' : ''}`);
  fxPush(y, `${x.abil.name}${mult > 1 ? ' ×' + mult.toFixed(1) : ''}! −${dmg}`, 'rand', 1);

function fightStep(dt) {

    x.qi = Math.min(x.qiMax, x.qi + x.qiMax * FIGHT.regen * dt);
    x.cd -= dt;
    if (x.cd > 0) continue;
    if (x.qi < x.qiMax * FIGHT.costPct) { x.rest = FIGHT.rest; fev(x.name + ' выдыхается — Цы иссякла!'); fxPush(x, 'Нет Цы', 'rand', 2); continue; }
    x.qi -= x.qiMax * FIGHT.costPct; x.cd = FIGHT.cd;
    const r = rollHit(x, y);
    y.hp = Math.max(0, y.hp - r.dmg);
    // в журнал — только яркие моменты; обычные удары видны цифрами на портрете
    if (r.kind === 'crit') fev(x.lastCrit ? `${x.name} проводит серию разрушительных атак!` : `${x.name} производит разрушительную атаку!`);
    else if (r.kind === 'dodge') fev(`${y.name} легко уклоняется от атаки!`);
    else if (r.kind === 'block') fev(`${y.name} блокирует удар!`);
    x.lastCrit = r.kind === 'crit';
    fxPush(y, { crit: 'Крит! −' + r.dmg, dodge: 'Уклон!', block: 'Блок!', hit: '−' + r.dmg }[r.kind], r.kind === 'dodge' || r.kind === 'block' ? 'nt' : 'minus', 1);
    if (Math.random() < FIGHT.qiProc) {          // шанс как у крита: прилив Цы 5–10%
      const g = FIGHT.qiProcMin + Math.random() * (FIGHT.qiProcMax - FIGHT.qiProcMin);
      x.qi = Math.min(x.qiMax, x.qi + x.qiMax * g);
      fev(`${x.name} чувствует прилив Цы!`); fxPush(x, `+${Math.round(g * 100)}% Цы`, 'qi', 2);

const finishFight = () => { while (!F.done) fightStep(0.1); };

    h += `<div class="card"><h3>Кто в драфте</h3><div class="dim">Элитные Спектры региона:</div><table class="tbl">${lgPool(r).slice(0, proCount(r)).map((f, k) => `<tr><td>${k + 1}</td><td>${esc(f.name)} ${flagOf(f.country)}</td><td style="text-align:right">${rateHtml(f.rating)}</td></tr>`).join('')}</table>
      ${G.players.filter(H => H.draft === r).map(H => `<div style="margin-top:6px">${esc(H.nick)} ${flagOf(H.country)} · ${rateHtml(H.rating)}</div>`).join('')}</div>`;
  } else {
    const t = lgTable(L);
    h += `<div class="card"><h3>Таблица</h3><table class="tbl ltbl"><tr class="dim"><td>#</td><td>Боец</td><td>И</td><td>В-Н-П</td><td>О</td></tr>${t.map((x, k) => `<tr class="${k < 2 ? 'z1' : k < 10 ? 'z2' : ''}"><td>${k + 1}</td><td>${lgTeamCell(L, x.i)}</td><td>${x.pl}</td><td>${x.w}-${x.d}-${x.l}</td><td><b>${x.pts}</b></td></tr>`).join('')}</table>
      <div class="dim" style="margin-top:6px">1–2 — сразу в полуфинал, 3–10 — плей-ин. Топ-3 по итогам — на чемпионат мира.</div></div>`;
    for (const st of ['PI1', 'PI2', 'SF', 'F']) { const ms = lgStage(L, st); if (ms.length) h += `<div class="card"><h3>${LG_STAGE[st]}</h3>${ms.map(m => lgSeries(L, m)).join('')}</div>`; }
  }
  return wrap(h + `<button class="btn" data-a="lback">Назад</button>`);
}
function viewLHist() {
  const r = S.sel, L = G.leagues[r], weeks = {};
  for (const m of L.M) if (m.done) (weeks[m.wk] = weeks[m.wk] || []).push(m);
  const ks = Object.keys(weeks).map(Number).sort((a, b) => b - a);
  let h = `<div class="card"><h2>История · ${LSHORT[r]}</h2><div class="dim">Сезон ${L.season}. Все сыгранные матчи по неделям.</div></div>`;
  h += ks.length ? ks.map(k => `<div class="card"><h3>Неделя ${k}</h3>${weeks[k].map(m => `<div class="dim" style="font-size:12px;margin-top:6px">${LG_STAGE[m.st]}${m.label && m.st !== 'RR' ? ' · ' + esc(m.label) : ''}</div>${lgSeries(L, m)}`).join('')}</div>`).join('')
    : '<div class="card dim">Матчей пока не было.</div>';
  return wrap(h + `<button class="btn" data-a="lback">Назад</button>`);
}
function viewLTurn() {   // ход лиг: объявление и матчи игроков
  const L = G.leagues[G.lq[0]], m = lgPending(L);
  if (!m) return '';
  if (G.lview === 'ann') return `<div class="card" style="margin-top:32px;text-align:center"><div class="dim">Неделя ${G.week} · ход лиг</div>
    <img src="img/logo_${L.r}.webp" alt="" style="width:120px;height:120px;border-radius:16px;margin:14px auto;display:block">
    <div class="logo" style="font-size:30px">Играет лига ${LSHORT[L.r]}!</div><div class="dim">${esc(REGIONS[L.r].league)} · ${LG_STAGE[m.st]}</div>
    <button class="btn gold" data-a="lgo" style="margin-top:14px">Начать</button></div>`;
  const L1 = lgHum(L, m.a) ? m.a : m.b, R1 = L1 === m.a ? m.b : m.a, mine = m.g.filter(x => x === L1).length;
  return `<div class="card" style="margin-top:16px"><div class="dim">Неделя ${G.week} · лига ${LSHORT[L.r]} · ${LG_STAGE[m.st]}${m.label ? ' · ' + esc(m.label) : ''}</div>
    <h3>Матч игрока ${esc(lgTeamName(L, L1))}</h3>
    <div class="tvs"><div>${lgTeamCell(L, L1)}<br>${rateHtml(lgRating(L, L1), 'mid')}</div><div class="tsc">${mine}:${m.g.length - mine}</div><div>${lgTeamCell(L, R1)}<br>${rateHtml(lgRating(L, R1), 'mid')}</div></div>
    <div class="dim" style="text-align:center">Bo${m.bo}${m.bo === 2 ? ' · возможна ничья' : ''} · бой ${m.g.length + 1}</div>
    <button class="btn gold" data-a="lplay">В бой</button><button class="btn" data-a="lsim">Досчитать матч</button></div>
    ${lgCardHtml(L.r).replace(/data-a="l(table|hist)"/g, 'data-a="noop" disabled')}`;
}
const VIEWS = { inv: viewInv, shop: viewShop, dossier: viewDossier, esl: viewEsl, ltable: viewLTable, lhist: viewLHist, trun: viewTRun, fight: viewFight, league: viewLeague, main: viewMain, card: viewCard, lib: viewLib, rest: viewRest, tour: viewTour, bureau: viewBureau, flight: viewFlight };
let lastView = null;
function render() {
  if (!G) { app.innerHTML = SETUP ? viewSetup() : viewMenu(); lastView = null; return; }
  if (G.lq) { if (F) { app.innerHTML = viewFight(); fightLoop(); } else { app.innerHTML = viewLTurn(); window.scrollTo(0, 0); } lastView = null; return; }
  if (G.handoff) { app.innerHTML = viewHandoff(); window.scrollTo(0, 0); lastView = null; return; }
  const v = VIEWS[S.view] || viewMain;
  app.innerHTML = v();
  if (S.view !== lastView) { window.scrollTo(0, 0); lastView = S.view; }   // новый экран всегда с верха
  fightLoop();
}

// ---------- действия ----------
function act(a, v) {
  if (!G) {   // главное меню и создание героев
    if (a === 'sface' && !SETUP) return;
    const inp = document.getElementById('nick');
    if (SETUP && inp) { setupNick = inp.value; setupAName = document.getElementById('aname').value; setupADesc = document.getElementById('adesc').value; }
    switch (a) {
      case 'mcont': G = loadGame(v); if (G) { S = G.players[G.cur]; ensureLeagues(); } break;
      case 'mnew': SETUP = v === 'solo' ? { mode: 'solo', n: 1, made: [] } : { mode: 'coop', n: +v.slice(4), made: [] }; resetSetup(); break;
      case 'mback': SETUP = null; break;
      case 'flag': setupFlag = v; setupErr = ''; break;
      case 'sicon': setupIcon = (setupIcon + 1) % ABIL_ICON_COUNT; break;   // нажатие — следующая иконка
      case 'sface': setupFace = (setupFace + 1) % FACE_COUNT; break;       // нажатие — следующий портрет
      case 'start': {
        if (!SETUP) return;
        const nick = setupNick.trim();
        if (!nick) { setupErr = 'Введи ник, чтобы начать.'; break; }
        if (SETUP.made.some(H => H.nick.toLowerCase() === nick.toLowerCase())) { setupErr = 'Такой ник уже занят другим игроком.'; break; }
        if (!setupAName.trim()) { setupErr = 'Придумай название своего удара.'; break; }
        if (!setupADesc.trim()) { setupErr = 'Напиши, что делает твой удар.'; break; }
        const H = newHero(nick, setupFlag, { name: setupAName.trim(), desc: setupADesc.trim(), icon: setupIcon }, setupFace);
        H.hand = drawHand(H);
        SETUP.made.push(H);
        if (SETUP.made.length < SETUP.n) { resetSetup(); break; }   // следующий игрок
        G = { v: 3, mode: SETUP.mode, players: SETUP.made, cur: 0, handoff: SETUP.mode === 'coop', week: 1 };
        ensureLeagues();
        S = G.players[0]; SETUP = null; save(); break;
      }
      default: return;
    }
    render(); return;
  }
  switch (a) {
    case 'hgo': G.handoff = false; break;
    case 'hskip': S.skipNext = false; G.handoff = false; logMsg('Неделя пропущена: вторжение на турнир.'); endTurn(); break;
    case 'lgo': G.lann = G.lq[0]; G.lview = 'match'; break;
    case 'lplay': {
      const L = G.leagues[G.lq[0]], m = lgPending(L); if (!m) return;
      const L1 = lgHum(L, m.a) ? m.a : m.b, R1 = L1 === m.a ? m.b : m.a;
      startFightAB(`Лига ${LSHORT[L.r]} · ${LG_STAGE[m.st]} · бой ${m.g.length + 1}`, lgFighter(L, L1), lgFighter(L, R1), won => { tGame(m, won ? L1 : R1); lgAfterGame(L, m); });
      break;
    }
    case 'lsim': { const L = G.leagues[G.lq[0]], m = lgPending(L); if (!m) return; lgSimMatch(L, m); lgAfterGame(L, m); break; }
    case 'ldraft': { const r = +v; S.draft = S.draft === r ? null : r; logMsg(S.draft === r ? 'Ты встал в драфт лиги ' + LSHORT[r] + '.' : 'Ты вышел из драфта.'); break; }
    case 'ltable': S.lret = S.view; S.view = 'ltable'; S.sel = +v; break;
    case 'lhist': S.lret = S.view; S.view = 'lhist'; S.sel = +v; break;
    case 'lback': S.view = S.lret === 'league' ? 'league' : S.lret || 'bureau'; if (S.view === 'league') S.sel = S.sel; break;
    case 'menu': save(); G = null; S = null; SETUP = null; F = null; break;
    case 'card': S.view = 'card'; S.sel = +v; break;
    case 'league': S.view = 'league'; S.sel = +v; break;
    case 'use': useCard(S.sel); break;
    case 'back': S.view = 'main'; S.sel = null; break;
    case 'lib': if (spend()) { clearJet(); S.view = 'lib'; } break;
    case 'rest': if (spend()) { clearJet(); addEff(5, 'turn'); logMsg('Отдых: бонус до конца недели.'); S.view = 'rest'; } break;
    case 'tour': if (spend()) { clearJet(); S.tourPass = true; S.tourInv = []; S.view = 'tour'; } break;
    case 'play': playTour(+v); break;
    case 'tplay': {   // живой бой: игрок слева; если встретились два игрока — оба живые
      const R = S.trun, m = R && tMine(R); if (!m) return;
      const L = isHum(R, m.a) ? m.a : m.b, Rr = L === m.a ? m.b : m.a;
      startFightAB(`${stageName(R.stage)} · бой ${m.g.length + 1} · Bo${m.bo}`, tFighter(R, L), tFighter(R, Rr), won => { tGame(m, won ? L : Rr); tRun(R, false); S.view = 'trun'; });
      break;
    }
    case 'tinvade': { const h = +v, a2 = S.tourInvade = S.tourInvade || []; const at = a2.indexOf(h); if (at >= 0) a2.splice(at, 1); else a2.push(h); break; }
    case 'tinv': { const h = +v, a2 = S.tourInv = S.tourInv || []; const at = a2.indexOf(h); if (at >= 0) a2.splice(at, 1); else if (S.actions >= 1 && G.players[h].region === S.region) a2.push(h); break; }
    case 'tauto': if (S.trun) tRun(S.trun, true); break;
    case 'tfinish': finishTour(); break;
    case 'fspeed': if (F) F.speed = +v; return;
    case 'fskip': if (F) { finishFight(); fightPaint(); } return;
    case 'fback': if (F) { if (F.done) return act('fend'); finishFight(); fightPaint(); } return;
    case 'fabil': {   // нажатие на квадрат с иконкой: способность этого бойца, если готова
      if (!F || F.done) return;
      const x = v === 'fa' ? F.a : F.b, y = v === 'fa' ? F.b : F.a;
      if (x.rest <= 0 && x.acd <= 0 && x.qi >= x.qiMax * FIGHT.abilPct) { useAbility(x, y); fightPaint(); }
      return;
    }
    case 'fend': { if (!F || !F.done) return; const cb = F.onEnd, won = F.won; F = null; cb(won); break; }
    case 'bureau': if (freeBureau(S)) S.view = 'bureau'; else if (spend()) { clearJet(); S.view = 'bureau'; } break;   // своё жильё: бюро рядом, действие не тратится
    case 'toBureau': S.view = 'bureau'; break;
    case 'inv': S.view = 'inv'; S.renaming = null; break;
    case 'irename': S.renaming = +v; break;
    case 'irencancel': S.renaming = null; break;
    case 'iren': { const i = +v, el = document.getElementById('iname'), t = el ? el.value.trim() : ''; S.iname = S.iname || {}; if (t) S.iname[i] = t; else delete S.iname[i]; S.renaming = null; break; }
    case 'rbuy': { const j = +v; S.rooms = S.rooms || []; if (S.rooms.includes(j) || S.rating < ROOMS[j].cost) return; S.rating -= ROOMS[j].cost; S.rooms.push(j); S.room = j; S.roomPic = 0; logMsg('Куплено жильё: ' + ROOMS[j].n + '.'); break; }
    case 'room': S.inRoom = !S.inRoom; break;
    case 'rpic': S.roomPic = (S.roomPic | 0) ? 0 : 1; break;
    case 'rsel': S.room = +v; S.roomPic = 0; break;
    case 'shop': S.view = 'shop'; break;
    case 'ibuy': {
      const i = +v, it = ITEMS[i]; S.items = S.items || [];
      if (S.items.includes(i) || S.rating < it.cost) return;
      S.rating -= it.cost; S.items.push(i); logMsg('Открыт артефакт: ' + itemName(S, i) + '.'); break;
    }
    case 'iequip': { const i = +v; S.equip = S.equip === i ? null : i; break; }
    case 'dossier': S.dreg = +v; S.dsel = null; S.view = 'dossier'; break;
    case 'dsel': S.dsel = +v < 0 ? null : +v; break;
    case 'esl': if (S.power >= ESL_MIN_POWER && S.actions > 0) { eslNew(); S.view = 'esl'; } break;
    case 'eslsize': S.esl.size = +v; break;
    case 'eslpick': { const a2 = S.esl.pick, at = a2.indexOf(v); if (at >= 0) a2.splice(at, 1); else if (eslCount() < S.esl.size) a2.push(v); break; }
    case 'eslinv': { const h = +v, a2 = S.esl.inv, at = a2.indexOf(h); if (at >= 0) a2.splice(at, 1); else if (eslCount() < S.esl.size) a2.push(h); break; }
    case 'eslfill': eslFill(); break;
    case 'eslclear': S.esl.gen = []; break;
    case 'eslgo': eslStart(); break;
    case 'fight': bureauFight(v); break;
    case 'flight': if (S.actions > 0) S.view = 'flight'; break;
    case 'fly': if (spend()) { S.region = +v; S.jetlag = hasRoom(S, 4) ? 0 : 1; logMsg('Перелёт в ' + REGIONS[S.region].name + (S.jetlag ? '. Джетлаг до конца хода.' : '. Свой остров — без джетлага.')); S.view = 'main'; } break;
    case 'pass': clearJet(); logMsg('Неделя пропущена.'); endTurn(); break;
    case 'next': endTurn(); break;
    default: return;
  }
  save();
  render();
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-a]');
  if (!t || t.disabled || t.dataset.a === 'noop') return;
  act(t.dataset.a, t.dataset.v);
});
window.addEventListener('error', e => { app.insertAdjacentHTML('afterbegin', '<pre style="color:#FF5A5A;white-space:pre-wrap;font-size:12px">Ошибка: ' + esc(e.message) + ' (' + (e.lineno || '?') + ')</pre>'); });
G = null; S = null;
render();
</script></body></html>
