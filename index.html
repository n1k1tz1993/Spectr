<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B1020">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Спектр</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@1,800;1,900&family=Noto+Sans:wght@400;500;600;700;800&display=swap">
<style>
:root{--bg:#0B1020;--panel:#151E32;--nest:#202B43;--line:#2A3858;--txt:#F2F5FA;--dim:#B6C1D2;--cyan:#32D5E7;--gold:#F5C84C;--good:#65D979;--bad:#FF8B7B;--nt:#B6C1D2}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font-family:'Noto Sans',Rubik,system-ui,-apple-system,sans-serif;font-size:16px;line-height:1.4;min-height:100vh}
#app{max-width:520px;margin:0 auto;padding:12px 16px 40px}
.dim{color:var(--dim);font-size:14px}
/* ориентация: кнопка поворота и альбомная раскладка (две колонки, бой — поле слева, журнал справа) */
#orient{position:fixed;right:10px;bottom:10px;z-index:50;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:rgba(20,26,44,.9);color:var(--gold);font-size:22px;line-height:1;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.5)}
html.land #app{max-width:1240px;column-count:2;column-gap:16px;padding-top:4px}
html.land #app>*{break-inside:avoid}
html.land #app>.card,html.land #app>.btn{display:block}
html.land #app>.card:first-child,html.land #app>.hdr{column-span:all}
html.land #app[data-view=fight],html.land #app[data-view=setup],html.land #app[data-view=menu]{column-count:1}
html.land #app[data-view=menu],html.land #app[data-view=setup]{max-width:760px}
html.land .ffwrap{max-width:1240px;display:flex;gap:16px;align-items:flex-start}
html.land .ffbox{flex:0 0 auto;width:min(58vw,calc(100vh - 16px))}
html.land .ffbot{flex:1;min-width:0;padding-top:8px}
html.rot{overflow:hidden}
html.rot body{overflow:hidden}
html.rot #stage{position:fixed;top:0;left:100vw;width:100vh;height:100vw;transform:rotate(90deg);transform-origin:top left;overflow:auto;background:var(--bg)}
html.rot #orient{right:auto;left:10px;bottom:10px;transform:rotate(90deg)}
.top{position:relative;display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px 10px;overflow:hidden}
.top .ava{width:40px;height:40px}
.topid{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;background:none;border:0;padding:0;color:var(--txt);font-family:inherit;text-align:left;cursor:pointer}
.topid .nick{font-size:16px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.topid .dim{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.top .rate{margin-left:0;flex:0 0 auto}
.top .lg{font-size:11px}
.topor{flex:0 0 auto;width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--nest);color:var(--cyan);font-size:20px;cursor:pointer}
.top{flex-wrap:wrap}
.tgrow{flex:0 0 100%;display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted,#8A93AD);margin-top:2px}
.tgrow span{white-space:nowrap}
.tgrow b{font-size:11px;color:var(--cyan);min-width:30px;text-align:right}
.tgrow .tbar{flex:1;height:6px;border-radius:3px;background:#0A0F1E;overflow:hidden}
.tgrow .tbar i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,#2C7BE5,var(--cyan))}
.tgrow.done .tbar i{background:linear-gradient(90deg,#C9962C,var(--gold))}
.tgrow.done b{color:var(--gold)}
.stat{display:flex;gap:4px;justify-content:flex-end;margin-top:2px}
.sti{width:18px;height:18px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:#1A2238;color:#3A4560;font-style:normal}
.sti svg{width:12px;height:12px}
.sti.on.g{background:rgba(46,204,113,.18);color:#2ECC71;box-shadow:0 0 0 1px #2ECC71}
.sti.on.r{background:rgba(255,77,79,.18);color:#FF4D4F;box-shadow:0 0 0 1px #FF4D4F}
.evtph{position:relative;width:100%;aspect-ratio:4/3;border-radius:12px;background:repeating-linear-gradient(45deg,#141B2E 0 12px,#18203A 12px 24px);border:1px dashed #2A3350;display:flex;align-items:center;justify-content:center;overflow:hidden}
.evtph span{color:#5A6585;font-weight:700;padding:12px;text-align:center}
.evtph img.big{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;max-width:none;border-radius:0}
html.land .evtph img.big{width:100%;height:100%;max-height:none}
.sub{display:flex;align-items:center;gap:10px;margin-top:12px}
.sub h1{margin:0;font-size:22px;font-weight:700;line-height:1.2}
.subback{width:44px;height:44px;flex:0 0 auto;border-radius:12px;border:1px solid var(--line);background:var(--nest);color:var(--txt);font-size:20px;cursor:pointer}
.news>div:nth-child(2){margin-top:4px;line-height:1.4}
.wk{padding:8px 0;border-bottom:1px solid var(--line);line-height:1.4}
.wk:last-child{border-bottom:0}
html.ingame #orient{display:none}
html.land #app>.hdr{column-span:all}
.ava{width:44px;height:44px;border-radius:10px;background:radial-gradient(circle at 50% 38%,#5A6E99 0%,#34446A 45%,#1A2340 100%);overflow:hidden;flex:0 0 auto;border:1px solid var(--line)}
.ava img,.faceone img,.dosimg img,.ff-face img,.fzp>img{filter:drop-shadow(0 0 1.5px rgba(200,225,255,.55))}
.ava img{width:100%;height:100%;object-fit:cover;object-position:center 15%;display:block}
.faceone{padding:0;border:2px solid var(--gold);border-radius:12px;background:radial-gradient(circle at 50% 38%,#5A6E99 0%,#34446A 45%,#1A2340 100%);cursor:pointer;width:140px;height:140px;overflow:hidden;display:block}
.faceone img{width:100%;height:100%;object-fit:cover;display:block}
.nick{font-weight:700}
.rate{margin-left:auto;text-align:right}
.rate b{font-size:20px}
.lg{font-size:12px;font-weight:700}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:16px}
h2{font-size:18px;margin:4px 0 8px}
h3{font-size:16px;margin:12px 0 6px}
.btn{display:block;width:100%;min-height:48px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--nest);color:var(--txt);font-size:16px;margin-top:8px;cursor:pointer;text-align:left;font-family:inherit}
.btn:disabled{opacity:.4;cursor:default}
.btn.gold{background:var(--gold);color:#111;border-color:var(--gold);font-weight:700;text-align:center}
.btn.here{border-color:var(--gold)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.sq{width:120px;height:120px;background:#fff;color:#111;border-radius:10px;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px;font-weight:700;font-size:14px;cursor:pointer;flex:0 0 auto}
.sq.big{width:160px;height:160px;font-size:17px}
.sq.used{opacity:.3}
.bonus{font-weight:700;margin-top:10px;font-size:15px}
.plus{color:var(--good)}.minus{color:var(--bad)}.rand{color:var(--gold)}.nt{color:var(--nt)}
.dim{color:var(--dim);font-size:13px}
.log{font-size:14px;line-height:1.45;background:var(--nest);border-radius:10px;padding:10px;margin-top:10px}
.log div{margin-bottom:4px}
.trophy{display:inline-block;margin:4px 4px 0 0;padding:6px 8px;border:1px solid var(--gold);border-radius:8px;color:var(--gold);font-size:12px}
.tile{display:flex;justify-content:space-between;align-items:center}
input,select{width:100%;padding:11px;border-radius:10px;border:1px solid var(--line);background:#0B0F1C;color:var(--txt);font-size:16px;font-family:inherit}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl td{padding:6px 4px;border-bottom:1px solid var(--line)}
.week{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:10px}
.week>div:first-child{flex:1;min-width:0}
.week .nextwk{flex:0 0 100%;margin-top:0}
.week .inds{margin-top:8px}
.nextm{text-align:right;font-size:14px}
.loc{display:flex;align-items:center;justify-content:flex-start;gap:8px;margin-top:8px;font-size:14px;text-align:left}
.mapsw{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:10px}
.mapsw .nvb{all:unset;cursor:pointer;display:block;line-height:0;width:calc(50% - 9px);transition:transform .12s,filter .15s;filter:brightness(.8) saturate(.9)}
.mapsw .nvb img{width:100%;height:auto;display:block;aspect-ratio:720/162;object-fit:fill}   /* обе плашки одной высоты: «Карта» чуть сплюснута до высоты «Комнаты» */.mapsw .nvb.on{filter:drop-shadow(0 0 6px rgba(255,200,90,.65)) brightness(1.08)}.mapsw .nvb:active{transform:scale(.97)}
.mapsw .nvsep{flex:0 0 2px;align-self:stretch;margin:6px 0;background:linear-gradient(transparent,#C9A24A,transparent);border-radius:2px}
.imgbtn .ibfree{position:absolute;right:12%;top:-4px;line-height:1;font-size:11px;font-weight:700;padding:3px 7px;border-radius:8px;background:#2ECC71;color:#062;z-index:1}
.loc img{width:30px;height:30px;border-radius:6px;object-fit:contain;background:#000;flex:0 0 auto}
.week h2{margin:0}
.inds{display:flex;gap:2px}
.ind{width:44px;height:18px;display:inline-block;background:url(img/nav/act_on.webp) center/contain no-repeat}
.ind.off{background-image:url(img/nav/act_off.webp)}
.mapph{height:180px;background:#fff;color:#111;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:700;margin-bottom:8px}
.arow{display:flex;gap:12px;align-items:stretch;background:var(--nest);border-radius:12px;padding:8px;margin-top:8px;cursor:pointer}
.pic{width:84px;height:116px;background:#fff;color:#111;border-radius:8px;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:700;font-size:12px;padding:4px;flex:0 0 84px}
.arow .tx{flex:1;min-width:0}
.ttl{font-weight:700;font-size:15px}
.ds{font-size:13px;color:var(--dim);margin-top:4px}
.map{position:relative;container-type:inline-size;border-radius:10px;overflow:hidden;line-height:0;aspect-ratio:16/9}   /* как у комнаты: блок не прыгает при переключении */
.mapin{position:absolute;inset:0}
.map img{width:100%;display:block}
.mbox{position:absolute;display:flex;align-items:center;gap:1.4cqw;padding:0 1.6cqw;box-sizing:border-box;color:#BFF6FF;line-height:1.05;cursor:pointer}
.mbox img{width:7.6cqw;height:7.6cqw;border-radius:1cqw;object-fit:contain;flex:0 0 auto}
.mbox span{display:flex;flex-direction:column;min-width:0}
.mbox b{font-size:2.9cqw;font-weight:800;line-height:1.05}.mbox b.long{font-size:2.2cqw}
.mbox i{font-style:normal;font-size:1.9cqw;color:#7FBFD0;margin-top:.4cqw}
.mbox.cur b{color:var(--gold);text-shadow:0 0 6px rgba(245,197,66,.7)}
.mpin{position:absolute;width:7cqw;height:7cqw;transform:translate(-50%,-50%);border-radius:50%;cursor:pointer}
.ovl{position:fixed;inset:0;background:rgba(0,0,0,.78);display:flex;align-items:center;justify-content:center;padding:12px;z-index:10}
.lwrap{width:min(100%,calc((100vh - 90px)*2/3))}
.lpanel{position:relative;width:100%;aspect-ratio:2/3;background-size:100% 100%;container-type:inline-size}
.lrow{position:absolute;display:flex;align-items:center;padding:0 4cqw;color:#E8ECF8;font-size:3.4cqw;line-height:1.1;overflow:hidden}
.lpedimg{position:absolute;transform:translate(-50%,-100%);width:auto;max-width:20%;object-fit:contain;filter:drop-shadow(0 6px 8px rgba(0,0,0,.7))}
.lped{position:absolute;transform:translate(-50%,-100%);color:var(--gold);font-weight:700;font-size:3cqw;text-align:center;white-space:nowrap;text-shadow:0 0 6px rgba(0,0,0,.9)}
.lclose{position:absolute;top:0;right:0;width:15%;height:10%;background:transparent;border:0;cursor:pointer}
img.pic{object-fit:cover;padding:0;background:#fff}
.bigpic{display:block;width:200px;height:276px;object-fit:cover;border-radius:10px;margin:0 auto}
.bigpic.tall{width:220px;height:auto}
.beastmark{display:inline-flex;vertical-align:middle;margin-left:6px}
.beastmark .aic{width:26px;height:26px;border-radius:6px}
.ttag{width:18px;height:18px;object-fit:contain;vertical-align:middle;margin-right:4px}
.semipick{display:flex;align-items:center;gap:8px;margin-top:8px;padding:6px 8px;border:1px solid var(--gold);border-radius:10px}
.semipick .ttag{width:40px;height:40px}
.ctteams{display:flex;justify-content:center;gap:8px;margin-bottom:6px}
.ctteams img{width:56px;height:56px;border-radius:10px;opacity:.55}
.ctteams img.my{opacity:1;outline:2px solid var(--gold)}
.scene{display:block;width:100%;border-radius:10px;margin-bottom:4px}
.tierbtn{position:relative;display:block;width:100%;padding:0;border:0;background:none;border-radius:10px;overflow:hidden;cursor:pointer;margin-top:8px}
.tierbtn:first-child{margin-top:0}
.tierbtn img{display:block;width:100%}
.tierbtn.locked{cursor:default}
.tierbtn.locked img{filter:grayscale(1) brightness(.45)}
.tierbtn .tag{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.75);color:var(--txt);font-size:12px;font-weight:700;padding:4px 8px;border-radius:6px}
.tierbtn .tag.gold{color:var(--gold)}
.frow{display:flex;align-items:flex-start;gap:8px}
.fbox{flex:1;position:relative;text-align:center;min-width:0}
.face{width:100%;aspect-ratio:1;background:#fff;color:#111;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:700;margin-bottom:6px}
.fname{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vs{align-self:center;font-weight:700;color:var(--gold);padding-top:20px}
.bar{height:10px;border-radius:5px;background:#0B0F1C;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;transition:width .1s linear}
.bar.hp i{background:linear-gradient(90deg,#FF5A5A,#FF8A5A)}
.bar.qi i{background:linear-gradient(90deg,#2FD7FF,#3A7BFF)}
.frest{font-size:12px;color:var(--gold);min-height:16px;margin-top:4px}
.fx{position:absolute;left:0;right:0;top:30%;font-size:22px;font-weight:800;text-shadow:0 2px 6px #000;opacity:0;pointer-events:none}
.fx.go{animation:fxup .8s ease-out forwards}
@keyframes fxup{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-30px)}}
.flog{font-size:13px;line-height:1.5;background:var(--nest);border-radius:10px;padding:8px 10px;margin-top:10px;min-height:100px}
.aic{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:7px;font-size:16px;color:#fff;flex:0 0 auto}
.iconpick{padding:3px;border:2px solid transparent;border-radius:10px;background:none;cursor:pointer}
.iconpick .aic{width:40px;height:40px;font-size:22px}
.iconpick.on{border-color:var(--gold)}
textarea{width:100%;padding:11px;border-radius:10px;border:1px solid var(--line);background:#0B0F1C;color:var(--txt);font-size:15px;font-family:inherit;resize:vertical}
.abil{display:flex;align-items:center;justify-content:center;gap:6px;font-size:12px;margin-top:6px;min-width:0}
.abil span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.abil .aic{width:22px;height:22px;font-size:13px}
.fx{font-size:18px}
.acd{font-size:11px;color:var(--dim);min-height:14px}
.abil.cd .aic{filter:grayscale(1) brightness(.6)}
.ff{min-height:100vh;display:flex;justify-content:center;align-items:flex-start;background:#04070F}
.ffwrap{width:100%;max-width:520px}
.ffbox{position:relative;width:100%;aspect-ratio:908/906;background:url(img/fight_bg.webp) top center/100% auto no-repeat;container-type:inline-size;font-size:3.6cqw}
.ffbot{container-type:inline-size;padding:0 1.5% 16px;display:flex;flex-direction:column;gap:8px;background:#04070F}
.ffbox>*{position:absolute}
.ff-back{background:transparent;border:0;cursor:pointer}
.ff-face{background:radial-gradient(circle at 50% 38%,#5A6E99 0%,#34446A 45%,#1A2340 100%);overflow:hidden;clip-path:polygon(5% 0,95% 0,100% 5%,100% 100%,0 100%,0 5%)}
.ff-face img{width:100%;height:100%;object-fit:cover;object-position:center top;display:block}
.ff-plate{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:.6cqw}
.ff-plate b{font-size:4.2cqw;line-height:1.1;max-width:95%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ff-plate span{color:var(--dim);font-size:3.2cqw}
.ff-plate em{font-style:normal;color:var(--gold);font-size:3cqw;min-height:3.6cqw}
.ff-bar{border-radius:3cqw;overflow:hidden}
.ff-bar i{display:block;height:100%;transition:width .1s linear;border-radius:3cqw}
.ff-bar.hp i{background:linear-gradient(90deg,#FF4D5E,#FF8A5A)}
.ff-bar.qi i{background:linear-gradient(90deg,#2FD7FF,#3A7BFF)}
.ff-icon{background:transparent;border:0;padding:0;display:flex;align-items:center;justify-content:center;cursor:pointer}
.ff-icon .aic{width:78%;height:78%;font-size:8cqw;border-radius:1.6cqw}
.ff-icon.cd .aic{filter:grayscale(1) brightness(.55)}
.ff-name{display:flex;flex-direction:column;justify-content:center;padding-left:1.5cqw;gap:.8cqw;min-width:0}
.ff-name b{font-size:3.6cqw;line-height:1.15;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.ff-name span{font-size:2.9cqw;color:var(--dim)}
.ff-title{display:flex;align-items:center;justify-content:center;text-align:center;font-weight:700;font-size:3.6cqw;padding:0 3cqw;line-height:1.1}
.ff-log{display:flex;flex-direction:column;gap:2cqw}
.ff-log .flog{flex:1;margin:0;background:transparent;font-size:3.4cqw;min-height:0;overflow:hidden;padding:1cqw 2cqw}
.ff-ctl{display:flex;gap:2cqw}
.ff-ctl .btn{margin:0;text-align:center;padding:2.2cqw;font-size:3.6cqw}
#fend .btn{margin-top:2cqw;text-align:center}
.ff-fx{display:flex;align-items:center;justify-content:center;text-align:center;font-size:6cqw;font-weight:800;text-shadow:0 2px 6px #000;opacity:0;pointer-events:none;padding:0 2cqw}
.ff-fx2{align-items:flex-end;padding-bottom:4cqw;font-size:4.6cqw}
.ff-fx.go{animation:fxup .9s ease-out forwards}
.ff-fx.qi{color:#2FD7FF}
.rt{display:inline-flex;align-items:center;gap:.3em;font-family:'Exo 2',Rubik,sans-serif;font-style:italic;font-weight:900;line-height:1;letter-spacing:.02em}
.rt img{height:1.5em;width:auto;filter:drop-shadow(0 0 4px rgba(0,0,0,.6))}
.rt b{font-weight:900;background:linear-gradient(180deg,#FFFFFF 0%,#FFE7A3 55%,#F5C542 100%);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 2px 10px rgba(245,197,66,.25);padding-right:.12em}
.rt.big{font-size:28px}
.rt.mid{font-size:22px}
.rt.rf{font-size:4.2cqw}
.rt.rf img{height:1.25em}
.rate{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.rate .lg{font-family:'Exo 2',Rubik,sans-serif;font-style:italic;font-weight:800;letter-spacing:.06em;text-transform:uppercase;font-size:11px}
img.aic{object-fit:cover;background:#0B0F1C;display:block}
.iconsgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;max-height:330px;overflow-y:auto;padding-right:2px}
.iconsgrid .iconpick{padding:2px;width:100%}
.iconsgrid .iconpick .aic{width:100%;height:auto;aspect-ratio:1}
.gold{color:var(--gold)}
.ser{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;padding:7px 4px;border-bottom:1px solid var(--line);font-size:14px}
.ser span{color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ser span:last-child{text-align:right}
.ser span.win{color:var(--txt);font-weight:700}
.ser .ssc{font-family:'Exo 2',Rubik,sans-serif;font-style:italic;font-weight:900}
.ser.mine{background:rgba(245,197,66,.08);border-radius:6px}

.fzh{grid-area:h;display:flex;align-items:center;flex-wrap:wrap;gap:4px 10px;padding:12px 2px 10px;border-bottom:1px solid rgba(58,143,216,.35)}
.fzback{width:32px;height:32px;border-radius:8px;border:1px solid #2A3A60;background:#16213A;color:var(--txt);font-size:18px;cursor:pointer}
.fzlogo{font-family:'Exo 2',Rubik,sans-serif;font-style:italic;font-weight:900;font-size:24px;letter-spacing:.04em;color:#fff}
.fzsl{color:#2FD7FF;font-size:24px;font-style:italic;font-weight:300}
.fzh b{font-size:16px;letter-spacing:.06em}
.fzst{flex-basis:100%;text-align:center;font-size:14px;color:#DCE6FF}
.fzf{grid-area:f;display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:start}
.fzvs{align-self:center;margin-top:-40%;font-family:'Exo 2',Rubik,sans-serif;font-style:italic;font-weight:900;font-size:22px;color:#fff;text-shadow:0 0 10px rgba(47,215,255,.6)}
.fzc{border:1.5px solid #3D7BE0;border-radius:12px;background:#0D1428;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.fzc.fb{border-color:#E0604A}
.fzp{position:relative;aspect-ratio:1/1;background:radial-gradient(circle at 50% 38%,#5A6E99 0%,#34446A 45%,#1A2340 100%);container-type:inline-size;overflow:hidden}
.fzp img{width:100%;height:100%;object-fit:cover;object-position:center top;display:block}
.fzp .ff-fx{position:absolute;inset:0}
.fzn{display:flex;flex-direction:column;gap:3px;padding:6px 8px 4px;background:#111B33}
.fznb{font-size:15px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fzn2{display:flex;align-items:flex-end;justify-content:space-between;gap:4px;min-height:24px}
.fznm small{font-size:9px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.1}
html.land .fznb{font-size:19px}
html.land .fznm small{font-size:12px}
.fznm{display:flex;align-items:center;gap:5px;min-width:0}
.fzt{width:26px;height:26px;object-fit:contain;flex:0 0 auto}
.fznn{display:flex;flex-direction:column;min-width:0}
.fznn small{font-size:9px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
html.land .fzt{width:34px;height:34px}
html.land .fznn small{font-size:11px}
.fzn b{font-size:14px;letter-spacing:-.01em;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.fzr{display:flex;flex-direction:column;align-items:flex-end;flex:0 0 auto}
.fzr small{font-size:9px;color:var(--dim)}
.rt.fzrt{font-size:12px}
.rt.fzrt img{height:1.3em}
html.land .rt.fzrt{font-size:16px}
.fzb{display:grid;grid-template-columns:22px 1fr auto;align-items:center;gap:5px;padding:3px 8px;font-size:11px;font-weight:700}
.fzb em{font-style:normal;font-weight:500;color:#DCE6FF;font-size:10px;min-width:44px;text-align:right}
.fzbar{height:9px;border-radius:5px;background:#1A2540;overflow:hidden;border:1px solid #2A3A60}
.fzbar i{display:block;height:100%;transition:width .12s linear}
.fzbar.hp i{background:linear-gradient(90deg,#3FCF5A,#7BF07F)}
.fzbar.qi i{background:linear-gradient(90deg,#1FB7E8,#5FE7FF)}
.fza{margin:6px;display:flex;gap:6px;align-items:center;text-align:left;border:1px solid #2A3A60;border-radius:10px;background:#0B1224;color:var(--txt);padding:6px;font-family:inherit;cursor:pointer}
.fza .aic{width:34px;height:34px;border-radius:8px;flex:0 0 auto}
.fza>span{display:flex;flex-direction:column;min-width:0;gap:1px}
.fza small{font-size:9px;color:var(--dim);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fza b{font-size:12px;line-height:1.15}
.fza i{font-style:normal;font-size:10px;color:#AEB9D6;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.fza em{font-style:normal;font-size:10px;align-self:flex-start;margin-top:2px;padding:1px 7px;border-radius:6px;border:1px solid #3A4A70;color:var(--dim)}
.fza em.ok{border-color:#3FCF5A;color:#7BF07F}
.fza.cd .aic{filter:grayscale(1) brightness(.6)}
.fzl{grid-area:l;border:1px solid rgba(58,143,216,.5);border-radius:12px;background:#0C1428;padding:10px 12px;min-height:120px}
.fzl h3{margin:0 0 6px;font-size:16px;letter-spacing:.05em;text-transform:uppercase}
.fzl .flog{margin:0;background:transparent;padding:0;font-size:13px;line-height:1.35;max-height:150px;overflow:hidden}
.fzl .flog div{border-left:3px solid #2FD7FF;padding:3px 0 3px 8px;margin:4px 0;border-bottom:1px solid rgba(58,143,216,.15)}
.fzl #fend .btn{margin-top:8px;text-align:center}
.fzk{grid-area:k;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.fzk button{padding:10px 0;border-radius:10px;border:1px solid #3A8FD8;background:#0C1428;color:#fff;font-family:inherit;font-size:17px;font-weight:700;cursor:pointer}
.fzk button.on{background:linear-gradient(180deg,#E8A33A,#B8741B);border-color:#F5C542}
html.land .fz{max-width:1240px;grid-template-columns:minmax(0,2fr) minmax(260px,1fr);grid-template-rows:auto 1fr auto;grid-template-areas:"h h" "f l" "f k";gap:12px}
html.land .fzst{flex-basis:auto;margin-left:auto;padding-left:14px;border-left:1px solid rgba(58,143,216,.5)}
html.land .fzp{aspect-ratio:auto;height:min(30vw,calc(100vh - 420px));min-height:130px}
html.land .fzl .flog{max-height:none}
html.land .fzn b{font-size:18px}
html.land .fza b{font-size:14px}
/* ---------- главный экран, нижнее меню, экран действия ---------- */
#app[data-view=main],#app[data-view=more],#app[data-view=coll],#app:has(>.nav){padding-bottom:calc(84px + env(safe-area-inset-bottom))}
.nav .nvr1{display:flex;align-items:center;justify-content:center;gap:8px}
.nav .nvr2{display:flex;align-items:center;justify-content:space-between;gap:6px}
.nav .nvsep{flex:0 0 2px;align-self:stretch;margin:6px 0;background:linear-gradient(transparent,#C9A24A,transparent);border-radius:2px}
.nav .nvb{all:unset;position:relative;cursor:pointer;display:block;line-height:0;transition:transform .12s,filter .15s;filter:brightness(.82) saturate(.9)}
.nav .nvb img{width:100%;height:auto;display:block}
.nav .nv-room,.nav .nv-map{width:calc(50% - 9px)}
.nav .nv-more{width:calc(50% - 4px)}.nav .nv-shop{width:calc(50% - 4px)}.nav .nv-shop .nvtx{font-size:clamp(14px,4vw,18px)}
.nav .nvb.on{filter:drop-shadow(0 0 6px rgba(255,200,90,.65)) brightness(1.08)}
.nav .nvb:active{transform:scale(.97)}
.nav .nvb:disabled{filter:grayscale(1) brightness(.55);cursor:default}
.nav .nvb small{position:absolute;right:14%;top:-6px;line-height:1;font-size:10px;font-weight:700;padding:3px 6px;border-radius:8px;background:#2ECC71;color:#062;box-shadow:0 0 6px rgba(46,204,113,.6)}
.nav .nvtx{display:flex;align-items:center;justify-content:center;gap:8px;line-height:1;height:var(--nvh,28px);font-weight:800;font-size:13px;color:#F7EBD0;background:linear-gradient(135deg,#1B2747,#0E1630);border:2px solid #C9A24A;clip-path:polygon(8px 0,calc(100% - 8px) 0,100% 8px,100% calc(100% - 8px),calc(100% - 8px) 100%,8px 100%,0 calc(100% - 8px),0 8px);box-shadow:inset 0 0 0 1px #6B5320}
.nav .nvtx i{font-style:normal;color:#E2B657;font-size:17px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;flex-direction:column;gap:6px;padding:8px 8px calc(8px + env(safe-area-inset-bottom));background:rgba(11,16,32,.96);border-top:1px solid var(--line);max-width:520px;margin:0 auto}
.mgrid{display:block}
.inds{display:flex;align-items:center;gap:6px;margin-top:8px}
.inds{flex-wrap:wrap}
.inds .dim{margin-left:6px;font-size:13px;white-space:nowrap}
.arow.done{opacity:.4;filter:grayscale(1);cursor:default}
.arow{align-items:center;padding:8px 14px 8px 8px}.arow .ttl{font-size:17px;font-weight:700}.arow .arch{margin-left:auto;font-style:normal;font-size:24px;color:var(--gold);line-height:1}
.evtwho{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 4px}.evtwho span{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;width:62px;text-align:center}
.evtwho .ava{width:52px;height:52px;border-radius:12px;overflow:hidden;border:2px solid #2ECC71;box-shadow:0 0 8px rgba(46,204,113,.5)}.evtwho .ava img{width:100%;height:100%;object-fit:cover;object-position:top}
.arow{width:100%;border:1px solid var(--line);font-family:inherit;color:var(--txt);text-align:left;background:var(--nest)}
.arow .ds{color:var(--dim);font-size:13px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.tag{display:inline-block;margin-top:6px;font-size:12px;font-weight:700;padding:2px 8px;border-radius:6px;border:1px solid var(--line)}
.tag.plus{color:var(--good);border-color:rgba(101,217,121,.5)}.tag.minus{color:var(--bad);border-color:rgba(255,139,123,.5)}.tag.rand{color:var(--gold);border-color:rgba(245,200,76,.5)}.tag.nt{color:var(--dim)}
.morei{display:flex;flex-direction:column;gap:2px}
.morei b{font-weight:600}
.morei .dim{font-size:13px}
.evt{display:flex;flex-direction:column;gap:14px}
.evtpic{display:flex;justify-content:center}
.evtpic img{width:100%;max-width:300px;aspect-ratio:270/372;object-fit:cover;border-radius:12px;display:block}
.evtpic img.big{max-width:none;aspect-ratio:4/3}
.evtinfo h2{margin:0 0 6px;font-size:22px}
.evtinfo p{margin:0 0 12px;line-height:1.45;text-align:left}
.effbox{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--nest);margin-bottom:10px}
.effbox span{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.effbox b{font-size:16px;font-weight:600}
.effbox.plus{border-color:rgba(101,217,121,.6)}.effbox.plus span{color:var(--good)}
.effbox.minus{border-color:rgba(255,139,123,.6)}.effbox.minus span{color:var(--bad)}
.effbox.rand span{color:var(--gold)}.effbox.nt span{color:var(--dim)}
.tendq{margin:10px 0 4px;padding:10px 12px;border-radius:12px;background:var(--nest);font-style:italic;line-height:1.45;text-align:left}
.tendimg{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:12px;display:block;margin-bottom:10px}
.victt{color:var(--gold);font-size:26px;text-align:center}
.vic .evtpic img.big{aspect-ratio:4/3;object-fit:cover}
.bkt{display:flex;gap:18px;overflow-x:auto;padding:10px 2px 6px;-webkit-overflow-scrolling:touch}
.bkc{flex:0 0 146px;display:flex;flex-direction:column}
.bkh{font-size:13px;font-weight:800;color:var(--cyan);text-align:center;margin-bottom:6px;display:flex;flex-direction:column}
.bkh small{font-size:11px;color:var(--dim);font-weight:500}
.bkm{flex:1;display:flex;flex-direction:column;justify-content:space-around;gap:10px}
.bkp{position:relative;border:1px solid var(--line);border-radius:10px;background:var(--nest);overflow:visible}
.bkp.now{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.bkpair{position:relative;flex:1;display:flex;flex-direction:column;justify-content:space-around;gap:10px}
.bkpair .bkp::after{content:'';position:absolute;right:-10px;top:50%;width:9px;border-top:2px solid #3D4F78}
.bkpair::before{content:'';position:absolute;right:-10px;top:25%;bottom:25%;border-right:2px solid #3D4F78}
.bkpair::after{content:'';position:absolute;right:-19px;top:50%;width:9px;border-top:2px solid #3D4F78}
.bksolo{flex:1;display:flex;flex-direction:column;justify-content:center}
.bksolo.go .bkp::after{content:'';position:absolute;right:-19px;top:50%;width:18px;border-top:2px solid #3D4F78}
.bks{display:flex;align-items:center;gap:6px;padding:6px 8px;font-size:13px;min-height:32px}
.bks+.bks{border-top:1px solid var(--line)}
.bks span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bks b{min-width:14px;text-align:right}
.bks.win{background:rgba(101,217,121,.14)}.bks.win b{color:var(--good)}
.bks.lose{background:rgba(255,110,100,.13)}.bks.lose span,.bks.lose b{opacity:.65}
.bks.me span{color:var(--gold);font-weight:800}
.bks.tbd span{color:var(--dim)}
.bkc.champ .bkp{border-color:var(--gold)}
.invbox{margin:10px 0}
.invrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.invp{display:flex;align-items:center;gap:6px;padding:4px 10px 4px 4px;border-radius:999px;border:1px solid var(--line);background:var(--nest);color:var(--txt);font:inherit;font-size:14px;cursor:pointer}
.invp .ava{width:30px;height:30px;border-radius:50%}
.invp.on{border-color:var(--good);background:rgba(101,217,121,.15);box-shadow:0 0 0 1px var(--good)}
.imgbtn{all:unset;box-sizing:border-box;display:block;width:100%;position:relative;cursor:pointer;line-height:0;margin-top:8px;transition:transform .12s,filter .15s}
.imgbtn img{width:100%;height:auto;display:block}
.imgbtn.over{margin-top:calc(4.2% + 2px);width:calc(100% * 904 / 900)}.imgbtn.over img{margin-top:-4.2%}   /* у Бюро голова выходит за рамку */
.imgbtn:active{transform:scale(.985)}
.imgbtn:disabled{filter:grayscale(1) brightness(.55);cursor:default}
.imgbtn.nextwk{container-type:inline-size}.imgbtn.nextwk small{position:absolute;left:31%;bottom:13%;line-height:1;font-size:3.3cqw;font-weight:600;color:#AFC0DA}
.imgbtn.nextwk.ready{animation:wkglow 1.8s ease-in-out infinite}
@keyframes wkglow{50%{filter:drop-shadow(0 0 10px rgba(255,200,90,.8)) brightness(1.1)}}
.nextwk.btn{margin-top:10px;text-align:center;font-weight:800;font-size:17px;padding:12px}
.nextwk.soft{font-size:14px;font-weight:600;padding:9px;color:var(--dim)}
.sstat{margin-top:4px;font-size:13px;font-weight:700;color:var(--cyan)}
.ivq{padding:12px 14px;border-radius:12px;background:var(--nest);border-left:3px solid var(--cyan);font-size:16px;line-height:1.45;margin:8px 0 10px}
.quote{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;background:var(--nest);margin-bottom:10px}
.quote .ava{width:48px;height:48px}
.quote p{margin:0;font-style:italic;line-height:1.45}
.evtgo{text-align:center;margin-top:6px}
html.land #app[data-view=main],html.land #app[data-view=card],html.land #app[data-view=cardres],html.land #app[data-view=more],html.land #app[data-view=coll]{column-count:1}
html.land #app[data-view=main],html.land #app[data-view=more],html.land #app[data-view=coll],html.land #app:has(>.nav){padding-left:0;padding-bottom:40px}
html.land .nav{position:static;width:auto;max-width:none;margin:10px 0 0;border:0;background:none;padding:0;column-span:all}
html.land .nav .nvr2{flex-direction:row;gap:12px;max-width:720px;margin:0 auto}
html.land .nav{--nvh:38px}html.land .nav .nvtx{font-size:15px}html.land .nav .nvsep{display:none}html.land .nav .nvb{width:calc(50% - 6px)!important}
html.land .mgrid.land2{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:16px;align-items:start}html.land .mcol>.card{margin-top:12px}

html.land #app>.card.evt{display:flex;flex-direction:row;align-items:flex-start}
html.land .evtpic{flex:0 0 55%}
html.land .evtpic img{max-width:none;max-height:calc(100vh - 170px);width:auto}
html.land .evtpic img.big{width:100%;height:auto}
html.land .evtinfo{flex:1;min-width:0}

html.land .fznn b{font-size:20px}
html.land .fzt{width:36px;height:36px}
html.land .fzlg{font-size:12px}
html.land .fztn{font-size:13px}

/* бой: крупная эмблема команды слева от полос HP и Цы, без команды — FREE AGENT */

function rollHit(x, y) {
  // d20: 19–20 крит (10%), 1–3 уклон (15%), 4 парирование (5%), 5–6 блок (10%), остальное — удар

  if (x.critN > 0 && !x.inAbil) { x.critN--; return { kind: 'crit', dmg: Math.round(base * 2), base }; }   // линза фокуса
  if (roll === 20 || r >= 19) return { kind: 'crit', dmg: Math.round(base * 2), base };
  if (y.exposed > 0) return { kind: 'hit', dmg: Math.round(base * (1 - FIGHT.spread + Math.random() * 2 * FIGHT.spread)), base };   // после «Разрыва потока» — без уклонов, блоков и парирований
  if (roll === 1 || r <= 3) return { kind: 'dodge', dmg: 0, base };
  if (r === 4) return { kind: 'parry', dmg: 0, base };

    const cut = Math.random() < 0.33 ? 1 : FIGHT.blockMin + Math.random() * (1 - FIGHT.blockMin);
    return { kind: 'block', dmg: Math.round(base * (1 - cut)), full: cut >= 1, base };
  }

}

function bureauFight(kind) {
  if (!spend()) return;
  const title = kind === 'ladder' ? 'Лестничный матч' : 'Бой с Элитным Спектром';
  let opp, name;
  if (kind === 'ladder') {   // соперник по твоему рейтингу ±200; сила 10–55
    const p = Math.max(LADDER_MIN, Math.min(LADDER_MAX, Math.round((S.rating + rnd(-200, 200)) / 30)));
    const g = genSpectre(S.region, takenSet([S.nick]), p); name = g.name;
    opp = fighter(name, p, npcRating(p), false, g.abil, g.face); opp.country = g.country;
  } else {                   // один из 12 про-игроков региона
    const f = lgPool(S.region)[rnd(0, proCount(S.region) - 1)];
    name = f.name; opp = withMeta(fighter(f.name, f.p, f.rating, false, f.abil, f.face), f.country, eliteTeam(S.region, f.name)); opp.kit = npcKit('pro');
  }
  startFight(title, opp, won => {
    const big = (S.ladderGames || 0) < 10;   // первые 10 лестничных матчей — по 150 (калибровка); дальше — как в Эло: против слабых почти ничего, против сильных — много
    const E = 1 / (1 + Math.pow(10, (opp.rating - S.rating) / 400)), K = kind === 'ladder' ? LADDER_K : ELITE_K;
    const d = kind === 'ladder' && big ? (won ? 150 : -150) : Math.round(K * ((won ? 1 : 0) - E)) || (won ? 1 : -1);
    if (kind === 'ladder') S.ladderGames = (S.ladderGames || 0) + 1;
    S.rating = Math.max(0, S.rating + d);
    if (won) S.coins = (S.coins || 0) + (kind === 'ladder' ? LADDER_COINS : ELITE_COINS);
    histAdd(title + ' · ' + (won ? 'победа' : 'поражение') + ' · ' + (d > 0 ? '+' : '') + d);
    logMsg(title + ' против ' + name + ': ' + (won ? 'победа' : 'поражение') + ' (' + (d > 0 ? '+' : '') + d + ' рейтинга' + (won ? `, +${kind === 'ladder' ? LADDER_COINS : ELITE_COINS} крипты` : '') + ').');
    S.view = 'bureau';
  });
}

const ESL_MIN_POWER = 50, ESL_SIZES = { 8: 'se8', 12: 'g12', 16: 'g16', 20: 'sw20' };
const eslElite = key => { const [r, k] = key.split(':').map(Number); return Object.assign({ r }, lgPool(r)[k]); };
function eslNew() { S.esl = { size: 8, pick: [], inv: [], gen: [] }; }
function eslCount() { const E = S.esl; return 1 + E.inv.length + E.pick.length + E.gen.length; }
function eslFill() {   // добрать сгенерированными — как соперники в лестнице, но сила не выше 50
  const E = S.esl, taken = new Set([...G.players.map(H => H.nick), ...E.pick.map(k => eslElite(k).name), ...E.gen.map(g => g.name)]);
  const tk = takenSet([...taken]);
  while (eslCount() < E.size) {
    const p = Math.max(LADDER_MIN, Math.min(ESL_MIN_POWER, Math.round((S.rating + rnd(-200, 200)) / 30)));
    E.gen.push(genSpectre(S.region, tk, p));
  }
}
function eslStart() {
  const E = S.esl; if (!E || eslCount() !== E.size) return;
  const cost = 1 + (E.inv.length ? 1 : 0);
  if (S.actions < cost) { logMsg('Не хватает действий для ESL ONE.'); return; }
  S.actions -= cost;
  const hums = [G.cur, ...E.inv.filter(h => G.players[h] && G.players[h].region === S.region)];
  const bots = E.pick.map(eslElite).concat(E.gen);
  const ps = hums.map((h, i) => ({ id: i, name: G.players[h].nick, h, seed: Math.random() }))
    .concat(bots.map((b, i) => ({ id: hums.length + i, name: b.name, p: b.p, rating: b.rating, seed: Math.random(), face: b.face, abil: b.abil, country: b.country })));
  S.esl = null;
  tStart({ kind: 'esl', tier: null, region: S.region }, ESL_SIZES[ps.length], ps);
}

  const tabs = REGIONS.map((R, i) => tb(i, LSHORT[i])).join('') + tb(SEMI_TAB, 'Полупро');
  const list = semi ? SEMI.map(t => [-1, t[0], t[1]]) : LDB.teams.filter(t => t[0] === r);
  let h = `<div class="card"><h2>Команды лиг</h2><div class="dim">Профессиональные команды регионов: откуда они и кто за ними стоит.</div><div class="row">${tabs}</div></div>
    <div class="card"><h3>${semi ? 'Полупрофессиональные команды' : `<img class="tlogo" src="img/logo_${r}.webp" alt=""> ${esc(REGIONS[r].league)}`}</h3>${list.map(t => {
      const I = teamInfo(t);
      return `<button class="erow" data-a="tsel" data-v="${esc(t[1])}">${teamLogo(t, 40)}<span style="flex:1;text-align:left"><b>${esc(t[1])}</b><br>${I && I.city ? `<span class="dim" style="font-size:12px">${esc(I.city)}</span>` : ''}</span>${semi ? '' : `<b class="gold">+${teamBonusOf(r, t[1])}</b>`}</button>`;
    }).join('')}</div>`;
  const T = S.tsel ? ((semi ? null : LDB.teams.find(t => t[0] === r && t[1] === S.tsel)) || SEMI.filter(t => t[0] === S.tsel).map(t => [-1, t[0], t[1]])[0]) : null;
  if (T) {
    const I = teamInfo(T);
    h += `<div class="ovl" data-a="tsel" data-v=""><div class="tmodal" data-a="noop">
      <button class="tmx" data-a="tsel" data-v="" aria-label="Закрыть">✕</button>
      ${T[2] ? `<img class="tmlogo" src="img/team/${T[2]}.webp" alt="${esc(T[1])}">` : `<div class="tmlogo tmletter">${esc(T[1][0])}</div>`}
      <h2>${esc(T[1])}</h2>
      ${T[0] < 0 ? '<div class="dim">Полупрофессиональная команда · объединение Спектров</div>' : `<div class="tmbonus">Бонус к силе при подписании: <b>${bonusWord(teamBonusOf(T[0], T[1]))}</b></div>`}
      ${I ? `${I.city ? `<div class="gold">${esc(I.city)}</div>` : ''}
      <p>${esc(I.desc)}</p>
      ${I.idea ? `<h3>Коротко</h3><ul>${I.idea.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : ''}
      ${I.sponsors ? `<h3>Спонсоры</h3><div class="spons">${I.sponsors.map((x, k) => `<span class="spon"><i style="background:${SPONSOR_COLORS[k % SPONSOR_COLORS.length]}">${esc(x[0])}</i>${esc(x)}</span>`).join('')}</div>` : ''}`
      : '<p class="dim">Описание команды пока не заполнено.</p>'}
    </div></div>`;
  }
  return wrap(h + back);
}

  { t: "Снаряжение на арене", d: "Многие Спектры носят с собой не только артефакты. Рудные батареи возвращают поток Цы, когда тело уже на пределе; гранаты, сыворотки и кристаллы решают исход боя за секунду. Профессионалы лиг не выходят на арену без такого набора, полупрофессионалы берут его изредка, а новички о нём даже не слышали." },
  { t: "Своё жильё", d: "Пока у Спектра нет своего угла, он живёт по графику Бюро: очереди, регистрация, пропуска. Тому, у кого есть собственное жильё, Бюро присылает документы на дом — и поход в его офис больше не съедает драгоценное время недели." },
  { t: "Остров вдали от часовых поясов", d: "Владельцы собственных островов давно перестали бояться джетлага: частная полоса, свой экипаж и тишина океана. Говорят, после перелёта на остров Спектр выходит на арену так, будто и не покидал дом." },

  { t: "Цена потока", d: "Каждая форма, созданная из потока, тянет Цы из тела. Пока поток течёт ровно, Спектр непобедим. Стоит ему оборваться — и даже чемпион становится обычным человеком с пустыми руками." },
  { t: "Пятёрка величайших мечников", d: "В мире есть пять мечников, которых признают все: первый среди них — Knight из Китая. Рядом с ним стоят кореец Lyn, русская Velikaya и европейцы JaN и NukeDuck. Каждый из пяти хоть раз проигрывал другим, но никто за пределами пятёрки ещё ни разу не побеждал их клинком." },
  { t: "Король арены", d: "Faker — сильнейший Спектр мира. Тихий и вежливый вне арены, он не повышает голос и не делает громких заявлений. Ему это не нужно: его имя на табло делает это за него." },
  { t: "Корпорация «Метеор Индастриз»", d: "Первые прииски метеоритной руды на дне Атлантики выкупила «Метеор Индастриз». Сегодня почти каждый артефакт на арене прошёл через её заводы — и почти каждый судебный иск против неё закончился мировым соглашением." },
  { t: "Концерн «Аврора Медиа»", d: "«Аврора» транслирует бои Спектров в сотню стран. Злые языки говорят, что концерн решает, кому быть звездой: камера чаще смотрит на тех, кто продаёт рекламу лучше остальных." },
  { t: "Банк «Северный Альянс»", d: "Именно «Северный Альянс» выпустил крипту Спектров — цифровую монету, которой расплачиваются за всё на арене и вне её. Банк зарабатывает на каждом переводе, а его основатель, по слухам, ни разу в жизни не был на арене." },
  { t: "Бойцовский клуб", d: "Бойцовский клуб появился в подвале старого спортзала, когда Бюро отказалось регистрировать бои без правил. Сегодня его пояса стоят дороже многих кубков, а каждый чемпион обязан защищать титул перед любым, кто выиграет турнир." },
  { t: "Фестиваль Спектров", d: "Каждый год фестиваль колесит по городам на десятках автобусов. Профессионалы его недооценивают, а зря: половина нынешних звёзд впервые вышла на арену именно на фестивальной площадке." },

  { t: "Потерянный ботинок", d: "Финал полупрофессионального турнира однажды остановили на семь минут: у бойца слетел ботинок и улетел на трибуну. Болельщик вернул его только в обмен на автограф — на подошве." },
  { t: "Перепутанная арена", d: "Восходящая звезда Америки приехала на матч, вышла на арену, поклонилась публике — и только тогда поняла, что это свадебный зал в соседнем здании. Говорят, жених потом стал его фанатом." },
  { t: "Кот в кадре", d: "Посреди трансляции чемпионата на ринг вышел бездомный кот и уселся ровно между бойцами. Оба ждали, пока он уйдёт. Кот не ушёл. Бой перенесли, а кота взяла к себе команда и назвала его тренером." },
  { t: "Слишком громкий удар", d: "Один Спектр так эффектно применил способность, что сработала противопожарная сигнализация, и весь стадион эвакуировали. Счёт боя до сих пор официально записан как «пожарные — 1, бойцы — 0»." },
  { t: "Интервью наоборот", d: "Журналист так волновался перед интервью с Faker, что сам начал отвечать на собственные вопросы. Faker вежливо дослушал до конца и сказал: «Отличные ответы». Видео посмотрели больше людей, чем финал." },
  { t: "Перепутанные клинки", d: "Двое мечников на турнире случайно поменялись чехлами, и оба вышли на арену с чужими мечами. Бой закончился ничьей, потому что оба весь бой спорили, у кого клинок лучше." },
  { t: "Дед и пирожки", d: "Старейший Спектр Китая приносит на каждый полупрофессиональный турнир пакет пирожков для соперников. Побеждает он почти всегда — злые языки говорят, что именно из-за пирожков." },
  { t: "Медведь на трибуне", d: "На матче в Северной лиге в первом ряду сидел настоящий медведь — талисман одной из команд. Когда его команда проиграла, медведь ушёл молча, но с таким видом, что тренер наутро подал в отставку." },
  { t: "Будильник чемпиона", d: "Один чемпион проспал собственный финал. Когда он вбежал на арену в пижаме, соперник так смеялся, что потерял концентрацию и проиграл. С тех пор пижама висит в Зале славы." },

  { t: "Грязные контракты", d: "У Бюро есть теневая сторона. Тем, кто подписал грязные контракты, открыты двери любых турниров: они врываются на чужие сетки, и никто не задаёт вопросов." },
  { t: "Атлантический Инцидент", d: "Метеорит упал в Атлантический океан и изменил очертания мира. Наводнения поглотили прибрежные города, разрушенные берега превратились в архипелаги. Перед общей катастрофой человечеству пришлось объединиться. Но последствия удара не ограничились разрушениями." },
  { t: "Первые Спектры", d: "После Инцидента у некоторых людей начали проявляться необычные способности. Кто-то двигался быстрее взгляда, кто-то создавал предметы из воздуха. Их назвали Спектрами. Позднее исследователи установили связь между пробуждением дара и излучением метеорита." },
  { t: "Камень рядом с кожей", d: "Метеоритную руду научились встраивать в привычные вещи: кольца, часы, браслеты. Для одного Спектра такие часы становятся источником невероятной скорости, для другого кольцо позволяет создать клинок. Камень усиливает дар, но не заменяет умение им пользоваться." },
  { t: "Цена чуда", d: "Первыми энергию Спектров описали китайские исследователи. Так закрепилось название — Цы. Её запас ограничен: каждый созданный клинок и каждый сверхбыстрый рывок требуют сил. Даже самый впечатляющий дар бесполезен, если его владелец истощён." },
  { t: "Больше — не значит сильнее", d: "Крупный метеоритный камень даёт больше излучения, но управлять им тяжелее. Избыточная нагрузка быстро расходует Цы. Опытный Спектр выбирает камень под себя: достаточно мощный для своего дара и достаточно удобный, чтобы сохранять контроль до конца поединка." },
  { t: "Бюро Спектров", d: "Когда обладателей сверхспособностей стало слишком много, миру понадобились общие правила. Так появилось Бюро — организация, которая регистрирует Спектров и контролирует использование их сил. Здесь начинаются карьеры, оформляются допуски и появляются первые записи о будущих легендах." },
  { t: "Пять лиг", d: "Америка, Европа, Северный континентальный регион, Китай и Корея стали центрами пяти крупных лиг. У каждой — свои турниры, влиятельные корпорации и звёзды. Спектры путешествуют между регионами, набираются опыта и ищут место, где их способности оценят по достоинству." },
  { t: "Места на вершине", d: "Число договоров в каждой лиге строго ограничено. В Америке, Китае и Корее их всего двенадцать, в Северной лиге — двадцать, а Европа собирает сорок команд, включая полупрофессиональные. Договор открывает доступ к самым престижным соревнованиям и борьбе за очки лиги. Попасть в этот круг трудно. Остаться в нём ещё труднее: за каждым свободным местом следят десятки претендентов." },
  { t: "United Spectre Association", d: "Американская лига — двенадцать команд, и за каждой стоит корпорация с громким именем. Сезон идёт в два круга, где каждый встречается с каждым. Двое лучших сразу проходят в полуфинал, места с третьего по десятое бьются в плей-ине. Здесь любят шоу: звёзды, яркие эмблемы и драма до последнего раунда." },
  { t: "Объединённая европейская лига", d: "LCS — самая многолюдная лига мира: двадцать пять профессиональных команд и пятнадцать полупрофессиональных, которым дали шанс сразиться с элитой. Сорок участников делятся на четыре группы по десять. Победители групп проходят в плей-офф напрямую, места со второго по пятое пробиваются через плей-ин, а двое последних в каждой группе отправляются в Wild Card. Боёв так много, что Европа заканчивает сезон последней." },
  { t: "Северная Континентальная лига", d: "Двадцать команд в двух группах по десять. Победители групп сразу выходят в полуфинал, места со второго по шестое дерутся в плей-ине, а четверо последних из каждой группы отправляются в Wild Card. Почти половина таблицы живёт под угрозой вылета, поэтому спокойных сезонов здесь не бывает." },
  { t: "Азиатская лига Спектров", d: "ASL — двенадцать команд Китая, два круга матчей. Сюда приходят за школой и дисциплиной: именно китайские исследователи первыми описали Цы, и местные Спектры расходуют её почти как искусство. Двое лучших идут прямо в полуфинал, места с третьего по десятое — в плей-ин." },
  { t: "Звёздная серия", d: "SSS — корейская лига из двенадцати команд с самым быстрым ритмом: все матчи группового этапа играются в одну игру, в два круга. Одна ошибка стоит очков. Двое лучших ждут в полуфинале, места с третьего по шестое разыгрывают оставшиеся две путёвки, а остальные заканчивают сезон." },
  { t: "Пять мечников", d: "Бойцов с клинками в мире немало, но лишь пятерых называют сильнейшими мечниками. Первым среди них считается китаец Knight — молчаливый воин со шрамом, для которого честь дороже победы. Корею в пятёрке представляет Lyn с двойным клинком, Россию — Velikaya, чья сабля быстрее мысли. Европа гордится сразу двумя: стремительным JaN и неуловимым NukeDuck. Каждый мечник мечтает однажды бросить вызов пятёрке." },
  { t: "Путь на вершину мира", d: "Три лучших Спектра каждой лиги едут на чемпионат мира. Последние места лиг и полупрофессионалы получают второй шанс в Wild Card: сто бойцов, жёсткий отсев — и лишь победитель занимает шестнадцатое место на чемпионате. Чемпион мира становится легендой сезона." },
  { t: "Корпорации за эмблемами", d: "Команды Спектров — часть огромных корпораций с собственными фондами, армиями и активами по всему миру. Они предоставляют бойцам экипировку, инфраструктуру и выгодные контракты. На арену Спектр выходит один, но за его спиной стоят интересы тех, чья эмблема украшает его куртку." },
  { t: "Имя в рейтинге", d: "Ладдер — общая рейтинговая таблица, в которой Спектры сражаются за очки и признание. Высокое место привлекает внимание организаторов и корпоративных скаутов. Некоторые команды заключают контракты специально ради набора рейтинга. Для профессионала вершина таблицы — часть работы." },
  { t: "Очки лиги", d: "Очки лиги — не просто строчка в таблице. Это своего рода валюта и показатель статуса: чем больше очков у Спектра, тем выше его влияние в регионе. С ним считаются организаторы турниров, корпорации и само Бюро. Потерять очки — значит потерять голос." },
  { t: "Борьба команд", d: "Команды сражаются за места в таблице не ради красоты. За победы корпорации платят крипту: из неё оплачиваются контракты, тренировки, переезды и экипировка. Чем выше команда, тем щедрее спонсоры." },
  { t: "Цифровая монета", d: "Крипта Спектров — цифровая монета. Её выпускает банк «Северный Альянс», а каждую сделку записывает распределённый реестр, который проверяет Бюро. Курс крипты растёт вместе со славой арены." },
  { t: "Кошелёк Спектра", d: "Рейтинг и крипта — разные вещи. Рейтинг показывает, кто сильнее: он растёт и падает от побед и поражений, его нельзя купить или потратить. Крипта — это деньги: её платят за победы, призовые места и контракты, а тратят в магазине на жильё, транспорт, артефакты и снаряжение." },

    case 'use': if (S.view === 'card') useCard(S.sel); break;   // повторное нажатие не списывает действие
    case 'invt': { const h = +v; if (G.mode !== 'coop' || G.players.length < 2) return; S.invite = (S.invite || []).includes(h) ? [] : [h]; break; }   // позвать можно только одного игрока
    case 'cardback': S.cardRes = null; S.view = 'main'; break;
    case 'sparpick': if (S.view === 'spar' && G.players[+v] && +v !== G.cur) sparStart(+v); break;
    case 'cupview': S.view = 'cup'; break;
    case 'offyes': if (S.offer != null) { const t = S.offer; S.offer = null; S.semi = { team: t, from: S.turn, until: S.turn + SEMI_CT_WEEKS - 1, worked: false }; S.coins = (S.coins || 0) + SIGN_COINS; logMsg(`Подписан контракт с ${SEMI_TEAMS[t]} на ${SEMI_CT_WEEKS} недели: +${SIGN_COINS} крипты.`); S.view = 'main'; } break;
    case 'offno': if (S.offer != null) { logMsg(`Ты отказался от контракта с ${SEMI_TEAMS[S.offer]}.`); S.offer = null; S.view = 'main'; } break;
    case 'noteok': S.notice = null; S.view = 'main'; break;
    case 'vicok': S.vic = null; S.view = 'main'; break;
    case 'ivans': if (S.iv) { if (++S.iv.n >= 3) useCard(S.iv.sel, true); } break;
    case 'nav': S.inRoom = v === 'room'; S.view = v === 'more' ? 'more' : 'main'; break;
    case 'coll': S.view = 'coll'; break;
    case 'fame': S.view = 'fame'; S.fameFrom = null; break;
    case 'back': S.view = 'main'; S.sel = null; break;
    case 'lib': if (spend()) { clearJet(); addEff(...LIB_B); S.libCur = null; S.view = 'lib'; } break;
    case 'rest': if (spend()) { clearJet(); S.effects = []; logMsg('Отдых: все бонусы и штрафы сняты.'); S.view = 'rest'; } break;
    case 'tour': if (spend()) { clearJet(); S.tourPass = true; S.tourInv = []; S.view = 'tour'; } break;
    case 'play': playTour(+v); break;
    case 'tplay': {   // живой бой: игрок слева; если встретились два игрока — оба живые
      const R = S.trun, m = R && tMine(R); if (!m) return;
      const L = isHum(R, m.a) ? m.a : m.b, Rr = L === m.a ? m.b : m.a;
      startFightAB(`${stageName(R.stage)} · бой ${m.g.length + 1} · Bo${m.bo}`, tFighter(R, L), tFighter(R, Rr), won => { tGame(m, won || R.intro ? L : Rr); tRun(R, false); S.view = 'trun'; });
      break;
    }
    case 'tinvade': { const h = +v, a2 = S.tourInvade = S.tourInvade || []; const at = a2.indexOf(h); if (at >= 0) a2.splice(at, 1); else a2.push(h); break; }
    case 'tinv': { const h = +v, a2 = S.tourInv = S.tourInv || []; const at = a2.indexOf(h); if (at >= 0) a2.splice(at, 1); else if (S.actions >= 1 && G.players[h].region === S.region) a2.push(h); break; }
    case 'tauto': if (S.trun) tRun(S.trun, true); break;
    case 'tfinish': finishTour(); S.ttab = null; break;
    case 'ttab': S.ttab = v; return render();
    case 'fspeed': if (F) { F.speed = +v; fightPaint(); } return;
    case 'fspc': if (F) { F.speed = (F.speed || 1) === 1 ? 3 : 1; fightPaint(); } return;
    case 'flogall': if (F) { F.logFull = !F.logFull; render(); } return;
    case 'flast': { const lg = document.getElementById('flog'); if (lg) { lg.scrollTop = lg.scrollHeight; document.getElementById('flast').hidden = true; } return; }
    case 'fskip': if (F) { finishFight(); fightPaint(); } return;
    case 'fback': if (F) { if (F.done) return act('fend'); finishFight(); fightPaint(); } return;
    case 'fabil': {   // нажатие на квадрат с иконкой: способность этого бойца, если готова
      if (!F || F.done) return;
      const x = v === 'fa' ? F.a : F.b, y = v === 'fa' ? F.b : F.a;
      if (x.rest <= 0 && x.acd <= 0 && x.qi >= x.qiMax * FIGHT.abilPct) { useAbility(x, y); fightPaint(); }
      return;
    }
    case 'fitem': { const [id, k] = v.split(':'); useFItem(id, k); return; }
    case 'fend': { if (!F || !F.done) return; const cb = F.onEnd, won = F.won; useGame(F.a); useGame(F.b); F = null; cb(won); break; }
    case 'bureau': if (freeBureau(S)) S.view = 'bureau'; else if (spend()) { clearJet(); S.view = 'bureau'; } break;   // своё жильё: бюро рядом, действие не тратится
    case 'toBureau': S.view = 'bureau'; break;
    case 'inv': S.view = 'inv'; S.renaming = null; break;
    case 'irename': S.renaming = +v; break;
    case 'irencancel': S.renaming = null; break;
    case 'iren': { const i = +v, el = document.getElementById('iname'), t = el ? el.value.trim() : ''; S.iname = S.iname || {}; if (t) S.iname[i] = t; else delete S.iname[i]; S.renaming = null; break; }
    case 'rbuy': { const j = +v; S.rooms = S.rooms || []; if (S.rooms.includes(j) || (S.coins || 0) < ROOMS[j].cost) return; S.coins -= ROOMS[j].cost; S.rooms.push(j); S.room = j; S.roomPic = 0; logMsg('Куплено жильё: ' + ROOMS[j].n + '.'); break; }
    case 'room': S.inRoom = !S.inRoom; break;
    case 'rpic': S.roomPic = ((S.roomPic | 0) + 1) % 4; break;
    case 'rsel': S.room = +v; S.roomPic = 0; break;
    case 'cbuy': { const j = +v; S.cars = S.cars || []; if (S.cars.includes(j) || (S.coins || 0) < CARS[j].cost) return; S.coins -= CARS[j].cost; S.cars.push(j);
      if (garageOf(S) == null) { S.garage = j; S.actions += CARS[j].a; S.weekMax = maxActs(S); }   // пустой гараж — бонус сразу
      S.roomPic = 2; logMsg(`Куплено: ${CARS[j].n}.${S.garage === j ? ' Стоит в гараже.' : ' Поставить в гараж можно в комнате.'}`); break; }
    case 'gsel': { const j = +v; if (!(S.cars || []).includes(j) || S.garage === j) return; S.garage = j; logMsg(`В гараже теперь ${CARS[j].n}.`); break; }
    case 'shop': S.view = 'shop'; break;
    case 'consbuy': { const c = CONS.find(x => x.k === v); if (!c || (S.coins || 0) < c.cost || consOf(S, c.k) >= CONS_MAX) return; S.coins -= c.cost; S.cons = S.cons || {}; S.cons[c.k] = (S.cons[c.k] || 0) + 1; logMsg('Куплено: ' + c.n + '.'); break; }
    case 'dbuy': { if (S.dirty || (S.coins || 0) < DIRTY.cost) return; S.coins -= DIRTY.cost; S.dirty = true; logMsg('Куплено: ' + DIRTY.n + '. Вторжения на турниры — без последствий.'); break; }
    case 'ibuy': {
      const i = +v, it = ITEMS[i]; S.items = S.items || [];
      if (S.items.includes(i) || (S.coins || 0) < it.cost) return;
      S.coins -= it.cost; S.items.push(i); logMsg('Открыт артефакт: ' + itemName(S, i) + '.'); break;
    }
    case 'iequip': { const i = +v; S.equip = S.equip === i ? null : i; break; }
    case 'wcview': S.view = 'wc'; break;
    case 'weeks': S.view = 'weeks'; break;
    case 'more': S.view = 'more'; break;
    case 'hdrfull': S.hdrFull = !S.hdrFull; break;
    case 'orient': toggleOrient(); return;
    case 'wfview': S.view = 'wf'; break;
    case 'teams': S.treg = +v; S.tsel = null; S.view = 'teams'; break;
    case 'tsel': S.tsel = v || null; break;
    case 'dossier': S.dreg = +v; S.dsel = null; S.view = 'dossier'; break;
    case 'dsel': S.dsel = +v < 0 ? null : +v; break;
    case 'esl': if (S.power >= ESL_MIN_POWER && S.actions > 0) { eslNew(); S.view = 'esl'; } break;
    case 'eslsize': S.esl.size = +v; break;
    case 'eslpick': { const a2 = S.esl.pick, at = a2.indexOf(v); if (at >= 0) a2.splice(at, 1); else if (eslCount() < S.esl.size) a2.push(v); break; }
    case 'eslinv': { const h = +v, a2 = S.esl.inv, at = a2.indexOf(h); if (at >= 0) a2.splice(at, 1); else if (eslCount() < S.esl.size) a2.push(h); break; }
    case 'eslfill': eslFill(); break;
    case 'eslclear': S.esl.gen = []; break;
    case 'eslgo': eslStart(); break;
    case 'fight': bureauFight(v); break;
    case 'flight': if (S.actions > 0) S.view = 'flight'; break;
    case 'fly': if (spend()) { S.region = +v; S.jetlag = hasRoom(S, 4) ? 0 : 1; logMsg('Перелёт в ' + REGIONS[S.region].name + (S.jetlag ? '. Джетлаг до конца хода.' : '. Свой остров — без джетлага.')); S.view = 'main'; } break;
    case 'pass': clearJet(); logMsg('Неделя пропущена.'); endTurn(); break;
    case 'next': endTurn(); break;
    default: return;
  }
  save();
  render();
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-a]');
  if (!t || t.disabled || t.dataset.a === 'noop') return;
  act(t.dataset.a, t.dataset.v);
});
window.addEventListener('error', e => { app.insertAdjacentHTML('afterbegin', '<pre style="color:#FF5A5A;white-space:pre-wrap;font-size:12px">Ошибка: ' + esc(e.message) + ' (' + (e.lineno || '?') + ')</pre>'); });
G = null; S = null;
render();

// установка как приложения (Chrome: «Установить приложение»)
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
</script></body></html>
