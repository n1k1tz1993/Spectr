<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B1020">
<title>Спектр · пошаговый бой</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@1,800;1,900&family=Noto+Sans:wght@400;500;600;700;800&display=swap">
<!-- стили боя взяты из index.html (блок <style> игры), ниже — стили прототипа -->
<style>
:root{--bg:#0B1020;--panel:#151E32;--nest:#202B43;--line:#2A3858;--txt:#F2F5FA;--dim:#B6C1D2;--cyan:#32D5E7;--gold:#F5C84C;--good:#65D979;--bad:#FF8B7B;--nt:#B6C1D2}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font-family:'Noto Sans',Rubik,system-ui,-apple-system,sans-serif;font-size:16px;line-height:1.4;min-height:100vh}
#app{max-width:520px;margin:0 auto;padding:12px 16px 40px}
.dim{color:var(--dim);font-size:14px}
/* ориентация: кнопка поворота и альбомная раскладка (две колонки, бой — поле слева, журнал справа) */
#orient{position:fixed;right:10px;bottom:10px;z-index:50;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:rgba(20,26,44,.9);color:var(--gold);font-size:22px;line-height:1;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.5)}
html.land #app{max-width:1240px;column-count:2;column-gap:16px;padding-top:4px}
html.land #app>*{break-inside:avoid}
html.land #app>.card,html.land #app>.btn{display:block}
html.land #app>.card:first-child,html.land #app>.hdr{column-span:all}
html.land #app[data-view=fight],html.land #app[data-view=setup],html.land #app[data-view=menu]{column-count:1}
html.land #app[data-view=menu],html.land #app[data-view=setup]{max-width:760px}
html.land .ffwrap{max-width:1240px;display:flex;gap:16px;align-items:flex-start}
html.land .ffbox{flex:0 0 auto;width:min(58vw,calc(100vh - 16px))}
html.land .ffbot{flex:1;min-width:0;padding-top:8px}
html.rot{overflow:hidden}
html.rot body{overflow:hidden}
html.rot #stage{position:fixed;top:0;left:100vw;width:100vh;height:100vw;transform:rotate(90deg);transform-origin:top left;overflow:auto;background:var(--bg)}
html.rot #orient{right:auto;left:10px;bottom:10px;transform:rotate(90deg)}
.top{position:relative;display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px 10px;overflow:hidden}
.top .ava{width:40px;height:40px}
.topid{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;background:none;border:0;padding:0;color:var(--txt);font-family:inherit;text-align:left;cursor:pointer}
.topid .nick{font-size:16px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.topid .dim{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.top .rate{margin-left:0;flex:0 0 auto}
.top .lg{font-size:11px}
.topor{flex:0 0 auto;width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--nest);color:var(--cyan);font-size:20px;cursor:pointer}
.top{flex-wrap:wrap}
.tgrow{flex:0 0 100%;display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted,#8A93AD);margin-top:2px}
.tgrow span{white-space:nowrap}
.tgrow b{font-size:11px;color:var(--cyan);min-width:30px;text-align:right}
.tgrow .tbar{flex:1;height:6px;border-radius:3px;background:#0A0F1E;overflow:hidden}
.tgrow .tbar i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,#2C7BE5,var(--cyan))}
.tgrow.done .tbar i{background:linear-gradient(90deg,#C9962C,var(--gold))}
.tgrow.done b{color:var(--gold)}
.stat{display:flex;gap:4px;justify-content:flex-end;margin-top:2px}
.sti{width:18px;height:18px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:#1A2238;color:#3A4560;font-style:normal}
.sti svg{width:12px;height:12px}
.sti.on.g{background:rgba(46,204,113,.18);color:#2ECC71;box-shadow:0 0 0 1px #2ECC71}
.sti.on.r{background:rgba(255,77,79,.18);color:#FF4D4F;box-shadow:0 0 0 1px #FF4D4F}
.evtph{position:relative;width:100%;aspect-ratio:4/3;border-radius:12px;background:repeating-linear-gradient(45deg,#141B2E 0 12px,#18203A 12px 24px);border:1px dashed #2A3350;display:flex;align-items:center;justify-content:center;overflow:hidden}
.evtph span{color:#5A6585;font-weight:700;padding:12px;text-align:center}
.evtph img.big{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;max-width:none;border-radius:0}
html.land .evtph img.big{width:100%;height:100%;max-height:none}
.sub{display:flex;align-items:center;gap:10px;margin-top:12px}
.sub h1{margin:0;font-size:22px;font-weight:700;line-height:1.2}
.subback{width:44px;height:44px;flex:0 0 auto;border-radius:12px;border:1px solid var(--line);background:var(--nest);color:var(--txt);font-size:20px;cursor:pointer}
.news>div:nth-child(2){margin-top:4px;line-height:1.4}
.wk{padding:8px 0;border-bottom:1px solid var(--line);line-height:1.4}
.wk:last-child{border-bottom:0}
html.ingame #orient{display:none}
html.land #app>.hdr{column-span:all}
.ava{width:44px;height:44px;border-radius:10px;background:radial-gradient(circle at 50% 38%,#5A6E99 0%,#34446A 45%,#1A2340 100%);overflow:hidden;flex:0 0 auto;border:1px solid var(--line)}
.ava img,.faceone img,.dosimg img,.ff-face img,.fzp>img{filter:drop-shadow(0 0 1.5px rgba(200,225,255,.55))}
.ava img{width:100%;height:100%;object-fit:cover;object-position:center 15%;display:block}
.faceone{padding:0;border:2px solid var(--gold);border-radius:12px;background:radial-gradient(circle at 50% 38%,#5A6E99 0%,#34446A 45%,#1A2340 100%);cursor:pointer;width:140px;height:140px;overflow:hidden;display:block}
.faceone img{width:100%;height:100%;object-fit:cover;display:block}
.nick{font-weight:700}
.rate{margin-left:auto;text-align:right}
.rate b{font-size:20px}
.lg{font-size:12px;font-weight:700}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:16px}
h2{font-size:18px;margin:4px 0 8px}
h3{font-size:16px;margin:12px 0 6px}
.btn{display:block;width:100%;min-height:48px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--nest);color:var(--txt);font-size:16px;margin-top:8px;cursor:pointer;text-align:left;font-family:inherit}
.btn:disabled{opacity:.4;cursor:default}
.btn.gold{background:var(--gold);color:#111;border-color:var(--gold);font-weight:700;text-align:center}
.btn.here{border-color:var(--gold)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.sq{width:120px;height:120px;background:#fff;color:#111;border-radius:10px;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px;font-weight:700;font-size:14px;cursor:pointer;flex:0 0 auto}
.sq.big{width:160px;height:160px;font-size:17px}
.sq.used{opacity:.3}
.bonus{font-weight:700;margin-top:10px;font-size:15px}
.plus{color:var(--good)}.minus{color:var(--bad)}.rand{color:var(--gold)}.nt{color:var(--nt)}
.dim{color:var(--dim);font-size:13px}
.log{font-size:14px;line-height:1.45;background:var(--nest);border-radius:10px;padding:10px;margin-top:10px}
.log div{margin-bottom:4px}
.trophy{display:inline-block;margin:4px 4px 0 0;padding:6px 8px;border:1px solid var(--gold);border-radius:8px;color:var(--gold);font-size:12px}
.tile{display:flex;justify-content:space-between;align-items:center}
input,select{width:100%;padding:11px;border-radius:10px;border:1px solid var(--line);background:#0B0F1C;color:var(--txt);font-size:16px;font-family:inherit}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl td{padding:6px 4px;border-bottom:1px solid var(--line)}
.week{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:10px}
.week>div:first-child{flex:1;min-width:0}
.week .nextwk{flex:0 0 100%;margin-top:0}
.week .inds{margin-top:8px}
.nextm{text-align:right;font-size:14px}
.loc{display:flex;align-items:center;justify-content:flex-start;gap:8px;margin-top:8px;font-size:14px;text-align:left}
.mapsw{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:10px}
.mapsw .nvb{all:unset;cursor:pointer;display:block;line-height:0;width:calc(50% - 9px);transition:transform .12s,filter .15s;filter:brightness(.8) saturate(.9)}
.mapsw .nvb img{width:100%;height:auto;display:block;aspect-ratio:720/162;object-fit:fill}   /* обе плашки одной высоты: «Карта» чуть сплюснута до высоты «Комнаты» */.mapsw .nvb.on{filter:drop-shadow(0 0 6px rgba(255,200,90,.65)) brightness(1.08)}.mapsw .nvb:active{transform:scale(.97)}
.mapsw .nvsep{flex:0 0 2px;align-self:stretch;margin:6px 0;background:linear-gradient(transparent,#C9A24A,transparent);border-radius:2px}
.imgbtn .ibfree{position:absolute;right:12%;top:-4px;line-height:1;font-size:11px;font-weight:700;padding:3px 7px;border-radius:8px;background:#2ECC71;color:#062;z-index:1}
.loc img{width:30px;height:30px;border-radius:6px;object-fit:contain;background:#000;flex:0 0 auto}
.week h2{margin:0}
.inds{display:flex;gap:2px}
.ind{width:44px;height:18px;display:inline-block;background:url(img/nav/act_on.webp) center/contain no-repeat}
.ind.off{background-image:url(img/nav/act_off.webp)}
.mapph{height:180px;background:#fff;color:#111;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:700;margin-bottom:8px}
.arow{display:flex;gap:12px;align-items:stretch;background:var(--nest);border-radius:12px;padding:8px;margin-top:8px;cursor:pointer}
.pic{width:84px;height:116px;background:#fff;color:#111;border-radius:8px;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:700;font-size:12px;padding:4px;flex:0 0 84px}
.arow .tx{flex:1;min-width:0}
.ttl{font-weight:700;font-size:15px}
.ds{font-size:13px;color:var(--dim);margin-top:4px}
.map{position:relative;container-type:inline-size;border-radius:10px;overflow:hidden;line-height:0;aspect-ratio:16/9}   /* как у комнаты: блок не прыгает при переключении */
.mapin{position:absolute;inset:0}
.map img{width:100%;display:block}
.mbox{position:absolute;display:flex;align-items:center;gap:1.4cqw;padding:0 1.6cqw;box-sizing:border-box;color:#BFF6FF;line-height:1.05;cursor:pointer}
.mbox img{width:7.6cqw;height:7.6cqw;border-radius:1cqw;object-fit:contain;flex:0 0 auto}
.mbox span{display:flex;flex-direction:column;min-width:0}
.mbox b{font-size:2.9cqw;font-weight:800;line-height:1.05}.mbox b.long{font-size:2.2cqw}
.mbox i{font-style:normal;font-size:1.9cqw;color:#7FBFD0;margin-top:.4cqw}
.mbox.cur b{color:var(--gold);text-shadow:0 0 6px rgba(245,197,66,.7)}
.mpin{position:absolute;width:7cqw;height:7cqw;transform:translate(-50%,-50%);border-radius:50%;cursor:pointer}
.ovl{position:fixed;inset:0;background:rgba(0,0,0,.78);display:flex;align-items:center;justify-content:center;padding:12px;z-index:10}
.lwrap{width:min(100%,calc((100vh - 90px)*2/3))}
.lpanel{position:relative;width:100%;aspect-ratio:2/3;background-size:100% 100%;container-type:inline-size}
.lrow{position:absolute;display:flex;align-items:center;padding:0 4cqw;color:#E8ECF8;font-size:3.4cqw;line-height:1.1;overflow:hidden}
.lpedimg{position:absolute;transform:translate(-50%,-100%);width:auto;max-width:20%;object-fit:contain;filter:drop-shadow(0 6px 8px rgba(0,0,0,.7))}
.lped{position:absolute;transform:translate(-50%,-100%);color:var(--gold);font-weight:700;font-size:3cqw;text-align:center;white-space:nowrap;text-shadow:0 0 6px rgba(0,0,0,.9)}
.lclose{position:absolute;top:0;right:0;width:15%;height:10%;background:transparent;border:0;cursor:pointer}
img.pic{object-fit:cover;padding:0;background:#fff}
.bigpic{display:block;width:200px;height:276px;object-fit:cover;border-radius:10px;margin:0 auto}
.bigpic.tall{width:220px;height:auto}
.beastmark{display:inline-flex;vertical-align:middle;margin-left:6px}
.beastmark .aic{width:26px;height:26px;border-radius:6px}
.ttag{width:18px;height:18px;object-fit:contain;vertical-align:middle;margin-right:4px}
.semipick{display:flex;align-items:center;gap:8px;margin-top:8px;padding:6px 8px;border:1px solid var(--gold);border-radius:10px}
.semipick .ttag{width:40px;height:40px}
.ctteams{display:flex;justify-content:center;gap:8px;margin-bottom:6px}
.ctteams img{width:56px;height:56px;border-radius:10px;opacity:.55}
.ctteams img.my{opacity:1;outline:2px solid var(--gold)}
.scene{display:block;width:100%;border-radius:10px;margin-bottom:4px}
.tierbtn{position:relative;display:block;width:100%;padding:0;border:0;background:none;border-radius:10px;overflow:hidden;cursor:pointer;margin-top:8px}
.tierbtn:first-child{margin-top:0}
.tierbtn img{display:block;width:100%}
.tierbtn.locked{cursor:default}
.tierbtn.locked img{filter:grayscale(1) brightness(.45)}
.tierbtn .tag{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.75);color:var(--txt);font-size:12px;font-weight:700;padding:4px 8px;border-radius:6px}
.tierbtn .tag.gold{color:var(--gold)}
.frow{display:flex;align-items:flex-start;gap:8px}
.fbox{flex:1;position:relative;text-align:center;min-width:0}
.face{width:100%;aspect-ratio:1;background:#fff;color:#111;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:700;margin-bottom:6px}
.fname{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vs{align-self:center;font-weight:700;color:var(--gold);padding-top:20px}
.bar{height:10px;border-radius:5px;background:#0B0F1C;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;transition:width .1s linear}
.bar.hp i{background:linear-gradient(90deg,#FF5A5A,#FF8A5A)}
.bar.qi i{background:linear-gradient(90deg,#2FD7FF,#3A7BFF)}
.frest{font-size:12px;color:var(--gold);min-height:16px;margin-top:4px}
.fx{position:absolute;left:0;right:0;top:30%;font-size:22px;font-weight:800;text-shadow:0 2px 6px #000;opacity:0;pointer-events:none}
.fx.go{animation:fxup .8s ease-out forwards}
@keyframes fxup{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-30px)}}
.flog{font-size:13px;line-height:1.5;background:var(--nest);border-radius:10px;padding:8px 10px;margin-top:10px;min-height:100px}
.aic{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:7px;font-size:16px;color:#fff;flex:0 0 auto}
.iconpick{padding:3px;border:2px solid transparent;border-radius:10px;background:none;cursor:pointer}
.iconpick .aic{width:40px;height:40px;font-size:22px}
.iconpick.on{border-color:var(--gold)}
textarea{width:100%;padding:11px;border-radius:10px;border:1px solid var(--line);background:#0B0F1C;color:var(--txt);font-size:15px;font-family:inherit;resize:vertical}
.abil{display:flex;align-items:center;justify-content:center;gap:6px;font-size:12px;margin-top:6px;min-width:0}
.abil span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.abil .aic{width:22px;height:22px;font-size:13px}
.fx{font-size:18px}
.acd{font-size:11px;color:var(--dim);min-height:14px}
.abil.cd .aic{filter:grayscale(1) brightness(.6)}
.ff{min-height:100vh;display:flex;justify-content:center;align-items:flex-start;background:#04070F}
.ffwrap{width:100%;max-width:520px}
.ffbox{position:relative;width:100%;aspect-ratio:908/906;background:url(img/fight_bg.webp) top center/100% auto no-repeat;container-type:inline-size;font-size:3.6cqw}
.ffbot{container-type:inline-size;padding:0 1.5% 16px;display:flex;flex-direction:column;gap:8px;background:#04070F}
.ffbox>*{position:absolute}
.ff-back{background:transparent;border:0;cursor:pointer}
.ff-face{background:radial-gradient(circle at 50% 38%,#5A6E99 0%,#34446A 45%,#1A2340 100%);overflow:hidden;clip-path:polygon(5% 0,95% 0,100% 5%,100% 100%,0 100%,0 5%)}
.ff-face img{width:100%;height:100%;object-fit:cover;object-position:center top;display:block}
.ff-plate{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:.6cqw}
.ff-plate b{font-size:4.2cqw;line-height:1.1;max-width:95%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ff-plate span{color:var(--dim);font-size:3.2cqw}
.ff-plate em{font-style:normal;color:var(--gold);font-size:3cqw;min-height:3.6cqw}
.ff-bar{border-radius:3cqw;overflow:hidden}
.ff-bar i{display:block;height:100%;transition:width .1s linear;border-radius:3cqw}
.ff-bar.hp i{background:linear-gradient(90deg,#FF4D5E,#FF8A5A)}
.ff-bar.qi i{background:linear-gradient(90deg,#2FD7FF,#3A7BFF)}
.ff-icon{background:transparent;border:0;padding:0;display:flex;align-items:center;justify-content:center;cursor:pointer}
.ff-icon .aic{width:78%;height:78%;font-size:8cqw;border-radius:1.6cqw}
.ff-icon.cd .aic{filter:grayscale(1) brightness(.55)}
.ff-name{display:flex;flex-direction:column;justify-content:center;padding-left:1.5cqw;gap:.8cqw;min-width:0}
.ff-name b{font-size:3.6cqw;line-height:1.15;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.ff-name span{font-size:2.9cqw;color:var(--dim)}
.ff-title{display:flex;align-items:center;justify-content:center;text-align:center;font-weight:700;font-size:3.6cqw;padding:0 3cqw;line-height:1.1}
.ff-log{display:flex;flex-direction:column;gap:2cqw}
.ff-log .flog{flex:1;margin:0;background:transparent;font-size:3.4cqw;min-height:0;overflow:hidden;padding:1cqw 2cqw}
.ff-ctl{display:flex;gap:2cqw}
.ff-ctl .btn{margin:0;text-align:center;padding:2.2cqw;font-size:3.6cqw}
#fend .btn{margin-top:2cqw;text-align:center}
.ff-fx{display:flex;align-items:center;justify-content:center;text-align:center;font-size:6cqw;font-weight:800;text-shadow:0 2px 6px #000;opacity:0;pointer-events:none;padding:0 2cqw}
.ff-fx2{align-items:flex-end;padding-bottom:4cqw;font-size:4.6cqw}
.ff-fx.go{animation:fxup .9s ease-out forwards}
.ff-fx.qi{color:#2FD7FF}
.rt{display:inline-flex;align-items:center;gap:.3em;font-family:'Exo 2',Rubik,sans-serif;font-style:italic;font-weight:900;line-height:1;letter-spacing:.02em}
.rt img{height:1.5em;width:auto;filter:drop-shadow(0 0 4px rgba(0,0,0,.6))}
.rt b{font-weight:900;background:linear-gradient(180deg,#FFFFFF 0%,#FFE7A3 55%,#F5C542 100%);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 2px 10px rgba(245,197,66,.25);padding-right:.12em}
.rt.big{font-size:28px}
.rt.mid{font-size:22px}
.rt.rf{font-size:4.2cqw}
.rt.rf img{height:1.25em}
.rate{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.rate .lg{font-family:'Exo 2',Rubik,sans-serif;font-style:italic;font-weight:800;letter-spacing:.06em;text-transform:uppercase;font-size:11px}
img.aic{object-fit:cover;background:#0B0F1C;display:block}
.iconsgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;max-height:330px;overflow-y:auto;padding-right:2px}
.iconsgrid .iconpick{padding:2px;width:100%}
.iconsgrid .iconpick .aic{width:100%;height:auto;aspect-ratio:1}
.gold{color:var(--gold)}
.ser{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;padding:7px 4px;border-bottom:1px solid var(--line);font-size:14px}
.ser span{color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ser span:last-child{text-align:right}
.ser span.win{color:var(--txt);font-weight:700}

/* ===== бой по макету (книжный и альбомный) ===== */
.fy{--cA:#32C8F0;--cB:#F0605A;max-width:520px;margin:4px auto 0;display:flex;flex-direction:column;gap:12px}

.fyp .ff-fx.plus{color:#7BF07F;border-color:#3FCF5A}.fyp .ff-fx.qi{color:#5FE7FF}.fyp .ff-fx.rand{color:var(--gold);border-color:var(--gold)}

.fyteam{display:flex;align-items:center;justify-content:center;gap:6px;padding:5px 10px;border-radius:10px;border:1.5px solid var(--gold);background:linear-gradient(180deg,rgba(245,200,76,.08),rgba(0,0,0,.3));min-height:36px;min-width:0}

.fya em.act{border-color:var(--gold);color:var(--gold)}

.fyabs{display:flex;flex-direction:column;gap:10px}

.pr-mh small{display:block;color:var(--dim);font-size:12px}.pr-mh b{font-family:'Exo 2',Rubik,sans-serif;font-style:italic;font-weight:900;font-size:20px;color:#FFE7A3;letter-spacing:.02em}
.pr-mini{flex:1;min-width:0;display:grid;gap:4px;font-size:11px}.pr-mini div{display:grid;grid-template-columns:52px 1fr;gap:1px 6px;align-items:center}
.pr-mini span{grid-row:span 2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}.pr-mini .a span{color:#9FE4FF}.pr-mini .b span{color:#FFB8B0}
.pr-mini i{display:block;height:5px;border-radius:3px;background:#1A2540;overflow:hidden}.pr-mini u{display:block;height:100%}.pr-mini .h u{background:#5BDB6A}.pr-mini .q u{background:#3FCBF2}
.pr-mini em{display:none}
.pr-autob{all:unset;cursor:pointer;display:block;margin:8px 12px 2px;padding:8px;text-align:center;border-radius:10px;border:1px solid rgba(50,200,240,.6);background:#10223A;color:#9FE4FF;font-weight:700;font-size:14px}.pr-autob small{font-weight:400;color:var(--dim)}
.pr-tog{all:unset;cursor:pointer;font-size:13px;color:var(--gold);padding:6px 10px;border:1px solid rgba(233,196,106,.5);border-radius:10px}
.pr-mb{overflow:auto;padding:4px 12px 16px}
.pr-menu.min .pr-mb{display:none}
.pr-mb h4{margin:12px 0 6px;font-size:12.5px;text-transform:uppercase;letter-spacing:.08em;color:#E9C46A}.pr-mb h4 small{text-transform:none;letter-spacing:0;color:var(--dim);font-weight:400}
.pr-seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pr-seg button{all:unset;cursor:pointer;text-align:center;padding:8px 4px;border-radius:10px;border:1px solid var(--line);background:#1A2540;font-size:13px;font-weight:700}
.pr-seg button small{display:block;font-weight:400;color:var(--dim);font-size:11px}.pr-seg button.on{border-color:var(--gold);background:#2E2A18}
.pr-acts{display:grid;gap:6px}
.pr-act{all:unset;cursor:pointer;display:grid;grid-template-columns:46px 1fr auto;gap:10px;align-items:center;padding:8px 10px;border-radius:12px;border:1px solid var(--line);background:#1A2540}
.pr-act:active{transform:scale(.98)}
.pr-ic{width:46px;height:46px;border-radius:10px;overflow:hidden;display:grid;place-items:center;background:#0E1730}.pr-ic img{width:100%;height:100%}.pr-emo{font-size:26px}
.pr-tx b{display:block;font-size:15px}.pr-tx small{display:block;color:var(--dim);font-size:12px;line-height:1.3}.pr-tx em{display:block;font-style:normal;font-size:12px;color:#FFB3A8;margin-top:2px}
.pr-cost{text-align:right;font-size:11px;color:var(--dim);white-space:nowrap}.pr-cost b{display:block;font-size:16px;color:#5FE7FF}
.pr-act.dis{opacity:.35;cursor:default}.pr-act.ult{border-color:#A0702A;background:linear-gradient(90deg,#2E2412,#1A2540)}
.pr-itl{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pr-it{all:unset;cursor:pointer;display:grid;grid-template-columns:40px 1fr;gap:8px;align-items:center;padding:6px;border-radius:10px;border:1px solid rgba(233,196,106,.55);background:#141F38}
.pr-it img{width:40px;height:40px;border-radius:6px}.pr-it b{display:block;font-size:12.5px;line-height:1.2}.pr-it small{display:block;font-size:11px;color:var(--dim);line-height:1.25}
.pr-it.off{opacity:.35;cursor:default;border-color:#444}
.fwin{z-index:95}
</style>

<body>
<div id="app"></div>
<script>
'use strict';
// ===================== ПРАВИЛА (все цифры здесь — удобно подкручивать) =====================
const R = {
  hp: p => Math.round(1300 * Math.exp(0.008 * (p - 50))),   // запас HP от силы
  hit: p => 40 * Math.exp(0.008 * (p - 50)),                // урон одного удара серии от силы
  series: 5, miss: 0.10, crit: 0.12, critK: 1.6, spread: 0.15,
  abilHits: 4.2,          // способность ≈ 4.2 удара (≈13%)
  ultHits: 12,            // разрушительная ≈ 12 ударов (≈37%)
  qiStart: 50, qiTurn: 10, qiMax: 100,
  qiSeries: 5, qiAbil: 25, qiUlt: 70, qiDef: 20, qiConc: 40, qiCritDodge: 5,
  defBlock: 0.60,          // Защита: блок 60% следующего хода соперника
  concTaken: 1.15,         // Концентрация: в этот круг получаешь +15%
  exhaustTaken: 1.20, exhaustQi: 20,
  stance: { bal: { d: 1, t: 1 }, rage: { d: 1.3, t: 1.3 }, def: { d: 0.75, t: 0.75 } },
  it: { stim: 0.12, gren: 0.08, batt: 25, rage: 0.27, rageIn: 0.18, ins: 0.15, vamp: 0.36, smoke: 0.55, crit: 0.75 },   // сила расходников
  fatigueFrom: 8, fatigue: 0.05, init: 40,
  e: { stun: 0.4, drain: 25, drainSelf: 10, wound: 0.03, heal: 0.075, barrier: 0.09, mark: 1.35, weak: 0.70, reflect: 0.4, pierce: 1.3, seal: 2 },   // сила эффектов
};
const STANCES = [['bal', '⚖', 'Баланс', '100% / 100%'], ['rage', '🔥', 'Ярость', '+30% / +30%'], ['def', '🛡', 'Защитная', '−25% / −25%']];
const EFFECTS = [
  ['stun', 'Оглушение', '40% шанс, что соперник пропустит следующий ход'],
  ['pierce', 'Пробой', 'Игнорирует Защиту и Защитную стойку, урон +30%'],
  ['drain', 'Иссушение', '−25 Цы у соперника, +10 Цы себе'],
  ['wound', 'Рана', 'Соперник 3 хода теряет по 3% HP'],
  ['heal', 'Восстановление', 'Лечит 7.5% HP'],
  ['barrier', 'Барьер', 'Щит 9% HP до конца хода соперника'],
  ['mark', 'Метка', 'Соперник 2 хода получает +35% урона'],
  ['weak', 'Ослабление', 'Соперник 2 хода наносит −30% урона'],
  ['reflect', 'Отражение', '40% урона следующей атаки соперника возвращается ему'],
  ['seal', 'Печать', 'Соперник 2 хода не может применять способности и разрушительную'],
];
const ITEMS = [
  ['ins', 'Инсайдерские данные', 'Следующее действие: удары не промахиваются и +15% урона'],
  ['stim', 'Стимулятор', 'Лечит 12% HP'],
  ['smoke', 'Дымовая шашка', 'Следующий ход соперника: каждый удар промахивается с шансом +55%'],
  ['gren', 'Граната «Разлом»', 'Мгновенно наносит 8% HP соперника'],
  ['batt', 'Рудная батарея', '+25 Цы'],
  ['rage', 'Сыворотка «Ярость»', 'До твоего следующего хода: наносишь +27%, получаешь +18%'],
  ['vamp', 'Кровавый кристалл', 'Этот ход: лечишь 36% нанесённого урона'],
  ['crit', 'Линза фокуса', 'Этот ход: шанс крита 75%'],
];
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// ===================== СОСТОЯНИЕ =====================
let CFG = {
  me: { name: 'N1K', country: 'RU', face: 5, p: 70, abName: 'Песчаный шторм', abIcon: 12, eff: 'mark', ultName: 'Разрыв реальности', ultIcon: 40, items: ITEMS.map(i => i[0]) },
  op: { name: 'Fak3r', country: 'KR', face: 23, p: 76, eff: 'stun', skill: 0.8, items: ['stim', 'gren', 'batt'] },
};
let B = null, VIEW = 'setup', BUSY = false, SEL = null;

function mkF(c, me) {
  const hp = R.hp(c.p);
  return { me, name: c.name, country: c.country, rating: Math.round(c.p * 30), face: c.face, p: c.p, hpMax: hp, hp, qi: R.qiStart, stance: 'bal', stCd: rnd(1, 2),
    eff: c.eff, abName: c.abName || EFFECTS.find(e => e[0] === c.eff)[1], abIcon: c.abIcon ?? 7, ultName: c.ultName || 'Разрушительный удар', ultIcon: c.ultIcon ?? 33,
    skill: c.skill ?? 0.7, items: [...(c.items || [])], used: {}, ultUsed: false, turns: 0,
    st: {}, defend: false, conc: false, exhausted: false, itemTurn: false, tmp: {} };
}
function newBattle(sim) {
  const a = mkF(CFG.me, true), b = mkF(CFG.op, false);
  if (sim) { a.me = false; a.skill = 0.7; }
  const sa = a.p + Math.random() * R.init, sb = b.p + Math.random() * R.init;   // кто ходит первым: сила + случай
  return { a, b, cur: sa >= sb ? 'a' : 'b', round: 0, log: [], done: false, win: null, sim: !!sim };
}
const opp = (B, x) => x === B.a ? B.b : B.a;
const nameCls = (B, x) => x === B.a ? 'a' : 'b';

// ===================== МЕХАНИКА =====================
function log(t, cls = '') { if (!B.sim) B.log.push([t, cls]); }
function fl(x, txt, cls) { if (B.sim) return; const el = document.getElementById('pic-' + nameCls(B, x)); if (!el) return; const d = document.createElement('div'); d.className = 'float ' + cls; d.textContent = txt; el.appendChild(d); setTimeout(() => d.remove(), 1100); }
function dealtMul(x) { let m = R.stance[x.stance].d; if (x.st.weak) m *= R.e.weak; if (x.tmp.rage || x.st.rageItem) m *= 1 + R.it.rage; if (x.tmp.ins) m *= 1 + R.it.ins; return m; }
function takenMul(y, pierce) {
  let m = pierce ? Math.max(1, R.stance[y.stance].t) : R.stance[y.stance].t;
  if (y.st.mark) m *= R.e.mark; if (y.conc) m *= R.concTaken; if (y.exhausted) m *= R.exhaustTaken; if (y.st.rageItem) m *= 1 + R.it.rageIn;
  if (y.defend && !pierce) m *= 1 - R.defBlock;
  return m;
}
function applyDmg(x, y, raw) {   // raw уже с множителями; щит, отражение, вампиризм
  let d = Math.max(1, Math.round(raw));
  if (y.st.barrier > 0) { const ab = Math.min(y.st.barrier, d); y.st.barrier -= ab; d -= ab; if (y.st.barrier <= 0) delete y.st.barrier; if (ab) log(`${y.name}: щит поглотил ${ab}.`, 'dim'); }
  y.hp = Math.max(0, y.hp - d);
  if (x.tmp.vamp && d > 0) { const h = Math.round(d * R.it.vamp); x.hp = Math.min(x.hpMax, x.hp + h); x.tmp.vampSum = (x.tmp.vampSum || 0) + h; }
  return d;
}
function strikes(x, y, n, base, opt = {}) {   // серия ударов / способность / разрушительная
  let total = 0, crits = 0, misses = 0;
  const mul = dealtMul(x) * takenMul(y, opt.pierce) * (opt.k || 1);
  for (let i = 0; i < n; i++) {
    const missP = x.tmp.ins ? 0 : R.miss + (y.st.smoke ? R.it.smoke : 0);
    if (!opt.sure && Math.random() < missP) { misses++; y.qi = Math.min(R.qiMax, y.qi + R.qiCritDodge); continue; }
    let h = base * (1 - R.spread + Math.random() * 2 * R.spread) * mul;
    if (Math.random() < (x.tmp.crit ? R.it.crit : R.crit)) { h *= R.critK; crits++; x.qi = Math.min(R.qiMax, x.qi + R.qiCritDodge); }
    total += applyDmg(x, y, h);
  }
  return { total, crits, misses };
}
function reflectBack(x, y, d) {   // отражение срабатывает на атаку
  if (y.st.reflect && d > 0) { const r = Math.round(d * R.e.reflect); x.hp = Math.max(0, x.hp - r); delete y.st.reflect; log(`Отражение: ${x.name} получает ${r} обратно.`, 'gold'); fl(x, '−' + r, 'dmg'); }
}
function spend(x, q) { x.qi -= q; if (x.qi <= 0) { x.qi = 0; x.exhausted = true; log(`${x.name} истощён: Цы на нуле — следующий ход пропущен.`, 't'); } }

function doAction(x, act) {
  B.await = false;
  const y = opp(B, x), c = nameCls(B, x);
  x.conc = false; x.defend = false;
  if (act === 'series') {
    const r = strikes(x, y, R.series, R.hit(x.p)); x.qi = Math.min(R.qiMax, x.qi + R.qiSeries);
    log(`${x.name}: серия ударов — ${r.total} урона${r.crits ? `, критов: ${r.crits}` : ''}${r.misses ? `, мимо: ${r.misses}` : ''}.`, c); fl(y, '−' + r.total, 'dmg'); reflectBack(x, y, r.total);
  } else if (act === 'abil') {
    spend(x, R.qiAbil);
    const pierce = x.eff === 'pierce', r = strikes(x, y, 1, R.hit(x.p) * R.abilHits, { pierce, k: pierce ? R.e.pierce : 1, sure: true });
    log(`${x.name}: «${x.abName}» — ${r.total} урона.`, c); fl(y, '−' + r.total, 'dmg');
    effect(x, y); reflectBack(x, y, r.total);
  } else if (act === 'ult') {
    x.ultUsed = true; spend(x, R.qiUlt);
    const r = strikes(x, y, 1, R.hit(x.p) * R.ultHits, { sure: true });
    log(`💥 ${x.name}: «${x.ultName}» — ${r.total} урона!`, 't'); fl(y, '−' + r.total, 'dmg'); reflectBack(x, y, r.total);
  } else if (act === 'def') {
    spend(x, R.qiDef); if (x.hp > 0) { x.defend = true; log(`${x.name}: Защита — следующий ход соперника ослаблен на ${Math.round(R.defBlock * 100)}%.`, c); fl(x, 'Защита', 'info'); }
  } else if (act === 'conc') {
    x.conc = true; x.qi = Math.min(R.qiMax, x.qi + R.qiConc); log(`${x.name}: Концентрация Цы (+${R.qiConc}).`, c); fl(x, '+' + R.qiConc + ' Цы', 'info');
  }
  if (x.tmp.vampSum) log(`${x.name}: кристалл вернул ${x.tmp.vampSum} HP.`, 'dim');
  x.tmp = {};
  if (y.st.smoke) delete y.st.smoke;
  endTurn(x);
}
function effect(x, y) {
  const e = x.eff;
  if (e === 'stun') { if (Math.random() < R.e.stun) { y.st.stun = 1; log(`${y.name} оглушён!`, 't'); fl(y, 'Оглушён', 'info'); } else log('Оглушение не сработало.', 'dim'); }
  else if (e === 'drain') { const d = Math.min(R.e.drain, y.qi); y.qi -= d; x.qi = Math.min(R.qiMax, x.qi + R.e.drainSelf); log(`${y.name} теряет ${d} Цы.`, 'dim'); if (y.qi <= 0 && d > 0) { y.exhausted = true; log(`${y.name} истощён!`, 't'); } }
  else if (e === 'wound') { y.st.wound = 3; log(`${y.name} ранен на 3 хода.`, 'dim'); }
  else if (e === 'heal') { const h = Math.round(x.hpMax * R.e.heal); x.hp = Math.min(x.hpMax, x.hp + h); log(`${x.name} восстанавливает ${h} HP.`, 'dim'); fl(x, '+' + h, 'heal'); }
  else if (e === 'barrier') { x.st.barrier = Math.round(x.hpMax * R.e.barrier); log(`${x.name}: щит ${x.st.barrier}.`, 'dim'); }
  else if (e === 'mark') { y.st.mark = 2; log(`${y.name} помечен: +${Math.round((R.e.mark - 1) * 100)}% урона 2 хода.`, 'dim'); }
  else if (e === 'weak') { y.st.weak = 2; log(`${y.name} ослаблен: −${Math.round((1 - R.e.weak) * 100)}% урона 2 хода.`, 'dim'); }
  else if (e === 'reflect') { x.st.reflect = 1; log(`${x.name} готов отразить удар.`, 'dim'); }
  else if (e === 'seal') { y.st.seal = R.e.seal; log(`${y.name} запечатан на ${R.e.seal} хода.`, 'dim'); }
}
function useItem(x, k) {
  if (x.used[k] || x.itemTurn || !x.items.includes(k)) return false;
  const y = opp(B, x); x.used[k] = true; x.itemTurn = true; const it = ITEMS.find(i => i[0] === k);
  if (k === 'stim') { const h = Math.round(x.hpMax * R.it.stim); x.hp = Math.min(x.hpMax, x.hp + h); fl(x, '+' + h, 'heal'); }
  else if (k === 'gren') { const d = applyDmg(x, y, y.hpMax * R.it.gren); fl(y, '−' + d, 'dmg'); }
  else if (k === 'batt') { x.qi = Math.min(R.qiMax, x.qi + R.it.batt); fl(x, '+' + R.it.batt + ' Цы', 'info'); }
  else if (k === 'smoke') x.st.smoke = 1;   // ты в дыму — соперник мажет
  else if (k === 'rage') x.st.rageItem = 1;
  else x.tmp[k] = true;   // ins, vamp, crit — на это действие
  log(`${x.name} применяет «${it[1]}».`, 'gold');
  if (y.hp <= 0) finish(x);
  return true;
}
function startTurn() {
  if (B.done) return;
  const x = B[B.cur], y = opp(B, x);
  x.turns++; x.itemTurn = false; x.defend = false; x.conc = false;
  if (x.st.rageItem) delete x.st.rageItem;
  if (x.turns >= R.fatigueFrom) { const d = Math.round(x.hpMax * R.fatigue); x.hp = Math.max(0, x.hp - d); log(`${x.name}: усталость −${d}.`, 'dim'); if (x.hp <= 0) return finish(y); }
  if (x.st.wound) { const d = Math.round(x.hpMax * R.e.wound); x.hp = Math.max(0, x.hp - d); log(`${x.name}: рана −${d}.`, 'dim'); fl(x, '−' + d, 'dmg'); if (--x.st.wound <= 0) delete x.st.wound; if (x.hp <= 0) return finish(y); }
  for (const k of ['mark', 'weak']) if (x.st[k] && --x.st[k] <= 0) delete x.st[k];
  if (x.st.barrier) delete x.st.barrier;
  if (x.exhausted) { x.qi = Math.min(R.qiMax, x.qi + R.exhaustQi); x.exhausted = false; log(`${x.name} восстанавливается после истощения (+${R.exhaustQi} Цы) и пропускает ход.`, nameCls(B, x)); return endTurn(x, true); }
  if (x.st.stun) { delete x.st.stun; x.qi = Math.min(R.qiMax, x.qi + R.qiTurn); log(`${x.name} оглушён и пропускает ход.`, nameCls(B, x)); return endTurn(x, true); }
  x.qi = Math.min(R.qiMax, x.qi + R.qiTurn);
  if (!x.me || B.fast) { if (B.sim || B.fast) aiTurn(x); else { BUSY = true; render(); setTimeout(() => { BUSY = false; aiTurn(x); }, 900); } }
  else { SEL = null; B.await = true; render(); }   // ждём решения игрока
}
function endTurn(x, skipped) {
  const y = opp(B, x);
  if (y.hp <= 0) return finish(x);
  if (x.hp <= 0) return finish(y);
  if (x.st.seal && --x.st.seal <= 0) delete x.st.seal;   // печать: считается в ходах запечатанного
  B.cur = B.cur === 'a' ? 'b' : 'a'; B.round++;
  if (B.round > 60) return finish(x.hp >= y.hp ? x : y);
  if (B.sim || B.fast) startTurn(); else { render(); setTimeout(startTurn, 450); }
}
function finish(w) { if (B.done) return; B.done = true; B.win = w === B.a ? 'a' : 'b'; log(`Победа: ${w.name}!`, 't'); if (!B.sim) render(); }

// ===================== ИИ =====================
function canAbil(x) { return x.qi >= R.qiAbil && !x.st.seal; }
function canUlt(x) { return !x.ultUsed && !x.st.seal; }
function estUlt(x, y) { return R.hit(x.p) * R.ultHits * dealtMul(x) * takenMul(y); }
function estSeries(x, y) { return R.hit(x.p) * R.series * 0.95 * dealtMul(x) * takenMul(y); }
function aiItems(x, y) {
  const has = k => x.items.includes(k) && !x.used[k];
  if (has('stim') && x.hp < x.hpMax * 0.4) return useItem(x, 'stim');
  if (has('batt') && x.qi < 35) return useItem(x, 'batt');
  if (has('gren') && (y.hp < y.hpMax * 0.12 || Math.random() < 0.25)) return useItem(x, 'gren');
  if (has('smoke') && y.qi >= 70 && !y.ultUsed) return useItem(x, 'smoke');
  if (has('crit') && Math.random() < 0.3) return useItem(x, 'crit');
  if (has('rage') && x.hp > x.hpMax * 0.5 && Math.random() < 0.3) return useItem(x, 'rage');
  if (has('vamp') && x.hp < x.hpMax * 0.7 && Math.random() < 0.4) return useItem(x, 'vamp');
  if (has('ins') && Math.random() < 0.3) return useItem(x, 'ins');
}
function aiTurn(x) {
  if (B.done) return;
  const y = opp(B, x), sk = x.skill, hpR = x.hp / x.hpMax, oR = y.hp / y.hpMax;
  // стойка
  // стойка: бот меняет её случайно раз в 2–3 своих хода — игроку приходится подстраиваться
  if (--x.stCd <= 0) { x.stance = pick(STANCES.map(s => s[0]).filter(k => k !== x.stance)); x.stCd = rnd(2, 3); log(`${x.name} меняет стойку: ${STANCES.find(s => s[0] === x.stance)[2]}.`, 'dim'); }
  aiItems(x, y); if (B.done) return;
  // действие
  const dumb = Math.random() > sk;   // у слабых ботов чаще случайный выбор
  let act;
  if (canUlt(x) && estUlt(x, y) >= y.hp && (x.qi >= R.qiUlt || Math.random() < 0.6 + sk * 0.3)) act = 'ult';
  else if (estSeries(x, y) >= y.hp * 1.1) act = 'series';
  else if (dumb) act = pick(['series', 'series', canAbil(x) ? 'abil' : 'series', x.qi < 40 ? 'conc' : 'series', canUlt(x) && x.qi >= R.qiUlt ? 'ult' : 'series']);
  else {
    const threat = !y.ultUsed && y.qi + R.qiTurn >= R.qiUlt;
    if (threat && x.qi >= R.qiDef + 5 && hpR < 0.7 && Math.random() < 0.6) act = 'def';
    else if (canUlt(x) && x.qi >= R.qiUlt && (oR < 0.6 || hpR < 0.45 || Math.random() < 0.3)) act = 'ult';
    else if (x.qi < 25 && !(canUlt(x) && oR < 0.3)) act = 'conc';
    else if (canAbil(x)) {
      const useful = { heal: hpR < 0.65, barrier: threat || hpR < 0.6, drain: y.qi >= 45, mark: !y.st.mark, weak: !y.st.weak, wound: !y.st.wound, stun: true, pierce: y.defend || y.stance === 'def', reflect: threat, seal: threat }[x.eff];
      act = useful && Math.random() < 0.75 ? 'abil' : 'series';
    } else act = 'series';
  }
  if (act === 'abil' && !canAbil(x)) act = 'series';
  if (act === 'def' && x.qi < R.qiDef) act = 'series';
  if (act === 'ult' && !canUlt(x)) act = 'series';
  doAction(x, act);
}

// ===================== СИМУЛЯЦИЯ ДЛЯ БАЛАНСА =====================
function simulate(n = 2000) {
  let wins = 0, turns = 0;
  for (let i = 0; i < n; i++) { B = newBattle(true); startTurn(); if (B.win === 'a') wins++; turns += B.a.turns; }
  B = null; return { win: wins / n, turns: turns / n };
}

// ===================== ЭКРАН (вёрстка боя — стили самой игры) =====================
const faceSrc = i => `img/face/${i}.webp`, abSrc = i => `img/abil/${i}.webp`;
const flagOf = code => code ? String.fromCodePoint(...[...code].map(ch => 127397 + ch.charCodeAt(0))) : '';
const COUNTRY = { RU: 'Россия', KR: 'Южная Корея', US: 'США', CN: 'Китай', DE: 'Германия', GE: 'Грузия', KZ: 'Казахстан', UA: 'Украина' };
const LEAGUES = [{ min: 2100, n: 'Мастер', id: 'master' }, { min: 1800, n: 'Алмаз', id: 'diamond' }, { min: 1650, n: 'Платина', id: 'platinum' },
  { min: 1500, n: 'Золото', id: 'gold' }, { min: 1000, n: 'Серебро', id: 'silver' }, { min: 0, n: 'Бронза', id: 'bronze' }];
const leagueOf = r => LEAGUES.find(l => r >= l.min);
let MENU_OPEN = true;

function viewSetup() {
  const m = CFG.me, o = CFG.op;
  const cs = Object.entries(COUNTRY).map(([k, v]) => `<option value="${k}" KSEL>${flagOf(k)} ${v}</option>`).join('');
  return `<div class="card"><h2>Пошаговый бой · прототип</h2><div class="dim">Отдельная страница для проверки правил. В саму игру пока ничего не встроено.</div></div>
  <div class="card"><h2>Твой боец</h2>
    <div class="pr-row"><div><label class="pr-l">Ник</label><input class="pr-in" id="mn" value="${esc(m.name)}"></div><div><label class="pr-l">Страна</label><select class="pr-in" id="mc">${cs.replace(`value="${m.country}" KSEL`, `value="${m.country}" selected`).replace(/ KSEL/g, '')}</select></div></div>
    <label class="pr-l">Сила: <b id="mpv">${m.p}</b></label><input type="range" min="30" max="90" value="${m.p}" id="mp" style="width:100%">
    <label class="pr-l">Портрет</label><div class="pr-ico">${Array.from({ length: 71 }, (_, i) => `<button class="${i === m.face ? 'on' : ''}" data-mf="${i}"><img loading="lazy" src="${faceSrc(i)}"></button>`).join('')}</div>
    <label class="pr-l">Способность — название</label><input class="pr-in" id="an" value="${esc(m.abName)}">
    <label class="pr-l">Иконка способности</label><div class="pr-ico">${Array.from({ length: 140 }, (_, i) => `<button class="${i === m.abIcon ? 'on' : ''}" data-ai="${i}"><img loading="lazy" src="${abSrc(i)}"></button>`).join('')}</div>
    <label class="pr-l">Эффект способности (тратит ${R.qiAbil} Цы)</label><div class="pr-fx">${EFFECTS.map(e => `<button class="${e[0] === m.eff ? 'on' : ''}" data-ef="${e[0]}"><b>${e[1]}</b>${e[2]}</button>`).join('')}</div>
    <label class="pr-l">Разрушительная — название (самый сильный удар без эффектов, ${R.qiUlt} Цы, раз за бой)</label><input class="pr-in" id="un" value="${esc(m.ultName)}">
    <label class="pr-l">Иконка разрушительной</label><div class="pr-ico">${Array.from({ length: 140 }, (_, i) => `<button class="${i === m.ultIcon ? 'on' : ''}" data-ui="${i}"><img loading="lazy" src="${abSrc(i)}"></button>`).join('')}</div>
    <label class="pr-l">Расходники с собой</label><div class="pr-its">${ITEMS.map(i => `<button class="${m.items.includes(i[0]) ? '' : 'off'}" data-mi="${i[0]}" title="${i[1]}"><img src="img/shop/${i[0]}.webp"></button>`).join('')}</div>
  </div>
  <div class="card"><h2>Соперник (бот)</h2>
    <div class="pr-row"><div><label class="pr-l">Ник</label><input class="pr-in" id="on" value="${esc(o.name)}"></div><div><label class="pr-l">Страна</label><select class="pr-in" id="oc">${cs.replace(`value="${o.country}" KSEL`, `value="${o.country}" selected`).replace(/ KSEL/g, '')}</select></div></div>
    <label class="pr-l">Сила: <b id="opv">${o.p}</b></label><input type="range" min="30" max="90" value="${o.p}" id="op" style="width:100%">
    <div class="pr-row">
    <div><label class="pr-l">Эффект</label><select class="pr-in" id="oef">${EFFECTS.map(e => `<option value="${e[0]}" ${e[0] === o.eff ? 'selected' : ''}>${e[1]}</option>`).join('')}</select></div></div>
    <label class="pr-l">Мастерство бота: <b id="osv">${Math.round(o.skill * 100)}%</b> (насколько точно читает бой)</label><input type="range" min="0" max="100" value="${Math.round(o.skill * 100)}" id="os" style="width:100%">
    <label class="pr-l">Расходники бота</label><div class="pr-its">${ITEMS.map(i => `<button class="${o.items.includes(i[0]) ? '' : 'off'}" data-oi="${i[0]}" title="${i[1]}"><img src="img/shop/${i[0]}.webp"></button>`).join('')}</div>
  </div>
  <button class="btn gold" data-a="start" style="text-align:center">В бой</button>
  <div class="card"><h2>Проверка баланса</h2><div class="dim">2000 боёв бот против бота с текущими настройками (твоего бойца ведёт ИИ-тактик).</div>
    <button class="btn" data-a="sim" style="text-align:center">Посчитать</button><div id="simres"></div></div>`;
}
function stHtml(x) {
  const s = [];
  if (x.defend) s.push(['🛡 Защита', 'good']); if (x.conc) s.push(['🧘 Концентрация', '']); if (x.exhausted) s.push(['😵 Истощение', 'bad']);
  if (x.st.barrier) s.push([`🔰 Щит ${x.st.barrier}`, 'good']); if (x.st.reflect) s.push(['🪞 Отражение', 'good']); if (x.st.smoke) s.push(['💨 В дыму', 'good']);
  if (x.st.stun) s.push(['💫 Оглушён', 'bad']); if (x.st.wound) s.push([`🩸 Рана ×${x.st.wound}`, 'bad']); if (x.st.mark) s.push([`🎯 Метка ×${x.st.mark}`, 'bad']);
  if (x.st.weak) s.push([`⬇ Ослаблен ×${x.st.weak}`, 'bad']); if (x.st.seal) s.push([`🔒 Печать ×${x.st.seal}`, 'bad']); if (x.st.rageItem) s.push(['😡 Сыворотка', '']);
  if (x.ultUsed) s.push(['💥 Ульта потрачена', '']);
  return s.map(([t, c]) => `<span class="${c}">${t}</span>`).join('');
}
function fyCard(x, id, c) {   // карточка бойца — разметка как в игре (fzCard)
  const lg = leagueOf(x.rating), S = STANCES.find(s => s[0] === x.stance);
  return `<div class="fyc ${id} ${B.done ? (B.win === c ? 'won' : 'lost') : ''} ${B.cur === c && !B.done ? 'pr-turn' : ''}">
    <div class="fyp" id="pic-${c}"><img src="${faceSrc(x.face)}" alt=""><span class="pr-stance">${S[1]} ${S[2]}</span></div>
    <div class="fyi">
      <div class="fyhd"><div class="fynr"><div class="fyn"><span class="fzfl">${flagOf(x.country)}</span><b>${esc(x.name)}</b></div>
      <div class="fyr"><img src="img/rank_${lg.id}.webp" alt=""><span class="fysep"></span><b class="fyrt">${x.rating}</b></div></div></div>
      <span class="fyteam fa"><b>FREE AGENT</b></span>
    </div>
    <div class="fybars">
      <div class="fyb"><span>HP</span><div class="fzbar hp"><i style="width:${x.hp / x.hpMax * 100}%"></i></div><em>${x.hp}/${x.hpMax}</em></div>
      <div class="fyb"><span>ЦЫ</span><div class="fzbar qi"><i style="width:${x.qi}%"></i></div><em>${x.qi}/100</em></div>
    </div>
    <div class="pr-st">${stHtml(x)}</div>
  </div>`;
}
function rng(x, y, n, base, opt = {}) { const m = dealtMul(x) * takenMul(y, opt.pierce) * (opt.k || 1) * base * n; return `${Math.round(m * (1 - R.spread) * (opt.sure ? 1 : 0.9))}–${Math.round(m * (1 + R.spread))}`; }
function menuHtml() {   // всплывающее меню хода: стойки, все удары с описанием и уроном, все расходники с описанием
  const x = B.a, y = B.b, eff = EFFECTS.find(e => e[0] === x.eff);
  const acts = [
    ['series', '<span class="pr-emo">👊</span>', 'Серия ударов', `5 ударов подряд, любой может промахнуться или стать критом.`, `≈ ${rng(x, y, R.series, R.hit(x.p))}`, `+${R.qiSeries}`, true],
    ['abil', `<img src="${abSrc(x.abIcon)}">`, x.abName, `${eff[1]}: ${eff[2].charAt(0).toLowerCase() + eff[2].slice(1)}.${x.st.seal ? ' Сейчас под печатью.' : ''}`, `≈ ${rng(x, y, 1, R.hit(x.p) * R.abilHits, { pierce: x.eff === 'pierce', k: x.eff === 'pierce' ? R.e.pierce : 1, sure: true })}`, `−${R.qiAbil}`, canAbil(x)],
    ['ult', `<img src="${abSrc(x.ultIcon)}">`, x.ultName, `Самый сильный удар, один раз за бой.${x.ultUsed ? ' Уже использована.' : x.qi < R.qiUlt ? ' Цы не хватает — после удара истощение и пропуск хода.' : ''}`, `≈ ${rng(x, y, 1, R.hit(x.p) * R.ultHits, { sure: true })}`, `−${R.qiUlt}`, canUlt(x)],
    ['def', '<span class="pr-emo">🛡</span>', 'Защита', `Блокирует ${Math.round(R.defBlock * 100)}% урона следующего хода соперника.`, '', `−${R.qiDef}`, x.qi >= R.qiDef],
    ['conc', '<span class="pr-emo">🧘</span>', 'Концентрация Цы', `Восстанавливает Цы, но в этот ход получаешь +15% урона.`, '', `+${R.qiConc}`, true],
  ];
  return `<div class="pr-menu ${MENU_OPEN ? '' : 'min'}">
    <div class="pr-mh"><div><small>Твой ход</small><b>Ходит ${esc(x.name)}</b></div>
      <div class="pr-mini">${[[x, 'a'], [y, 'b']].map(([f, c]) => `<div class="${c}"><span>${esc(f.name)}</span><i class="h"><u style="width:${f.hp / f.hpMax * 100}%"></u></i><i class="q"><u style="width:${f.qi}%"></u></i><em>${f.hp} · ${f.qi} Цы</em></div>`).join('')}</div><button class="pr-tog" data-a="mtog">${MENU_OPEN ? 'Свернуть ▾' : 'Меню ▴'}</button></div>
    <button class="pr-autob" data-a="auto">🤖 Автоход <small>— ход сделает автоматика</small></button>
    <div class="pr-mb">
      <h4>Стойка <small>— бесплатно, держится, пока не сменишь</small></h4>
      <div class="pr-seg">${STANCES.map(s => `<button class="${x.stance === s[0] ? 'on' : ''}" data-st="${s[0]}">${s[1]} ${s[2]}<small>наносишь / получаешь<br>${s[3]}</small></button>`).join('')}</div>
      <h4>Действие <small>— заканчивает ход</small></h4>
      <div class="pr-acts">${acts.map(([k, ic, n, d, dmg, c, ok]) => `<button class="pr-act ${ok ? '' : 'dis'} ${k === 'ult' ? 'ult' : ''}" data-act="${k}" ${ok ? '' : 'disabled'}><span class="pr-ic">${ic}</span><span class="pr-tx"><b>${esc(n)}</b><small>${d}</small>${dmg ? `<em>Урон ${dmg}</em>` : ''}</span><span class="pr-cost"><b>${c}</b>Цы</span></button>`).join('')}</div>
      <h4>Расходники <small>— один за ход, ход не заканчивает</small></h4>
      <div class="pr-itl">${x.items.length ? x.items.map(k => { const it = ITEMS.find(i => i[0] === k), off = x.used[k] || x.itemTurn;
        return `<button class="pr-it ${off ? 'off' : ''}" data-it="${k}" ${off ? 'disabled' : ''}><img src="img/shop/${k}.webp"><span><b>${it[1]}</b><small>${x.used[k] ? 'Уже использован в этом бою' : it[2]}</small></span></button>`; }).join('') : '<div class="dim">Расходников нет</div>'}</div>
    </div>
  </div>`;
}
function viewFight() {
  const a = B.a, b = B.b, mine = B.cur === 'a' && !B.done && B.await;
  return `<div class="fy">
    <div class="fyh"><button class="fzback" data-a="back" aria-label="Назад">←</button><div class="fyht"><div><span class="fzlogo">SPECTRE</span><span class="fzsl">/</span><b>ПОЕДИНОК</b></div><span class="fzst">Пошаговый бой · прототип</span></div></div>
    <div class="fyf">${fyCard(a, 'fa', 'a')}<div class="fyvs">VS</div>${fyCard(b, 'fb', 'b')}</div>
    <div class="pr-turnb ${B.done ? '' : mine ? 'me' : 'op'}">${B.done ? 'Бой окончен' : mine ? `Твой ход · ${esc(a.name)}` : `Ходит ${esc(B[B.cur].name)}…`}</div>
    <div class="fyl"><div class="fylh"><h3>Журнал боя</h3></div>
      <div class="flog" id="flog">${B.log.map(([t, c]) => `<div class="${{ t: 'crit', a: 'qi', b: '', gold: 'ab', dim: 'nt' }[c] || ''}">${esc(t)}</div>`).join('')}</div></div>
    ${B.done ? '' : '<button class="btn pr-ff" data-a="ff" style="text-align:center">⏩ Досчитать бой</button><div class="dim" style="text-align:center;font-size:13px;margin-top:-6px">Оставшиеся ходы за обоих сыграет автоматика — сразу к результату.</div>'}
    ${mine ? '<div style="height:52vh"></div>' : ''}
  </div>${mine ? menuHtml() : ''}`;
}
function winOverlay() {   // как в игре: «ПОБЕДИТЕЛЬ», портрет, ник, страна, ранг, рейтинг, «Продолжить»
  const W = B[B.win], lg = leagueOf(W.rating), mine = B.win === 'a' ? '<div class="fwres plus">Победа!</div>' : '<div class="fwres minus">Поражение</div>';
  const ov = document.createElement('div'); ov.className = 'fwin';
  ov.innerHTML = `<div class="fwbox">${mine}<div class="fwt">ПОБЕДИТЕЛЬ</div>
    <div class="fwpic"><img src="${faceSrc(W.face)}" alt=""></div>
    <div class="fwn"><span class="fzfl">${flagOf(W.country)}</span><b>${esc(W.name)}</b></div>
    <div class="dim">${esc(COUNTRY[W.country] || '')}</div>
    <div class="fwr"><img src="img/rank_${lg.id}.webp" alt=""><span>${lg.n}</span><b>${W.rating}</b></div>
    <button class="btn gold" data-a="cont" style="text-align:center">Продолжить</button>
    <button class="btn" data-a="again" style="text-align:center">Реванш</button></div>`;
  return ov;
}
let shownWin = false;
function render() {
  const app = document.getElementById('app');
  app.dataset.view = VIEW === 'setup' ? 'setup' : 'fight';
  app.innerHTML = VIEW === 'setup' ? viewSetup() : viewFight();
  const l = document.getElementById('flog'); if (l) l.scrollTop = l.scrollHeight;
  if (VIEW === 'fight' && B && B.done && !shownWin) { shownWin = true; setTimeout(() => { if (B && B.done && !document.querySelector('.fwin')) document.body.appendChild(winOverlay()); }, 900); }
}
function readSetup() {
  const v = id => document.getElementById(id);
  if (!v('mn')) return;
  Object.assign(CFG.me, { name: v('mn').value || 'Игрок', country: v('mc').value, p: +v('mp').value, abName: v('an').value || 'Способность', ultName: v('un').value || 'Разрушительный удар' });
  Object.assign(CFG.op, { name: v('on').value || 'Бот', country: v('oc').value, p: +v('op').value, eff: v('oef').value, skill: +v('os').value / 100 });
}
function startBattle() { document.querySelectorAll('.fwin').forEach(e => e.remove()); shownWin = false; MENU_OPEN = true; B = newBattle(false); VIEW = 'fight'; render(); setTimeout(startTurn, 400); window.scrollTo(0, 0); }
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'mp') document.getElementById('mpv').textContent = t.value;
  if (t.id === 'op') document.getElementById('opv').textContent = t.value;
  if (t.id === 'os') document.getElementById('osv').textContent = t.value + '%';
});
document.addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  const d = t.dataset;
  if (d.a === 'cont') { document.querySelectorAll('.fwin').forEach(e => e.remove()); VIEW = 'setup'; B = null; render(); window.scrollTo(0, 0); return; }
  if (d.a === 'again') { startBattle(); return; }
  if (VIEW === 'setup') {
    readSetup();
    if (d.ai != null) { CFG.me.abIcon = +d.ai; render(); }
    else if (d.ui != null) { CFG.me.ultIcon = +d.ui; render(); }
    else if (d.mf != null) { CFG.me.face = +d.mf; render(); }
    else if (d.ef) { CFG.me.eff = d.ef; render(); }
    else if (d.mi) { const a = CFG.me.items; CFG.me.items = a.includes(d.mi) ? a.filter(k => k !== d.mi) : [...a, d.mi]; render(); }
    else if (d.oi) { const a = CFG.op.items; CFG.op.items = a.includes(d.oi) ? a.filter(k => k !== d.oi) : [...a, d.oi]; render(); }
    else if (d.a === 'start') startBattle();
    else if (d.a === 'sim') {
      const r = simulate(2000);
      document.getElementById('simres').innerHTML = `<div class="pr-sim"><span>Победы твоего бойца (ИИ)</span><b>${Math.round(r.win * 100)}%</b><span>Средняя длина боя</span><b>${r.turns.toFixed(1)} хода</b></div>`;
    }
    return;
  }
  if (d.a === 'back') { VIEW = 'setup'; B = null; render(); return; }
  if (d.a === 'mtog') { MENU_OPEN = !MENU_OPEN; render(); return; }
  if (d.a === 'ff') { if (!B || B.done) return; B.fast = true; log('⏩ Бой досчитан автоматически.', 't'); if (B.await) { B.await = false; aiTurn(B.a); } render(); return; }   // если сейчас ход бота — его таймер доиграет бой мгновенно
  if (d.a === 'auto') { if (!B || B.done || !B.await) return; log(`${B.a.name}: автоход.`, 'dim'); aiTurn(B.a); return; }
  if (!B || B.done || !B.await) return;
  const a = B.a;
  if (d.st) { a.stance = d.st; render(); }
  else if (d.it) { if (a.used[d.it] || a.itemTurn) return; useItem(a, d.it); render(); }
  else if (d.act) {
    if (d.act === 'abil' && !canAbil(a)) return; if (d.act === 'def' && a.qi < R.qiDef) return; if (d.act === 'ult' && !canUlt(a)) return;
    doAction(a, d.act);
  }
});
render();
</script>
